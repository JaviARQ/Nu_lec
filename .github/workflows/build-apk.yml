              private fun updateLibraryColumns() {
                  (libraryRecycler.layoutManager as? GridLayoutManager)?.spanCount = computeLibraryColumns()
              }
          
              private fun computeLibraryColumns(): Int {
                  val stored = prefs().getInt("pref_library_columns", 0)
                  if (stored > 0) return stored
                  val widthDp = resources.configuration.screenWidthDp
                  val isLandscape = resources.configuration.orientation == Configuration.ORIENTATION_LANDSCAPE
                  return if (isLandscape) {
                      when {
                          widthDp >= 900 -> 5
                          widthDp >= 700 -> 4
                          else -> 3
                      }
                  } else 3
              }
          
