                                layoutParams = LinearLayout.LayoutParams(
                                    0, FrameLayout.LayoutParams.WRAP_CONTENT, 1f
                                ).apply { marginStart = dp(4) }
                            }
                            folderName.tag = "folder_name"
                            navRow.addView(btnBackFolder)
                            navRow.addView(folderName)
                            libraryRoot.addView(navRow)
          
                            libraryHint = TextView(this).apply {
                                textSize = 12f
                                setPadding(dp(4), 0, 0, dp(12))
                            }
                            libraryRoot.addView(libraryHint)
                            btnPickLibrary = Button(this).apply {
                                text = "Elegir carpeta biblioteca"
                                setOnClickListener { pickLibraryTreeLauncher.launch(null) }
                            }
