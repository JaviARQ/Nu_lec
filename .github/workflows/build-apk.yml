name: Build APK

on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout del repositorio
        uses: actions/checkout@v5

      - name: Setup Java 17 (Temurin)
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - name: Setup Gradle 9.3.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      - name: Aceptar licencias del Android SDK
        run: yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses > /dev/null || true

      - name: Instalar SDK Platform 37 + build-tools
        run: |
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager \
            "platforms;android-37" \
            "build-tools;37.0.0" > /dev/null || true

      - name: Restaurar keystore de firma (fijo)
        run: |
          mkdir -p app
          echo "$KEYSTORE_BASE64" | base64 -d > app/nulec.keystore
          ls -la app/nulec.keystore
        env:
          KEYSTORE_BASE64: 


      - name: Escribir archivos del proyecto
        run: |
          # --- settings.gradle.kts ---
          cat > settings.gradle.kts <<'EOF'
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
                  maven { url = uri("https://jitpack.io") }
              }
          }
          rootProject.name = "Nu_lec"
          include(":app")
          EOF

          # --- build.gradle.kts (root) ---
          cat > build.gradle.kts <<'EOF'
          buildscript {
              dependencies {
                  classpath("org.jetbrains.kotlin:kotlin-gradle-plugin:2.4.20")
              }
          }
          plugins {
              id("com.android.application") version "9.1.1" apply false
          }
          EOF

          # --- gradle.properties ---
          cat > gradle.properties <<'EOF'
          android.useAndroidX=true
          kotlin.code.style=official
          org.gradle.jvmargs=-Xmx2g -Dfile.encoding=UTF-8
          android.nonTransitiveRClass=true
          EOF

          # --- app/build.gradle.kts ---
          mkdir -p app
          cat > app/build.gradle.kts <<'EOF'
          plugins {
              id("com.android.application")
          }

          android {
              namespace = "com.lector.epub"
              compileSdk = 37

              signingConfigs {
                  create("release") {
                      storeFile = file("nulec.keystore")
                      storePassword = "nulec2025"
                      keyAlias = "nulec"
                      keyPassword = "nulec2025"
                  }
              }

              defaultConfig {
                  applicationId = "com.lector.epub"
                  minSdk = 24
                  targetSdk = 35
                  versionCode = 12
                  versionName = "1.4"
              }

              buildTypes {
                  debug {
                      isMinifyEnabled = false
                      signingConfig = signingConfigs.getByName("release")
                  }
              }

              compileOptions {
                  sourceCompatibility = JavaVersion.VERSION_17
                  targetCompatibility = JavaVersion.VERSION_17
                  isCoreLibraryDesugaringEnabled = true
              }
              buildFeatures {
                  viewBinding = true
              }
          }

          kotlin {
              compilerOptions {
                  jvmTarget.set(org.jetbrains.kotlin.gradle.dsl.JvmTarget.JVM_17)
              }
          }

          dependencies {
              coreLibraryDesugaring("com.android.tools:desugar_jdk_libs:2.1.5")
              implementation("androidx.core:core-ktx:1.13.1")
              implementation("androidx.appcompat:appcompat:1.7.0")
              implementation("com.google.android.material:material:1.12.0")
              implementation("androidx.activity:activity-ktx:1.9.2")
              implementation("androidx.fragment:fragment-ktx:1.8.3")
              implementation("androidx.lifecycle:lifecycle-runtime-ktx:2.8.5")
              implementation("androidx.recyclerview:recyclerview:1.3.2")
              implementation("org.jetbrains.kotlinx:kotlinx-coroutines-android:1.8.1")
              implementation("org.readium.kotlin-toolkit:readium-shared:3.4.0")
              implementation("org.readium.kotlin-toolkit:readium-streamer:3.4.0")
              implementation("org.readium.kotlin-toolkit:readium-navigator:3.4.0")
          }
          EOF

          # --- AndroidManifest.xml ---
          mkdir -p app/src/main/java/com/lector/epub
          mkdir -p app/src/main/res/layout
          mkdir -p app/src/main/res/values
          mkdir -p app/src/main/res/values-night
          mkdir -p app/src/main/res/drawable
          mkdir -p app/src/main/res/mipmap-anydpi-v26
          mkdir -p app/src/main/res/mipmap-mdpi
          mkdir -p app/src/main/res/mipmap-hdpi
          mkdir -p app/src/main/res/mipmap-xhdpi
          mkdir -p app/src/main/res/mipmap-xxhdpi
          mkdir -p app/src/main/res/mipmap-xxxhdpi

          cat > app/src/main/AndroidManifest.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <application
                  android:name=".LectorApp"
                  android:allowBackup="true"
                  android:icon="@mipmap/ic_launcher"
                  android:roundIcon="@mipmap/ic_launcher_round"
                  android:label="@string/app_name"
                  android:supportsRtl="true"
                  android:theme="@style/Theme.NuLec">
                  <activity
                      android:name=".MainActivity"
                      android:exported="true"
                      android:configChanges="orientation|screenSize|keyboardHidden">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>
              </application>
          </manifest>
          EOF

          # --- LectorApp.kt ---
          cat > app/src/main/java/com/lector/epub/LectorApp.kt <<'EOF'
          package com.lector.epub

          import android.app.Application
          import org.readium.r2.shared.util.asset.AssetRetriever
          import org.readium.r2.shared.util.http.DefaultHttpClient
          import org.readium.r2.streamer.PublicationOpener
          import org.readium.r2.streamer.parser.DefaultPublicationParser

          class LectorApp : Application() {
              lateinit var assetRetriever: AssetRetriever
                  private set
              lateinit var publicationOpener: PublicationOpener
                  private set
              override fun onCreate() {
                  super.onCreate()
                  val httpClient = DefaultHttpClient()
                  assetRetriever = AssetRetriever(contentResolver, httpClient)
                  publicationOpener = PublicationOpener(
                      publicationParser = DefaultPublicationParser(
                          context = this,
                          httpClient = httpClient,
                          assetRetriever = assetRetriever,
                          pdfFactory = null,
                      ),
                  )
              }
          }
          EOF

          # --- LibraryEntry.kt ---
          cat > app/src/main/java/com/lector/epub/LibraryEntry.kt <<'EOF'
          package com.lector.epub

          import android.graphics.Bitmap
          import android.net.Uri

          /**
           * Tipo de entrada en la biblioteca.
           *  - BOOK: archivo .epub individual.
           *  - COLLECTION: subcarpeta que contiene mas .epub.
           */
          enum class LibraryEntryType { BOOK, COLLECTION }

          data class LibraryEntry(
              val fileName: String,
              val title: String,
              val cover: Bitmap?,
              val documentUri: Uri,
              val type: LibraryEntryType = LibraryEntryType.BOOK,
              /** Para COLLECTION: nº de libros que contiene. */
              val bookCount: Int = 0,
          )
          EOF

          # --- LibraryAdapter.kt ---
          cat > app/src/main/java/com/lector/epub/LibraryAdapter.kt <<'EOF'
          package com.lector.epub

          import android.graphics.Canvas
          import android.graphics.Color
          import android.graphics.Outline
          import android.graphics.Paint
          import android.graphics.Rect
          import android.graphics.Typeface
          import android.graphics.drawable.GradientDrawable
          import android.text.TextUtils
          import android.view.Gravity
          import android.view.View
          import android.view.ViewGroup
          import android.view.ViewOutlineProvider
          import android.widget.ImageView
          import android.widget.LinearLayout
          import android.widget.TextView
          import androidx.recyclerview.widget.RecyclerView

          /**
           * Biblioteca en rejilla: tarjetas con esquinas redondeadas, sombra suave,
           * portada con placeholder generado cuando el EPUB no trae portada.
           * Soporta tipo BOOK (libro individual) y COLLECTION (subcarpeta).
           */
          class LibraryAdapter(
              private val items: MutableList<LibraryEntry> = mutableListOf(),
              private val onClick: (LibraryEntry) -> Unit,
          ) : RecyclerView.Adapter<LibraryAdapter.VH>() {

              var isDark: Boolean = false
                  set(value) {
                      field = value
                      notifyDataSetChanged()
                  }

              fun submit(newItems: List<LibraryEntry>) {
                  items.clear()
                  items.addAll(newItems)
                  notifyDataSetChanged()
              }

              inner class VH(val root: LinearLayout) : RecyclerView.ViewHolder(root) {
                  val cover: ImageView = (root.getChildAt(0) as ImageView)
                  val title: TextView = (root.getChildAt(1) as TextView)
                  val subtitle: TextView = (root.getChildAt(2) as TextView)
              }

              override fun onCreateViewHolder(parent: ViewGroup, viewType: Int): VH {
                  val ctx = parent.context
                  val dp = { v: Int -> (v * ctx.resources.displayMetrics.density).toInt() }
                  val density = ctx.resources.displayMetrics.density

                  val root = LinearLayout(ctx).apply {
                      orientation = LinearLayout.VERTICAL
                      gravity = Gravity.CENTER_HORIZONTAL
                      layoutParams = ViewGroup.LayoutParams(dp(112), ViewGroup.LayoutParams.WRAP_CONTENT)
                      setPadding(dp(6), dp(8), dp(6), dp(12))
                      clipToOutline = true
                      elevation = dp(3).toFloat()
                      outlineProvider = object : ViewOutlineProvider() {
                          override fun getOutline(view: View, outline: Outline) {
                              outline.setRoundRect(0, 0, view.width, view.height, 18 * density)
                          }
                      }
                  }
                  val cover = ImageView(ctx).apply {
                      layoutParams = LinearLayout.LayoutParams(dp(100), dp(150))
                      scaleType = ImageView.ScaleType.CENTER_CROP
                      clipToOutline = true
                      outlineProvider = object : ViewOutlineProvider() {
                          override fun getOutline(view: View, outline: Outline) {
                              outline.setRoundRect(0, 0, view.width, view.height, 12 * density)
                          }
                      }
                  }
                  val title = TextView(ctx).apply {
                      layoutParams = LinearLayout.LayoutParams(dp(100), ViewGroup.LayoutParams.WRAP_CONTENT)
                      maxLines = 2
                      ellipsize = TextUtils.TruncateAt.END
                      textSize = 12.5f
                      setTypeface(null, Typeface.MEDIUM)
                      gravity = Gravity.CENTER_HORIZONTAL
                      setPadding(0, dp(10), 0, 0)
                      setLineSpacing(dp(2).toFloat(), 1f)
                  }
                  val subtitle = TextView(ctx).apply {
                      layoutParams = LinearLayout.LayoutParams(dp(100), ViewGroup.LayoutParams.WRAP_CONTENT)
                      maxLines = 1
                      ellipsize = TextUtils.TruncateAt.END
                      textSize = 10f
                      setTypeface(null, Typeface.NORMAL)
                      gravity = Gravity.CENTER_HORIZONTAL
                      setPadding(0, dp(2), 0, 0)
                      visibility = View.GONE
                  }
                  root.addView(cover)
                  root.addView(title)
                  root.addView(subtitle)
                  return VH(root)
              }

              override fun onBindViewHolder(holder: VH, position: Int) {
                  val e = items[position]
                  val density = holder.root.resources.displayMetrics.density

                  if (e.type == LibraryEntryType.COLLECTION) {
                      // Carpetas: icono de carpeta dibujado + contador de libros.
                      holder.cover.setImageBitmap(folderPlaceholder(e.title, e.bookCount, isDark))
                      holder.title.text = e.title
                      holder.title.setTextColor(if (isDark) 0xFFEDEDED.toInt() else 0xFF1A1A1A.toInt())
                      holder.subtitle.text = "${e.bookCount} libros"
                      holder.subtitle.setTextColor(if (isDark) 0xFF8AB4F8.toInt() else 0xFF2563EB.toInt())
                      holder.subtitle.visibility = View.VISIBLE
                  } else {
                      // Libro individual.
                      if (e.cover != null) {
                          holder.cover.setImageBitmap(e.cover)
                      } else {
                          holder.cover.setImageBitmap(placeholderFor(e.title, isDark))
                      }
                      holder.title.text = e.title
                      holder.title.setTextColor(if (isDark) 0xFFEDEDED.toInt() else 0xFF1A1A1A.toInt())
                      holder.subtitle.visibility = View.GONE
                  }

                  val cardBg = GradientDrawable().apply {
                      cornerRadius = 18 * density
                      setColor(if (isDark) 0xFF1F1F1F.toInt() else 0xFFFFFFFF.toInt())
                  }
                  holder.root.background = cardBg
                  holder.root.setOnClickListener { onClick(e) }
              }

              /** Placeholder de carpeta: fondo azul con icono de carpeta y nombre. */
              private fun folderPlaceholder(name: String, count: Int, dark: Boolean): android.graphics.Bitmap {
                  val w = 200; val h = 300
                  val bmp = android.graphics.Bitmap.createBitmap(w, h, android.graphics.Bitmap.Config.ARGB_8888)
                  val canvas = Canvas(bmp)
                  val bgPaint = Paint().apply {
                      isAntiAlias = true
                      color = if (dark) 0xFF1E2A3A.toInt() else 0xFFE3EDF7.toInt()
                  }
                  canvas.drawRect(0f, 0f, w.toFloat(), h.toFloat(), bgPaint)

                  // Icono de carpeta centrado (forma simple).
                  val folderPaint = Paint().apply {
                      isAntiAlias = true
                      color = if (dark) 0xFF8AB4F8.toInt() else 0xFF2563EB.toInt()
                  }
                  // Cuerpo de la carpeta
                  val rect = android.graphics.RectF(40f, 110f, 160f, 200f)
                  canvas.drawRoundRect(rect, 8f, 8f, folderPaint)
                  // Pestaña superior
                  val tab = android.graphics.RectF(40f, 90f, 90f, 115f)
                  canvas.drawRoundRect(tab, 6f, 6f, folderPaint)

                  // Texto del contador
                  val tp = Paint().apply {
                      isAntiAlias = true
                      color = Color.WHITE
                      textAlign = Paint.Align.CENTER
                      textSize = 36f
                      typeface = Typeface.create(Typeface.DEFAULT, Typeface.BOLD)
                  }
                  canvas.drawText("$count", w / 2f, 170f, tp)
                  return bmp
              }

              /** Placeholder dibujado: iniciales sobre gradiente de color. */
              private fun placeholderFor(title: String, dark: Boolean): android.graphics.Bitmap {
                  val w = 200; val h = 300
                  val bmp = android.graphics.Bitmap.createBitmap(w, h, android.graphics.Bitmap.Config.ARGB_8888)
                  val canvas = Canvas(bmp)
                  val hue = (title.hashCode().absoluteValue() % 360).toFloat()
                  val hsv1 = floatArrayOf(hue, 0.45f, if (dark) 0.30f else 0.85f)
                  val hsv2 = floatArrayOf((hue + 40) % 360, 0.50f, if (dark) 0.20f else 0.70f)
                  val paint = Paint().apply {
                      isAntiAlias = true
                      shader = android.graphics.LinearGradient(0f, 0f, w.toFloat(), h.toFloat(),
                          intArrayOf(Color.HSVToColor(hsv1), Color.HSVToColor(hsv2)),
                          null, android.graphics.Shader.TileMode.CLAMP)
                  }
                  canvas.drawRect(0f, 0f, w.toFloat(), h.toFloat(), paint)

                  val initials = title.split(" ", "_", "-")
                      .filter { it.isNotBlank() }
                      .take(2)
                      .joinToString("") { it.first().uppercaseChar().toString() }
                      .ifEmpty { "?" }
                  val tp = Paint().apply {
                      isAntiAlias = true
                      color = Color.WHITE
                      textAlign = Paint.Align.CENTER
                      textSize = 72f
                      typeface = Typeface.create(Typeface.DEFAULT, Typeface.BOLD)
                      setShadowLayer(8f, 0f, 2f, 0x44000000)
                  }
                  val rect = Rect()
                  tp.getTextBounds(initials, 0, initials.length, rect)
                  canvas.drawText(initials, w / 2f, h / 2f - rect.exactCenterY(), tp)
                  return bmp
              }

              private fun Int.absoluteValue(): Int = if (this < 0) -this else this

              override fun getItemCount(): Int = items.size
          }
          EOF

          # --- MainActivity.kt ---
          cat > app/src/main/java/com/lector/epub/MainActivity.kt <<'EOF'
          package com.lector.epub

          import android.content.Intent
          import android.content.res.Configuration
          import android.graphics.Bitmap
          import android.graphics.Color
          import android.graphics.Typeface
          import android.graphics.drawable.GradientDrawable
          import android.net.Uri
          import android.os.Build
          import android.os.Bundle
          import android.provider.DocumentsContract
          import android.provider.DocumentsContract.Document
          import android.provider.OpenableColumns
          import android.view.Gravity
          import android.view.MotionEvent
          import android.view.View
          import android.view.WindowInsets
          import android.view.WindowInsetsController
          import android.widget.Button
          import android.widget.FrameLayout
          import android.widget.ImageButton
          import android.widget.LinearLayout
          import android.widget.ProgressBar
          import android.widget.SeekBar
          import android.widget.TextView
          import android.widget.Toast
          import androidx.activity.result.contract.ActivityResultContracts
          import androidx.appcompat.app.AlertDialog
          import androidx.appcompat.app.AppCompatActivity
          import androidx.lifecycle.lifecycleScope
          import androidx.recyclerview.widget.GridLayoutManager
          import androidx.recyclerview.widget.RecyclerView
          import kotlinx.coroutines.CoroutineScope
          import kotlinx.coroutines.Dispatchers
          import kotlinx.coroutines.Job
          import kotlinx.coroutines.SupervisorJob
          import kotlinx.coroutines.delay
          import kotlinx.coroutines.launch
          import kotlinx.coroutines.withContext
          import org.json.JSONObject
          import org.readium.r2.navigator.epub.EpubNavigatorFactory
          import org.readium.r2.navigator.epub.EpubNavigatorFragment
          import org.readium.r2.navigator.preferences.FontFamily
          import org.readium.r2.navigator.preferences.Theme
          import org.readium.r2.shared.ExperimentalReadiumApi
          import org.readium.r2.shared.publication.Link
          import org.readium.r2.shared.publication.Locator
          import org.readium.r2.shared.publication.services.cover
          import java.io.File
          import java.text.SimpleDateFormat
          import java.util.Date
          import java.util.Locale

          /**
           * Nu_lec - lector EPUB minimalista con sincronizacion de posicion.
           *
           * LIBRARY: rejilla de libros (portada + titulo) con tema claro/oscuro.
           *   Sin botones cuando ya hay biblioteca elegida (viven en Ajustes).
           *   La status bar SIEMPRE visible en biblioteca.
           * READER: pantalla completa inmersiva. Tap centro alterna overlays:
           *   arriba: [icono atras] titulo [icono ajustes]
           *   abajo:  [icono cap<] progreso global del libro [icono cap>] + capitulo.
           * AJUSTES: tema, brillo, fuente/tamano, carpeta biblioteca, abrir externo.
           */
          class MainActivity : AppCompatActivity() {

              private val app: LectorApp get() = application as LectorApp
              private val appScope = CoroutineScope(SupervisorJob() + Dispatchers.IO)
              private val density get() = resources.displayMetrics.density
              private fun dp(v: Int) = (v * density).toInt()

              // Paleta
              private val ACCENT = 0xFF2563EB.toInt()
              private val ACCENT_DARK = 0xFF3B82F6.toInt()

              // ----- Tema -----
              private val isDark: Boolean
                  get() = when (prefs().getString("pref_theme", "AUTO")) {
                      "DARK" -> true
                      "LIGHT" -> false
                      else -> (resources.configuration.uiMode and
                          Configuration.UI_MODE_NIGHT_MASK) == Configuration.UI_MODE_NIGHT_YES
                  }

              // ----- Vistas: LIBRARY -----
              private lateinit var libraryRoot: LinearLayout
              private lateinit var headerTitle: TextView
              private lateinit var headerSub: TextView
              private lateinit var libraryHint: TextView
              private lateinit var btnPickLibrary: Button
              private lateinit var btnOpenExternal: Button
              private lateinit var libraryRecycler: RecyclerView
              private lateinit var btnBackFolder: ImageButton
              /**
               * URI del documento de la carpeta actualmente abierta.
               * Si es null, equivale a la carpeta raiz (libraryTreeUri).
               * Se almacena el documentUri (no el treeUri) para poder listar hijos.
               */
              private var currentFolderUri: Uri? = null
              private val libraryAdapter = LibraryAdapter { entry ->
                  if (entry.type == LibraryEntryType.COLLECTION) {
                      lifecycleScope.launch { enterFolder(entry.documentUri, entry.title) }
                  } else {
                      lifecycleScope.launch { openEpubFromLibrary(entry) }
                  }
              }

              // ----- Vistas: READER -----
              private lateinit var readerRoot: FrameLayout
              private lateinit var navContainer: FrameLayout
              private lateinit var topBar: LinearLayout
              private lateinit var topBarTitle: TextView
              private lateinit var bottomBar: LinearLayout
              private lateinit var progressText: TextView
              private lateinit var progressBar: ProgressBar
              private lateinit var chapterText: TextView
              private lateinit var btnPrevChapter: ImageButton
              private lateinit var btnNextChapter: ImageButton

              // ----- Vistas: PANEL AJUSTES -----
              private lateinit var settingsPanel: LinearLayout
              private lateinit var brightnessSeekBar: SeekBar
              private lateinit var brightnessValue: TextView
              private lateinit var fontSizeValue: TextView
              private val themeChips = mutableListOf<Button>()
              private val fontChips = mutableListOf<Button>()
              private val otherChips = mutableListOf<Button>()
              private val sectionLabels = mutableListOf<TextView>()
              private var settingsVisible = false

              // ----- Estado -----
              private var navigator: EpubNavigatorFragment? = null
              private var currentBookName: String? = null
              /** Carpeta donde esta el libro abierto (para guardar el sidecar JSON ahi). */
              private var currentBookFolderUri: Uri? = null
              private var sidecarJob: Job? = null
              private var lastLocator: Locator? = null
              private var lastTotalPages: Int = 1
              private var lastPageIndex: Int = 0
              /** Lista de capítulos para navegación lineal (readingOrder). */
              private var chapters: List<Link> = emptyList()
              /** Tabla de contenidos jerárquica (para el selector de capítulos). */
              private var tableOfContents: List<Link> = emptyList()
              private var chapterIndex: Int = -1
              private var libraryTreeUri: Uri? = null

              private val openEpubLauncher = registerForActivityResult(
                  ActivityResultContracts.OpenDocument()
              ) { uri ->
                  if (uri != null) lifecycleScope.launch { openEpubExternal(uri) }
              }

              private val pickLibraryTreeLauncher = registerForActivityResult(
                  ActivityResultContracts.OpenDocumentTree()
              ) { uri ->
                  if (uri != null) {
                      contentResolver.takePersistableUriPermission(
                          uri,
                          Intent.FLAG_GRANT_READ_URI_PERMISSION or
                              Intent.FLAG_GRANT_WRITE_URI_PERMISSION
                      )
                      prefs().edit().putString("library_tree_uri", uri.toString()).apply()
                      libraryTreeUri = uri
                      currentFolderUri = null
                      refreshLibraryButtons()
                      applyGlobalTheme()
                      lifecycleScope.launch { reloadLibrary() }
                  }
              }

              @OptIn(ExperimentalReadiumApi::class)
              override fun onCreate(savedInstanceState: Bundle?) {
                  super.onCreate(savedInstanceState)
                  libraryTreeUri = prefs().getString("library_tree_uri", null)?.let {
                      runCatching { Uri.parse(it) }.getOrNull()
                  }
                  buildUI()
                  applyGlobalTheme()
                  if (libraryTreeUri != null) {
                      lifecycleScope.launch { reloadLibrary() }
                  }
              }

              // ============== CONSTRUCCION DE LA UI ==============

              private fun buildUI() {
                  val root = FrameLayout(this)

                  // ============== LIBRARY ==============
                  libraryRoot = LinearLayout(this).apply {
                      orientation = LinearLayout.VERTICAL
                      setPadding(dp(24), dp(48), dp(24), dp(24))
                  }
                  headerTitle = TextView(this).apply {
                      text = "Nu_lec"
                      textSize = 34f
                      setTypeface(null, Typeface.BOLD)
                      letterSpacing = 0.01f
                      setPadding(dp(4), 0, 0, 0)
                  }
                  libraryRoot.addView(headerTitle)
                  headerSub = TextView(this).apply {
                      text = "Tu biblioteca"
                      textSize = 13f
                      setTypeface(null, Typeface.NORMAL)
                      letterSpacing = 0.04f
                      setPadding(dp(4), dp(4), 0, dp(8))
                  }
                  libraryRoot.addView(headerSub)

                  // Fila de navegacion: boton "←" + nombre de carpeta actual.
                  val navRow = LinearLayout(this).apply {
                      orientation = LinearLayout.HORIZONTAL
                      gravity = Gravity.CENTER_VERTICAL
                      setPadding(dp(4), 0, 0, dp(12))
                      visibility = View.GONE
                    }
                  navRow.tag = "folder_nav_row"
                  btnBackFolder = ImageButton(this).apply {
                      setImageResource(R.drawable.ic_back_folder)
                      background = null
                      setPadding(dp(8), dp(8), dp(8), dp(8))
                      setOnClickListener { goUpFolder() }
                  }
                  val folderName = TextView(this).apply {
                      id = View.generateViewId()
                      textSize = 14f
                      setTypeface(null, Typeface.MEDIUM)
                      maxLines = 1
                      ellipsize = android.text.TextUtils.TruncateAt.MIDDLE
