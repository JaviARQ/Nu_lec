              /**
               * Aplica al navigator de cómic: color de fondo, sentido de lectura (LTR/RTL),
               * modo de visualización (scaleType) y keep-screen-on si está activado.
               */
              private fun applyComicNavigatorStyle(view: View) {
                  val bg = when (loadComicBgColor()) {
                      0 -> Color.BLACK
                      1 -> Color.WHITE
                      else -> if (isDark) Color.BLACK else Color.WHITE
                  }
                  view.setBackgroundColor(bg)
                  view.layoutDirection = if (loadComicReadingDir() == "RTL")
                      View.LAYOUT_DIRECTION_RTL else View.LAYOUT_DIRECTION_LTR
                  if (loadComicKeepScreen()) view.setKeepScreenOn(true)
              }
          
              // ===== General (library + keep screen) =====
          
              private fun applyLibraryColumns(cols: Int) {
                  prefs().edit().putInt("pref_library_columns", cols).apply()
                  updateLibraryColumns()
              }
          
              private fun updateLibraryColumns() {
                  (libraryRecycler.layoutManager as? GridLayoutManager)?.spanCount = computeLibraryColumns()
              }
          
              private fun computeLibraryColumns(): Int {
                  val stored = prefs().getInt("pref_library_columns", 0)
                  if (stored > 0) return stored
                  val widthDp = resources.configuration.screenWidthDp
                  val isLandscape = resources.configuration.orientation == Configuration.ORIENTATION_LANDSCAPE
                  return if (isLandscape) {
                      when {
                          widthDp >= 900 -> 5
                          widthDp >= 700 -> 4
                          else -> 3
                      }
                  } else 3
              }
          
              private fun applyKeepScreen(v: Boolean) {
                  prefs().edit().putBoolean("pref_keep_screen", v).apply()
                  applyKeepScreenToWindow()
              }
          
              private fun applyKeepScreenToWindow() {
                  if (prefs().getBoolean("pref_keep_screen", false)) {
                      window.addFlags(WindowManager.LayoutParams.FLAG_KEEP_SCREEN_ON)
                  } else {
                      window.clearFlags(WindowManager.LayoutParams.FLAG_KEEP_SCREEN_ON)
                  }
              }
          
