                  themeButtons.addView(themeBtn("Auto", null))
                  themeButtons.addView(themeBtn("Claro", Theme.LIGHT))
                  themeButtons.addView(themeBtn("Sepia", Theme.SEPIA))
                  themeButtons.addView(themeBtn("Oscuro", Theme.DARK))
                  settingsPanel.addView(themeButtons)

                  settingsPanel.addView(TextView(this).apply {
                      text = "Brillo"
                      textSize = 13f
                      setPadding(0, dp(16), 0, dp(4))
                  })
                  val brightnessRow = LinearLayout(this).apply { orientation = LinearLayout.HORIZONTAL }
                  brightnessSeekBar = SeekBar(this).apply {
                      max = 100
                      progress = (loadBrightness() * 100).toInt().coerceIn(0, 100)
                      setOnSeekBarChangeListener(object : SeekBar.OnSeekBarChangeListener {
                          override fun onProgressChanged(sb: SeekBar?, p: Int, fromUser: Boolean) {
                              if (fromUser) applyBrightness(p / 100f)
                              brightnessValue.text = "$p%"
                          }
                          override fun onStartTrackingTouch(sb: SeekBar?) {}
                          override fun onStopTrackingTouch(sb: SeekBar?) {
