                      setOnClickListener { applyFontSizeDelta(-0.1) }
                  }
                  fontSizeValue = TextView(this).apply {
                      text = "100%"
                      setPadding(dp(12), 0, dp(12), 0)
                      gravity = Gravity.CENTER
                      layoutParams = LinearLayout.LayoutParams(0, FrameLayout.LayoutParams.WRAP_CONTENT, 1f)
                  }
                  fontSizePlus = Button(this).apply {
                      text = "A+"
                      setOnClickListener { applyFontSizeDelta(+0.1) }
                  }
                  fontSizeRow.addView(fontSizeMinus)
                  fontSizeRow.addView(fontSizeValue)
                  fontSizeRow.addView(fontSizePlus)
                  settingsPanel.addView(fontSizeRow)

                  settingsPanel.addView(TextView(this).apply {
                      text = "Biblioteca"
                      textSize = 13f
                      setPadding(0, dp(20), 0, dp(4))
                  })
                  settingsPanel.addView(Button(this).apply {
                      text = "Cambiar carpeta biblioteca"
                      setOnClickListener { pickLibraryTreeLauncher.launch(null) }
                  })

                  readerRoot.addView(settingsPanel, FrameLayout.LayoutParams(
                      FrameLayout.LayoutParams.MATCH_PARENT,
                      FrameLayout.LayoutParams.WRAP_CONTENT,
                      Gravity.CENTER
                  ))

                  root.addView(readerRoot, FrameLayout.LayoutParams(
                      FrameLayout.LayoutParams.MATCH_PARENT,
                      FrameLayout.LayoutParams.MATCH_PARENT
                  ))

                  setContentView(root)
              }

              // ============== LIBRARY ==============
              private suspend fun reloadLibrary() {
                  val tree = libraryTreeUri ?: return
                  libraryHint.text = "Cargando biblioteca..."
                  val entries = withContext(Dispatchers.IO) {
                      val treeDocId = DocumentsContract.getTreeDocumentId(tree)
                      val children = DocumentsContract.buildChildDocumentsUriUsingTree(tree, treeDocId)
                      val list = mutableListOf<LibraryEntry>()
                      contentResolver.query(children, arrayOf(
                          Document.COLUMN_DOCUMENT_ID,
                          Document.COLUMN_DISPLAY_NAME,
                          Document.COLUMN_MIME_TYPE
                      ), null, null, null)?.use { c ->
                          val idIdx = c.getColumnIndexOrThrow(Document.COLUMN_DOCUMENT_ID)
                          val nameIdx = c.getColumnIndexOrThrow(Document.COLUMN_DISPLAY_NAME)
                          val mimeIdx = c.getColumnIndexOrThrow(Document.COLUMN_MIME_TYPE)
                          while (c.moveToNext()) {
                              val name = c.getString(nameIdx) ?: continue
                              val mime = c.getString(mimeIdx) ?: ""
                              if (mime != "application/epub+zip" &&
                                  !name.lowercase().endsWith(".epub")) continue
                              val docId = c.getString(idIdx)
                              val docUri = DocumentsContract.buildDocumentUriUsingTree(tree, docId)
                              val meta = readMetadata(docUri, name)
                              list.add(LibraryEntry(
                                  fileName = name,
                                  title = meta.first,
                                  cover = meta.second,
                                  documentUri = docUri,
                              ))
                          }
                      }
                      list.sortedBy { it.title.lowercase() }
                  }
                  libraryAdapter.submit(entries)
                  libraryHint.text = "Biblioteca: ${tree.lastPathSegment ?: tree} (${entries.size} libros)"
              }

              private suspend fun readMetadata(uri: Uri, fallbackName: String): Pair<String, Bitmap?> = withContext(Dispatchers.IO) {
                  try {
                      val cached = File.createTempFile("meta_", ".epub", cacheDir)
                      contentResolver.openInputStream(uri)?.use { input ->
                          cached.outputStream().use { input.copyTo(it) }
                      } ?: return@withContext fallbackName to null
                      val assetResult = app.assetRetriever.retrieve(cached)
                      val asset = assetResult.getOrNull()
                          ?: return@withContext fallbackName to null
                      val pubResult = app.publicationOpener.open(asset, allowUserInteraction = false)
                      val pub = pubResult.getOrNull() ?: return@withContext fallbackName to null
                      val title = pub.metadata.title ?: fallbackName
                      val cover = runCatching { pub.cover() }.getOrNull()
                      pub.close()
                      cached.delete()
                      title to cover
                  } catch (_: Throwable) {
                      fallbackName to null
                  }
              }

              private suspend fun openEpubFromLibrary(entry: LibraryEntry) {
                  openEpubInternal(uri = entry.documentUri, displayName = entry.fileName, title = entry.title)
              }

              private suspend fun openEpubExternal(uri: Uri) {
                  val name = queryDisplayName(uri) ?: "libro.epub"
                  openEpubInternal(uri = uri, displayName = name, title = name.substringBeforeLast('.'))
              }

              // ============== READER ==============
              @OptIn(ExperimentalReadiumApi::class)
              private suspend fun openEpubInternal(uri: Uri, displayName: String, title: String) {
                  try {
                      val cached = File(cacheDir, displayName)
                      withContext(Dispatchers.IO) {
                          contentResolver.openInputStream(uri)?.use { input ->
                              cached.outputStream().use { input.copyTo(it) }
                          } ?: error("No se pudo leer el archivo seleccionado")
                      }
                      currentDocumentUri = uri
                      currentBookName = displayName
                      currentBookTitle = title

                      val assetResult = withContext(Dispatchers.IO) {
                          app.assetRetriever.retrieve(cached)
                      }
                      val asset = assetResult.getOrNull()
                          ?: error("Readium no pudo leer el archivo: " +
                              "${assetResult.failureOrNull()?.message ?: "formato no reconocido"}")
                      val publicationResult = withContext(Dispatchers.IO) {
                          app.publicationOpener.open(asset, allowUserInteraction = true)
                      }
                      val publication = publicationResult.getOrNull()
                          ?: error("Readium no pudo abrir el EPUB: " +
                              "${publicationResult.failureOrNull()?.message ?: "error desconocido"}")

                      val initialLocator = loadSidecar(displayName) ?: loadLocator(displayName)

                      libraryRoot.visibility = View.GONE
                      readerRoot.visibility = View.VISIBLE
                      enterImmersive()

                      val prefs = currentEpubPreferences()
                      val factory = EpubNavigatorFactory(publication = publication)
                      supportFragmentManager.fragmentFactory = factory.createFragmentFactory(
                          initialLocator = initialLocator,
                          initialPreferences = prefs,
                          paginationListener = object : EpubNavigatorFragment.PaginationListener {
                              override fun onPageChanged(pageIndex: Int, totalPages: Int, locator: Locator) {
                                  lastPageIndex = pageIndex
                                  lastTotalPages = totalPages
                                  updateProgress(locator)
                              }
                          },
                      )
                      val frag = supportFragmentManager.fragmentFactory
                          .instantiate(classLoader, EpubNavigatorFragment::class.java.name)
                          as EpubNavigatorFragment
                      supportFragmentManager.beginTransaction()
                          .replace(navContainer.id, frag, "epub_nav")
                          .commitNowAllowingStateLoss()
                      navigator = frag
                      topBarTitle.text = title

                      lifecycleScope.launch {
                          frag.currentLocator.collect { locator ->
                              lastLocator = locator
                              saveLocator(displayName, locator)
                              sidecarJob?.cancel()
                              sidecarJob = appScope.launch {
                                  delay(2000)
                                  saveSidecar(displayName, locator)
                              }
                              updateProgress(locator)
                          }
                      }
                  } catch (e: Throwable) {
                      Toast.makeText(this, "Error: ${e.message}", Toast.LENGTH_LONG).show()
                      closeBook()
                  }
              }

              fun toggleReaderOverlay() {
                  if (settingsVisible) {
                      toggleSettingsPanel()
                      return
                  }
                  val newVisibility = if (topBar.visibility == View.VISIBLE) View.GONE else View.VISIBLE
                  topBar.visibility = newVisibility
                  bottomBar.visibility = newVisibility
              }

              private fun toggleSettingsPanel() {
                  settingsVisible = !settingsVisible
                  settingsPanel.visibility = if (settingsVisible) View.VISIBLE else View.GONE
                  if (settingsVisible) {
                      topBar.visibility = View.VISIBLE
                      bottomBar.visibility = View.VISIBLE
                      brightnessSeekBar.progress = (loadBrightness() * 100).toInt().coerceIn(0, 100)
                      brightnessValue.text = "${brightnessSeekBar.progress}%"
                      fontSizeValue.text = "${((loadFontSize() ?: 1.0) * 100).toInt()}%"
                  }
              }

              private fun updateProgress(locator: Locator) {
                  val pct = if (lastTotalPages > 0) (lastPageIndex * 100 / lastTotalPages) else 0
                  progressText.text = "${lastPageIndex + 1} / $lastTotalPages  ($pct%)"
                  progressBar.progress = pct
              }

              private fun closeBook() {
                  sidecarJob?.cancel()
                  val book = currentBookName
                  val loc = lastLocator
                  if (book != null && loc != null) {
                      appScope.launch { saveSidecar(book, loc) }
                  }
                  lastLocator = null
                  lastPageIndex = 0
                  lastTotalPages = 1
                  navigator?.let {
                      try {
                          supportFragmentManager.beginTransaction().remove(it)
                              .commitNowAllowingStateLoss()
                      } catch (_: Throwable) {}
                  }
                  navigator = null
                  currentBookName = null
                  currentBookTitle = null
                  currentDocumentUri = null
                  exitImmersive()
                  settingsPanel.visibility = View.GONE
                  settingsVisible = false
                  topBar.visibility = View.GONE
                  bottomBar.visibility = View.GONE
                  readerRoot.visibility = View.GONE
                  libraryRoot.visibility = View.VISIBLE
                  lifecycleScope.launch { reloadLibrary() }
              }

              // ============== INMERSION FULLSCREEN ==============
              private fun enterImmersive() {
                  if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.R) {
                      window.setDecorFitsSystemWindows(false)
                      window.insetsController?.let {
                          it.systemBarsBehavior = WindowInsetsController.BEHAVIOR_SHOW_TRANSIENT_BARS_BY_SWIPE
                          it.hide(WindowInsets.Type.systemBars())
                      }
                  } else {
                      @Suppress("DEPRECATION")
                      window.decorView.systemUiVisibility = (
                          View.SYSTEM_UI_FLAG_IMMERSIVE_STICKY
                              or View.SYSTEM_UI_FLAG_FULLSCREEN
                              or View.SYSTEM_UI_FLAG_HIDE_NAVIGATION
                              or View.SYSTEM_UI_FLAG_LAYOUT_FULLSCREEN
                              or View.SYSTEM_UI_FLAG_LAYOUT_HIDE_NAVIGATION
                              or View.SYSTEM_UI_FLAG_LAYOUT_STABLE
                      )
                  }
              }

              private fun exitImmersive() {
                  if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.R) {
                      window.setDecorFitsSystemWindows(true)
                      window.insetsController?.show(WindowInsets.Type.systemBars())
                  } else {
                      @Suppress("DEPRECATION")
                      window.decorView.systemUiVisibility = View.SYSTEM_UI_FLAG_VISIBLE
                  }
              }

              // ============== PREFERENCIAS ==============
              @OptIn(ExperimentalReadiumApi::class)
              private fun currentEpubPreferences(): org.readium.r2.navigator.epub.EpubPreferences {
                  return org.readium.r2.navigator.epub.EpubPreferences(
                      theme = loadTheme(),
                      fontFamily = loadFontFamily()?.let { FontFamily(it) },
                      fontSize = loadFontSize(),
                  )
              }

              @OptIn(ExperimentalReadiumApi::class)
              private fun applyTheme(theme: Theme?) {
                  prefs().edit().putString("pref_theme", theme?.name ?: "AUTO").apply()
                  navigator?.submitPreferences(currentEpubPreferences())
              }

              @OptIn(ExperimentalReadiumApi::class)
              private fun applyFontFamily(family: String) {
                  prefs().edit().putString("pref_font_family", family).apply()
                  navigator?.submitPreferences(currentEpubPreferences())
              }

              @OptIn(ExperimentalReadiumApi::class)
              private fun applyFontSizeDelta(delta: Double) {
                  val cur = loadFontSize() ?: 1.0
                  val new = (cur + delta).coerceIn(0.5, 3.0)
                  prefs().edit().putFloat("pref_font_size", new.toFloat()).apply()
                  fontSizeValue.text = "${(new * 100).toInt()}%"
                  navigator?.submitPreferences(currentEpubPreferences())
              }

              private fun applyBrightness(factor: Float) {
                  val lp = window.attributes
                  lp.screenBrightness = factor.coerceIn(0.01f, 1f)
                  window.attributes = lp
              }

              @OptIn(ExperimentalReadiumApi::class)
              private fun loadTheme(): Theme? = when (prefs().getString("pref_theme", "AUTO")) {
                  "LIGHT" -> Theme.LIGHT
                  "SEPIA" -> Theme.SEPIA
                  "DARK" -> Theme.DARK
                  else -> null
              }

              private fun loadFontFamily(): String? =
                  prefs().getString("pref_font_family", null)?.takeIf { it.isNotEmpty() }

              private fun loadFontSize(): Double? =
                  if (prefs().contains("pref_font_size"))
                      prefs().getFloat("pref_font_size", 1f).toDouble()
                  else null

              private fun loadBrightness(): Float =
                  prefs().getFloat("pref_brightness", 0.5f)

              private fun saveBrightness(factor: Float) {
                  prefs().edit().putFloat("pref_brightness", factor.coerceIn(0.01f, 1f)).apply()
              }

              // ============== BACK ==============
              @Suppress("DEPRECATION")
              override fun onBackPressed() {
                  if (readerRoot.visibility == View.VISIBLE) closeBook()
                  else super.onBackPressed()
              }

              // Tap en el centro del lector -> toggle overlays.
              override fun dispatchTouchEvent(ev: MotionEvent): Boolean {
                  if (readerRoot.visibility == View.VISIBLE && ev.action == MotionEvent.ACTION_DOWN) {
                      val w = resources.displayMetrics.widthPixels
                      val h = resources.displayMetrics.heightPixels
                      val inCenterX = ev.x in (w * 0.30f)..(w * 0.70f)
                      val inCenterY = ev.y in (h * 0.30f)..(h * 0.70f)
                      if (settingsVisible) {
                          val panelLoc = IntArray(2)
                          settingsPanel.getLocationOnScreen(panelLoc)
                          val inPanel = ev.x >= panelLoc[0] && ev.x <= panelLoc[0] + settingsPanel.width &&
                              ev.y >= panelLoc[1] && ev.y <= panelLoc[1] + settingsPanel.height
                          if (!inPanel) {
                              toggleSettingsPanel()
                              return true
                          }
                      } else if (inCenterX && inCenterY) {
                          toggleReaderOverlay()
                          return true
                      }
                  }
                  return super.dispatchTouchEvent(ev)
              }

              // ============== PERSISTENCIA POSICION ==============
              private fun prefs() = getSharedPreferences("lector_positions", MODE_PRIVATE)

              private fun loadLocator(bookName: String): Locator? {
                  val json = prefs().getString(bookName, null) ?: return null
                  return runCatching { Locator.fromJSON(JSONObject(json)) }.getOrNull()
              }

              private fun saveLocator(bookName: String, locator: Locator) {
                  prefs().edit().putString(bookName, locator.toJSON().toString()).apply()
              }

              private suspend fun findSidecarUri(bookName: String): Uri? {
                  val tree = libraryTreeUri ?: return null
                  val sidecarName = bookName.substringBeforeLast('.') + ".json"
                  return withContext(Dispatchers.IO) {
                      val treeDocId = DocumentsContract.getTreeDocumentId(tree)
                      var found: Uri? = null
                      contentResolver.query(
                          DocumentsContract.buildChildDocumentsUriUsingTree(tree, treeDocId),
                          arrayOf(Document.COLUMN_DOCUMENT_ID, Document.COLUMN_DISPLAY_NAME),
                          null, null, null
                      )?.use { c ->
                          val idIdx = c.getColumnIndexOrThrow(Document.COLUMN_DOCUMENT_ID)
                          val nameIdx = c.getColumnIndexOrThrow(Document.COLUMN_DISPLAY_NAME)
                          while (c.moveToNext()) {
                              if (c.getString(nameIdx) == sidecarName) {
                                  found = DocumentsContract.buildDocumentUriUsingTree(
                                      tree, c.getString(idIdx)
                                  )
                                  break
                              }
                          }
                      }
                      found
                  }
              }

              private suspend fun loadSidecar(bookName: String): Locator? {
                  val uri = findSidecarUri(bookName) ?: return null
                  return withContext(Dispatchers.IO) {
                      val text = contentResolver.openInputStream(uri)?.use {
                          it.readBytes().toString(Charsets.UTF_8)
                      } ?: return@withContext null
                      runCatching {
                          Locator.fromJSON(JSONObject(text).getJSONObject("locator"))
                      }.getOrNull()
                  }
              }

              private suspend fun saveSidecar(bookName: String, locator: Locator) {
                  val tree = libraryTreeUri ?: return
                  val sidecarName = bookName.substringBeforeLast('.') + ".json"
                  val json = JSONObject().apply {
                      put("version", 1)
                      put("bookName", bookName)
                      put("locator", locator.toJSON())
                      put("updatedAt",
                          SimpleDateFormat("yyyy-MM-dd HH:mm:ss", Locale.US).format(Date()))
                  }.toString(2)
                  withContext(Dispatchers.IO) {
                      val treeDocId = DocumentsContract.getTreeDocumentId(tree)
                      val treeDocUri = DocumentsContract.buildDocumentUriUsingTree(tree, treeDocId)
                      var target = findSidecarUri(bookName)
                      if (target == null) {
                          target = DocumentsContract.createDocument(
                              contentResolver, treeDocUri,
                              "application/json", sidecarName
                          ) ?: return@withContext
                      }
                      contentResolver.openOutputStream(target, "wt")?.use { os ->
                          os.write(json.toByteArray(Charsets.UTF_8))
                          os.flush()
                      }
                  }
              }

              private fun queryDisplayName(uri: Uri): String? {
                  contentResolver.query(uri, null, null, null, null)?.use { c ->
                      val idx = c.getColumnIndex(OpenableColumns.DISPLAY_NAME)
                      if (idx >= 0 && c.moveToFirst()) return c.getString(idx)
                  }
                  return uri.lastPathSegment
              }
          }
          EOF

          # --- layout/activity_main.xml ---
          cat > app/src/main/res/layout/activity_main.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <FrameLayout xmlns:android="http://schemas.android.com/apk/res/android"
              android:layout_width="match_parent"
              android:layout_height="match_parent" />
          EOF

          # --- values/strings.xml ---
          cat > app/src/main/res/values/strings.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <resources>
              <string name="app_name">Nu_lec</string>
          </resources>
          EOF

          # --- values/colors.xml ---
          cat > app/src/main/res/values/colors.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <resources>
              <color name="black">#FF000000</color>
              <color name="white">#FFFFFFFF</color>
              <color name="bg">#FAFAFA</color>
          </resources>
          EOF

          # --- values/themes.xml ---
          cat > app/src/main/res/values/themes.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <resources>
              <style name="Theme.LectorEpub" parent="Theme.MaterialComponents.DayNight.NoActionBar">
                  <item name="android:windowBackground">@color/bg</item>
              </style>
          </resources>
          EOF

      - name: Build debug APK
        run: gradle assembleDebug --no-daemon --stacktrace

      - name: Subir artifact
        uses: actions/upload-artifact@v5
        with:
          name: nu-lec-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
