              private fun activeBrightnessPref(): String =
                  if (isComicOpen() && prefs().getBoolean("pref_comic_bright_sep", false))
                      "pref_comic_brightness"
                  else "pref_brightness"
          
              private fun loadActiveBrightness(): Float =
                  prefs().getFloat(activeBrightnessPref(), 0.5f)
          
              private fun saveActiveBrightness(factor: Float) {
                  prefs().edit().putFloat(activeBrightnessPref(), factor.coerceIn(0.01f, 1f)).apply()
              }
          
              private fun applyActiveBrightness() {
                  applyBrightness(loadActiveBrightness())
              }
          
