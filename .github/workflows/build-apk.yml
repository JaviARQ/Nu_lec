                        private fun applyGlobalTheme() {
                            val dark = isDark
                            val bg = if (dark) 0xFF121212.toInt() else 0xFFFAFAFA.toInt()
                            val txt = if (dark) 0xFFF5F5F5.toInt() else 0xFF1A1A1A.toInt()
                            val sub = if (dark) 0xFF9E9E9E.toInt() else 0xFF757575.toInt()
          
                            libraryRoot.setBackgroundColor(bg)
                            headerTitle.setTextColor(if (dark) 0xFFFFFFFF.toInt() else ACCENT)
                            headerSub.setTextColor(sub)
                            libraryHint.setTextColor(sub)
                            libraryAdapter.isDark = dark
          
                            val btnBg = GradientDrawable().apply {
                                cornerRadius = 12 * density
                                setColor(if (dark) 0xFF2A2A2A.toInt() else ACCENT)
                                setStroke(dp(1), if (dark) 0xFF444444.toInt() else ACCENT_DARK)
                            }
                            btnPickLibrary.background = btnBg
                            btnPickLibrary.setTextColor(if (dark) 0xFFEDEDED.toInt() else Color.WHITE)
                            btnOpenExternal.background = btnBg
                            btnOpenExternal.setTextColor(if (dark) 0xFFEDEDED.toInt() else Color.WHITE)
          
                            val panelBg = GradientDrawable().apply {
                                cornerRadius = 24 * density
                                setColor(if (dark) 0xFF1E1E1E.toInt() else 0xFFFAFAFA.toInt())
                                setStroke(dp(1), if (dark) 0xFF333333.toInt() else 0xFFE0E0E0.toInt())
                            }
                            settingsPanel.background = panelBg
                            sectionLabels.forEach {
                                it.setTextColor(if (dark) 0xFF8AB4F8.toInt() else ACCENT)
                            }
                            fun paintChip(b: Button) {
                                val chipBg = GradientDrawable().apply {
                                    cornerRadius = 20 * density
                                    setColor(if (dark) 0xFF2E2E2E.toInt() else 0xFFEEEEEE.toInt())
                                }
                                b.background = chipBg
                                b.setTextColor(if (dark) 0xFFEDEDED.toInt() else 0xFF1A1A1A.toInt())
                            }
                            themeChips.forEach(::paintChip)
                            fontChips.forEach(::paintChip)
                            otherChips.forEach(::paintChip)
                            brightnessValue.setTextColor(txt)
                            fontSizeValue.setTextColor(txt)
