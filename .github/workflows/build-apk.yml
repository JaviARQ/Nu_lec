              private fun applyBrightness(factor: Float) {
                  val lp = window.attributes
                  lp.screenBrightness = factor.coerceIn(0.01f, 1f)
                  window.attributes = lp
              }
          
              /** Devuelve true si hay un cómic abierto (para decidir qué brillo usar). */
              private fun isComicOpen(): Boolean =
                  readerRoot.visibility == View.VISIBLE && navigator is ImageNavigatorFragment
          
