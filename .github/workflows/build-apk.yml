              /**
               * v28: ActionMode.Callback personalizado para el menú contextual nativo
               * de Android que aparece al seleccionar texto en el EpubNavigatorFragment.
               * Añade una opción "Crear cita" que crea un highlight a partir del texto
               * seleccionado por el usuario.
               */
              private fun createSelectionActionModeCallback(): ActionMode.Callback {
                  val MENU_CREATE_HIGHLIGHT = 0x1001
                  return object : ActionMode.Callback {
                      override fun onCreateActionMode(mode: ActionMode, menu: Menu): Boolean {
                          menu.add(0, MENU_CREATE_HIGHLIGHT, 0, "Crear cita")
                          return true
                      }
          
                      override fun onPrepareActionMode(mode: ActionMode, menu: Menu): Boolean = false
          
                      override fun onActionItemClicked(mode: ActionMode, item: MenuItem): Boolean {
                          if (item.itemId == MENU_CREATE_HIGHLIGHT) {
                              lifecycleScope.launch { createHighlightFromSelection() }
                              mode.finish()
                              return true
                          }
                          return false
                      }
          
                      override fun onDestroyActionMode(mode: ActionMode) {}
                  }
              }
          
              /**
               * v28: crea un highlight a partir de la selección nativa actual del EPUB.
               * Obtiene la Selection vía currentSelection(), crea el Highlight, lo persiste
               * en el sidecar JSON, aplica el decoration visual y limpia la selección.
               */
              private suspend fun createHighlightFromSelection() {
                  val nav = navigator as? EpubNavigatorFragment ?: return
                  val selection = nav.currentSelection() ?: return
                  val text = selection.locator.text?.highlight
                      ?: selection.locator.text?.before
                      ?: ""
                  if (text.isBlank()) return
                  val locator = selection.locator
                  val hl = Highlight(
                      id = "hl_${System.currentTimeMillis()}",
                      text = text,
                      locator = locator,
                      color = "yellow",
                      note = "",
                      createdAt = SimpleDateFormat("yyyy-MM-dd HH:mm:ss", Locale.US).format(Date())
                  )
                  currentHighlights.add(hl)
                  val book = currentBookName ?: return
                  appScope.launch { saveHighlights(book, currentHighlights.toList()) }
                  applyAllDecorations()
                  nav.clearSelection()
                  Toast.makeText(this, "Cita creada", Toast.LENGTH_SHORT).show()
              }
          
              /**
               * v30: Fallback para crear cita cuando la seleccion nativa no funciona.
               * Muestra un dialogo con un campo de texto para que el usuario pegue el texto
               * a citar. Asocia la cita con la posicion actual de lectura (lastLocator).
               * Si hay seleccion nativa disponible, la usa automaticamente.
               */
              private fun showCreateHighlightFallback() {
                  val nav = navigator as? EpubNavigatorFragment
                  // Primero intentar obtener la seleccion nativa (puede funcionar aunque
                  // el ActionMode nativo no se muestre).
                  if (nav != null) {
                      lifecycleScope.launch {
                          val selection = nav.currentSelection()
                          if (selection != null && !selection.locator.text?.highlight.isNullOrBlank()) {
                              createHighlightFromSelection()
                              return@launch
                          }
                          // Si no hay seleccion nativa, mostrar dialogo manual.
                          showManualHighlightDialog()
                      }
                  } else {
                      showManualHighlightDialog()
                  }
              }
          
              /**
               * Dialogo manual para crear cita: campo de texto para el contenido
               * y nota opcional. Asocia con la posicion actual.
               */
              private fun showManualHighlightDialog() {
                  val ctx = this
                  val container = LinearLayout(ctx).apply {
                      orientation = LinearLayout.VERTICAL
                      setPadding(dp(20), dp(16), dp(20), dp(8))
                  }
                  val textInput = android.widget.EditText(ctx).apply {
                      hint = "Pega aqui el texto a citar"
                      minLines = 3
                      maxLines = 5
                      setPadding(dp(8), dp(8), dp(8), dp(8))
                  }
                  val noteInput = android.widget.EditText(ctx).apply {
                      hint = "Nota (opcional)"
                      minLines = 1
                      maxLines = 2
                      setPadding(dp(8), dp(8), dp(8), dp(8))
                  }
                  container.addView(textInput)
                  container.addView(noteInput)
                  AlertDialog.Builder(ctx)
                      .setTitle("Crear cita")
                      .setView(container)
                      .setPositiveButton("Crear") { _, _ ->
                          val text = textInput.text.toString().trim()
                          val note = noteInput.text.toString().trim()
                          if (text.isBlank()) {
                              Toast.makeText(ctx, "El texto no puede estar vacio", Toast.LENGTH_SHORT).show()
                              return@setPositiveButton
                          }
                          val locator = lastLocator
                          val hl = Highlight(
                              id = "hl_${System.currentTimeMillis()}",
                              text = text,
                              locator = locator,
                              color = "yellow",
                              note = note,
                              createdAt = SimpleDateFormat("yyyy-MM-dd HH:mm:ss", Locale.US).format(Date())
                          )
                          currentHighlights.add(hl)
                          val book = currentBookName ?: return@setPositiveButton
                          appScope.launch { saveHighlights(book, currentHighlights.toList()) }
                          lifecycleScope.launch { applyAllDecorations() }
                          Toast.makeText(ctx, "Cita creada", Toast.LENGTH_SHORT).show()
                      }
                      .setNegativeButton("Cancelar", null)
                      .show()
              }
          
              /**
               * v28: aplica TODOS los highlights actuales como decorations visibles
               * en el EPUB (resaltado amarillo semitransparente). Llamado al abrir el
               * libro y tras crear/eliminar citas.
               */
              private suspend fun applyAllDecorations() {
                  val nav = navigator as? EpubNavigatorFragment ?: return
                  val decorations = currentHighlights.mapNotNull { hl ->
                      val loc = hl.locator ?: return@mapNotNull null
                      Decoration(
                          id = hl.id,
                          locator = loc,
                          style = Decoration.Style.Highlight(tint = 0x80FFFF00.toInt())
                      )
                  }
                  nav.applyDecorations(decorations, "highlights")
              }
          
