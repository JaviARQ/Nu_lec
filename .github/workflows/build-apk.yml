      - name: Crear package.json
        run: |
          cat > package.json <<'EOF'
          {
            "name": "lector-epub",
            "version": "1.1.0",
            "private": true,
            "scripts": {
              "build": "node scripts/copy-assets.js",
              "sync": "npm run build && npx cap sync android"
            },
            "dependencies": {
              "@capacitor/android": "^6.1.2",
              "@capacitor/core": "^6.1.2",
              "epubjs": "^0.3.93"
            },
            "devDependencies": {
              "@capacitor/cli": "^6.1.2",
              "typescript": "^5.4.5"
            }
          }
          EOF

      - name: Crear capacitor.config.ts
        run: |
          cat > capacitor.config.ts <<'EOF'
          import type { CapacitorConfig } from '@capacitor/cli';
          const config: CapacitorConfig = {
            appId: 'com.lector.epub',
            appName: 'Lector EPUB',
            webDir: 'www'
          };
          export default config;
          EOF

      - name: Crear carpetas src y scripts
        run: mkdir -p src scripts

      - name: Crear scripts/copy-assets.js
        run: |
          cat > scripts/copy-assets.js <<'EOF'
          var fs = require('fs');
          var path = require('path');
          var ROOT = path.join(__dirname, '..');
          var SRC = path.join(ROOT, 'src');
          var DST = path.join(ROOT, 'www');
          if (!fs.existsSync(DST)) fs.mkdirSync(DST, { recursive: true });
          ['index.html', 'styles.css', 'app.js'].forEach(function (f) {
            fs.copyFileSync(path.join(SRC, f), path.join(DST, f));
          });
          var libDst = path.join(DST, 'lib');
          if (!fs.existsSync(libDst)) fs.mkdirSync(libDst, { recursive: true });
          var libs = [
            ['jszip', 'dist/jszip.min.js', 'jszip.min.js'],
            ['epubjs', 'dist/epub.min.js', 'epub.min.js']
          ];
          libs.forEach(function (spec) {
            var src = path.join(ROOT, 'node_modules', spec[0], spec[1]);
            var dst = path.join(libDst, spec[2]);
            if (fs.existsSync(src)) {
              fs.copyFileSync(src, dst);
              console.log('Copiado: ' + spec[2]);
            } else {
              console.error('FALTA: ' + src);
              process.exit(1);
            }
          });
          console.log('Build web completo.');
          EOF

      - name: Crear src/index.html
        run: |
          cat > src/index.html <<'EOF'
          <!DOCTYPE html>
          <html lang="es">
          <head>
            <meta charset="UTF-8" />
            <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no" />
            <meta name="theme-color" content="#ffffff" />
            <title>Lector EPUB</title>
            <link rel="stylesheet" href="./styles.css" />
          </head>
          <body>
            <header class="topbar" id="topbar">
              <button class="icon-btn" id="back-btn" aria-label="Volver">&#8249;</button>
              <h1 class="title" id="title">Lector</h1>
              <button class="icon-btn" id="menu-btn" aria-label="Menú">&#8943;</button>
            </header>

            <main class="empty" id="empty">
              <div class="empty-icon">📖</div>
              <h2>Lector EPUB</h2>
              <p>Abre un archivo .epub para empezar a leer.</p>
              <label class="primary-btn" for="file-input">Abrir EPUB</label>
              <label class="ghost-btn" for="json-input">Importar progreso</label>
              <p class="hint">Tu posición se guarda automáticamente en este dispositivo. Para sincronizar entre dispositivos: menú &#8943; → "Exportar progreso" y "Importar progreso".</p>
            </main>

            <main class="reader" id="reader" hidden>
              <div id="viewer"></div>
              <footer class="bottombar" id="bottombar">
                <button class="nav-btn" id="prev-btn" aria-label="Anterior">&#8249;</button>
                <div class="progress-info">
                  <span id="progress-text">0%</span>
                </div>
                <button class="nav-btn" id="next-btn" aria-label="Siguiente">&#8250;</button>
              </footer>
            </main>

            <div class="overlay" id="overlay" hidden></div>
            <aside class="sheet" id="sheet" hidden>
              <label class="sheet-item" for="file-input">Abrir otro EPUB</label>
              <button class="sheet-item" id="sheet-export">Exportar progreso</button>
              <label class="sheet-item" for="json-input">Importar progreso</label>
              <button class="sheet-item sheet-cancel" id="sheet-cancel">Cancelar</button>
            </aside>

            <input type="file" id="file-input" accept=".epub,application/epub+zip" class="visually-hidden" />
            <input type="file" id="json-input" accept=".json,application/json" class="visually-hidden" />

            <script src="./lib/jszip.min.js"></script>
            <script src="./lib/epub.min.js"></script>
            <script src="./app.js"></script>
          </body>
          </html>
          EOF

