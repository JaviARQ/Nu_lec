              private fun refreshLibraryButtons() {
                  val hasLibrary = activeTreeUri() != null
                  btnPickLibrary.visibility = if (hasLibrary) View.GONE else View.VISIBLE
                  btnOpenExternal.visibility = if (hasLibrary) View.GONE else View.VISIBLE
                  btnRefreshLibrary.visibility = if (hasLibrary) View.VISIBLE else View.GONE
              }
          
              /** URI raiz de la biblioteca actualmente activa. */
              private fun activeTreeUri(): Uri? = when (currentMedia) {
                  LibraryMediaType.EPUB -> libraryTreeUri
                  LibraryMediaType.COMIC -> comicsTreeUri
              }
          
              /** Cambia entre biblioteca de libros y comics. */
              private fun switchMedia(media: LibraryMediaType) {
                  if (currentMedia == media) return
                  currentMedia = media
                  currentFolderUri = null
                  updateMediaToggle()
                  refreshLibraryButtons()
                  headerSub.text = when (media) {
                      LibraryMediaType.EPUB -> "Tu biblioteca de libros"
                      LibraryMediaType.COMIC -> "Tu biblioteca de comics"
                  }
                  lifecycleScope.launch { reloadLibrary() }
              }
          
              /** Marca visualmente qué botón está activo (libro/comic). */
              private fun updateMediaToggle() {
                  val active = ACCENT_DARK
                  val inactive = if (isDark) 0xFF666666.toInt() else 0xFF999999.toInt()
                  btnMediaEpub.setColorFilter(
                      if (currentMedia == LibraryMediaType.EPUB) active else inactive
                  )
                  btnMediaComic.setColorFilter(
                      if (currentMedia == LibraryMediaType.COMIC) active else inactive
                  )
              }
          
              // ============== LIBRARY ==============
          
              private suspend fun reloadLibrary() {
                  val tree = activeTreeUri() ?: run {
                      libraryAdapter.submit(emptyList())
                      refreshLibraryButtons()
                      updateFolderNav()
                      headerSub.text = when (currentMedia) {
                          LibraryMediaType.EPUB -> "Elige una carpeta de libros"
                          LibraryMediaType.COMIC -> "Elige una carpeta de comics"
                      }
                      libraryHint.text = ""
                      return
                  }
                  refreshLibraryButtons()
                  updateFolderNav()
                  libraryHint.text = "Cargando biblioteca..."
                  val folderUri = currentFolderUri ?: tree
                  val mediaExts = when (currentMedia) {
                      LibraryMediaType.EPUB -> setOf("epub")
                      LibraryMediaType.COMIC -> setOf("cbz", "cbr")
                  }
                  val mediaMimes = when (currentMedia) {
                      LibraryMediaType.EPUB -> setOf("application/epub+zip")
                      LibraryMediaType.COMIC -> setOf(
                          "application/vnd.comicbook+zip", "application/vnd.comicbook-rar",
                          "application/x-cbz", "application/x-cbr",
                          "application/octet-stream"
                      )
                  }
                  val entries = withContext(Dispatchers.IO) {
                      val folderDocId = if (currentFolderUri != null)
                          DocumentsContract.getDocumentId(folderUri)
                      else
                          DocumentsContract.getTreeDocumentId(folderUri)
                      val children = DocumentsContract.buildChildDocumentsUriUsingTree(tree, folderDocId)
                      val books = mutableListOf<LibraryEntry>()
                      val folders = mutableListOf<LibraryEntry>()
                      contentResolver.query(children, arrayOf(
                          Document.COLUMN_DOCUMENT_ID,
                          Document.COLUMN_DISPLAY_NAME,
                          Document.COLUMN_MIME_TYPE
                      ), null, null, null)?.use { c ->
                          val idIdx = c.getColumnIndexOrThrow(Document.COLUMN_DOCUMENT_ID)
                          val nameIdx = c.getColumnIndexOrThrow(Document.COLUMN_DISPLAY_NAME)
                          val mimeIdx = c.getColumnIndexOrThrow(Document.COLUMN_MIME_TYPE)
                          while (c.moveToNext()) {
                              val name = c.getString(nameIdx) ?: continue
                              val mime = c.getString(mimeIdx) ?: ""
                              val docId = c.getString(idIdx)
                              val docUri = DocumentsContract.buildDocumentUriUsingTree(tree, docId)
          
                              val isDir = mime == DocumentsContract.Document.MIME_TYPE_DIR
                              val ext = name.substringAfterLast('.', "").lowercase()
                              val isMedia = mime in mediaMimes || ext in mediaExts
          
                              if (isDir) {
                                  val count = countMediaIn(folderUri = docUri, tree = tree, exts = mediaExts, mimes = mediaMimes)
                                  if (count > 0) {
                                      folders.add(LibraryEntry(
                                          fileName = name,
                                          title = name,
                                          cover = null,
                                          documentUri = docUri,
                                          type = LibraryEntryType.COLLECTION,
                                          bookCount = count,
                                      ))
                                  }
                              } else if (isMedia) {
                                  val meta = readMetadata(docUri, name)
                                  books.add(LibraryEntry(
                                      fileName = name,
                                      title = meta.first,
                                      cover = meta.second,
                                      documentUri = docUri,
                                      extension = ext,
                                  ))
                              }
                          }
                      }
                      (folders.sortedBy { it.title.lowercase() } +
                          books.sortedBy { it.title.lowercase() })
                  }
                  libraryAdapter.submit(entries)
                  val nBooks = entries.count { it.type == LibraryEntryType.BOOK }
                  val nFolders = entries.count { it.type == LibraryEntryType.COLLECTION }
                  val noun = when (currentMedia) {
                      LibraryMediaType.EPUB -> "libros"
                      LibraryMediaType.COMIC -> "comics"
                  }
                  headerSub.text = when {
                      nFolders > 0 && nBooks > 0 -> "$nFolders colecciones, $nBooks $noun"
                      nFolders > 0 -> "$nFolders colecciones"
                      else -> "$nBooks $noun en tu biblioteca"
                  }
                  libraryHint.text = if (entries.isEmpty()) "Carpeta vacía" else ""
              }
          
              private suspend fun countMediaIn(
                  folderUri: Uri,
                  tree: Uri,
                  exts: Set<String>,
                  mimes: Set<String>,
              ): Int = withContext(Dispatchers.IO) {
                  try {
                      val folderDocId = DocumentsContract.getDocumentId(folderUri)
                      val children = DocumentsContract.buildChildDocumentsUriUsingTree(tree, folderDocId)
                      var count = 0
                      contentResolver.query(children, arrayOf(
                          Document.COLUMN_DISPLAY_NAME,
                          Document.COLUMN_MIME_TYPE
                      ), null, null, null)?.use { c ->
                          val nameIdx = c.getColumnIndexOrThrow(Document.COLUMN_DISPLAY_NAME)
                          val mimeIdx = c.getColumnIndexOrThrow(Document.COLUMN_MIME_TYPE)
                          while (c.moveToNext()) {
                              val name = c.getString(nameIdx) ?: continue
                              val mime = c.getString(mimeIdx) ?: ""
                              val ext = name.substringAfterLast('.', "").lowercase()
                              if (mime in mimes || ext in exts) count++
                          }
                      }
                      count
                  } catch (_: Throwable) { 0 }
              }
          
              private suspend fun enterFolder(folderDocUri: Uri, title: String) {
                  currentFolderUri = folderDocUri
                  reloadLibrary()
              }
          
              private fun goUpFolder() {
                  currentFolderUri = null
                  lifecycleScope.launch { reloadLibrary() }
              }
          
              private fun updateFolderNav() {
                  val navRow = libraryRoot.findViewWithTag<View>("folder_nav_row") ?: return
                  val folderName = libraryRoot.findViewWithTag<View>("folder_name") as? TextView ?: return
                  if (currentFolderUri != null) {
                      navRow.visibility = View.VISIBLE
                      val name = runCatching {
                          DocumentsContract.getDocumentId(currentFolderUri!!)
                              .substringAfterLast('/')
                      }.getOrNull() ?: "Carpeta"
                      folderName.text = name
                  } else {
                      navRow.visibility = View.GONE
                      folderName.text = ""
                  }
              }
          
              private suspend fun readMetadata(uri: Uri, fallbackName: String): Pair<String, Bitmap?> = withContext(Dispatchers.IO) {
                  try {
                      // Usar extension correcta para que AssetRetriever detecte el formato.
                      val ext = fallbackName.substringAfterLast('.', "epub").lowercase()
                      val cached = File.createTempFile("meta_", ".$ext", cacheDir)
                      contentResolver.openInputStream(uri)?.use { input ->
                          cached.outputStream().use { input.copyTo(it) }
                      } ?: return@withContext fallbackName to null
                      val assetResult = app.assetRetriever.retrieve(cached)
                      val asset = assetResult.getOrNull()
                          ?: return@withContext fallbackName to null
                      val pubResult = app.publicationOpener.open(asset, allowUserInteraction = false)
                      val pub = pubResult.getOrNull() ?: return@withContext fallbackName to null
                      val title = pub.metadata.title ?: fallbackName
                      // Primero intentar pub.cover() (funciona para EPUB y CBZ si el parser lo soporta).
                      var cover: Bitmap? = runCatching { pub.cover() }.getOrNull()
                      // Si es comic (CBZ/CBR) y no hay cover, extraer la primera imagen del readingOrder.
                      if (cover == null && (ext == "cbz" || ext == "cbr")) {
                          cover = extractFirstImageAsBitmap(pub)
                      }
                      pub.close()
                      cached.delete()
                      title to cover
                  } catch (_: Throwable) {
                      fallbackName to null
                  }
              }
          
              /**
               * Para comics: extrae la primera imagen del readingOrder como Bitmap.
               * Lee el primer Link, obtiene su recurso como InputStream, y lo decodifica.
               */
              private suspend fun extractFirstImageAsBitmap(publication: Publication): Bitmap? = withContext(Dispatchers.IO) {
                  try {
                      val firstLink = publication.readingOrder.firstOrNull() ?: return@withContext null
                      val resource = publication.get(firstLink) ?: return@withContext null
                      // Resource.read() devuelve Try<ByteArray, ReadError>; getOrNull() da el ByteArray directo.
                      val bytes = runCatching {
                          resource.read().getOrNull()
                      }.getOrNull() ?: return@withContext null
                      runCatching {
                          android.graphics.BitmapFactory.decodeByteArray(bytes, 0, bytes.size)
                      }.getOrNull()
                  } catch (_: Throwable) { null }
              }
          
              private suspend fun openFromLibrary(entry: LibraryEntry) {
                  currentBookFolderUri = currentFolderUri ?: activeTreeUri()
                  openInternal(
                      uri = entry.documentUri,
                      displayName = entry.fileName,
                      title = entry.title,
                      extension = entry.extension,
                  )
              }
          
              private suspend fun openEpubExternal(uri: Uri) {
                  currentBookFolderUri = currentFolderUri ?: activeTreeUri()
                  val name = queryDisplayName(uri) ?: "libro.epub"
                  val ext = name.substringAfterLast('.', "").lowercase()
                  openInternal(uri = uri, displayName = name, title = name.substringBeforeLast('.'), extension = ext)
              }
          
              // ============== READER ==============
          
              @OptIn(ExperimentalReadiumApi::class)
              private suspend fun openInternal(uri: Uri, displayName: String, title: String, extension: String) {
                  try {
                      // Para CBR: convertir a CBZ en cache primero (Readium no soporta CBR).
                      val cached: File
                      val isComic = extension == "cbz" || extension == "cbr"
                      if (extension == "cbr") {
                          Toast.makeText(this, "Convirtiendo CBR a CBZ...", Toast.LENGTH_SHORT).show()
                          cached = ComicConverter.convertCbrToCbz(this, uri, displayName)
                      } else {
                          cached = File(cacheDir, displayName)
                          withContext(Dispatchers.IO) {
                              contentResolver.openInputStream(uri)?.use { input ->
                                  cached.outputStream().use { input.copyTo(it) }
                              } ?: error("No se pudo leer el archivo seleccionado")
                          }
                      }
                      currentBookName = displayName
          
                      val assetResult = withContext(Dispatchers.IO) {
                          app.assetRetriever.retrieve(cached)
                      }
                      val asset = assetResult.getOrNull()
                          ?: error("Readium no pudo leer el archivo: " +
                              "${assetResult.failureOrNull()?.message ?: "formato no reconocido"}")
                      val publicationResult = withContext(Dispatchers.IO) {
                          app.publicationOpener.open(asset, allowUserInteraction = true)
                      }
                      val publication = publicationResult.getOrNull()
                          ?: error("Readium no pudo abrir el archivo: " +
                              "${publicationResult.failureOrNull()?.message ?: "error desconocido"}")
          
                      chapters = publication.readingOrder
                      tableOfContents = publication.tableOfContents
                      chapterIndex = 0
          
                      val initialLocator = loadSidecar(displayName) ?: loadLocator(displayName)
          
                      libraryRoot.visibility = View.GONE
                      readerRoot.visibility = View.VISIBLE
                      enterImmersive()
          
                      if (isComic) {
                          // COMIC: ImageNavigatorFragment (sin preferencias, sin PaginationListener).
                          supportFragmentManager.fragmentFactory = ImageNavigatorFragment.createFactory(
                              publication = publication,
                              initialLocator = initialLocator,
                              listener = null,
                          )
                          val frag = supportFragmentManager.fragmentFactory
                              .instantiate(classLoader, ImageNavigatorFragment::class.java.name)
                              as ImageNavigatorFragment
                          supportFragmentManager.beginTransaction()
                              .replace(navContainer.id, frag, "image_nav")
                              .commitNowAllowingStateLoss()
                          navigator = frag
                          topBarTitle.text = title
                          // Configurar zoom potente en PhotoView despues de que la vista este lista.
                          // PhotoView por defecto soporta pinch-to-zoom pero limitado a 8x.
                          // Subimos el maximo segun preferencias (por defecto 10x) y el minimo a 0.5x.
                          frag.view?.let {
                              configurePhotoViewZoom(it)
                              applyComicNavigatorStyle(it)
                          }
                          // Aplicar brillo especifico de cómic si está activado.
                          applyActiveBrightness()
                          // Tambien reconfigurar cuando se carguen paginas nuevas.
                          lifecycleScope.launch {
                              frag.currentLocator.collect { locator ->
                                  lastLocator = locator
                                  saveLocator(displayName, locator)
                                  sidecarJob?.cancel()
                                  sidecarJob = appScope.launch {
                                      delay(2000)
                                      saveSidecar(displayName, locator)
                                  }
                                  updateProgress(locator)
                                  // Reaplicar configuracion de zoom al cambiar de pagina
                                  // (cada pagina tiene su propio PhotoView).
                                  frag.view?.let {
                                      configurePhotoViewZoom(it)
                                      applyComicNavigatorStyle(it)
                                  }
                              }
                          }
                      } else {
                          // EPUB: EpubNavigatorFactory con preferencias y PaginationListener.
                          val prefs = currentEpubPreferences()
                          val factory = EpubNavigatorFactory(publication = publication)
                          supportFragmentManager.fragmentFactory = factory.createFragmentFactory(
                              initialLocator = initialLocator,
                              initialPreferences = prefs,
                              paginationListener = object : EpubNavigatorFragment.PaginationListener {
                                  override fun onPageChanged(pageIndex: Int, totalPages: Int, locator: Locator) {
                                      lastPageIndex = pageIndex
                                      lastTotalPages = totalPages
                                  }
                              },
                          )
                          val frag = supportFragmentManager.fragmentFactory
                              .instantiate(classLoader, EpubNavigatorFragment::class.java.name)
                              as EpubNavigatorFragment
                          supportFragmentManager.beginTransaction()
                              .replace(navContainer.id, frag, "epub_nav")
                              .commitNowAllowingStateLoss()
                          navigator = frag
                          topBarTitle.text = title
                          lifecycleScope.launch {
                              frag.currentLocator.collect { locator ->
                                  lastLocator = locator
                                  saveLocator(displayName, locator)
                                  sidecarJob?.cancel()
                                  sidecarJob = appScope.launch {
                                      delay(2000)
                                      saveSidecar(displayName, locator)
                                  }
                                  updateProgress(locator)
                              }
                          }
                      }
                  } catch (e: Throwable) {
                      Toast.makeText(this, "Error: ${e.message}", Toast.LENGTH_LONG).show()
                      closeBook()
                  }
              }
          
              /**
               * Busca recursivamente cualquier PhotoView dentro de la vista del navigator
               * y configura zoom maximo, zoom doble tap y minimo según preferencias.
               * PhotoView ya soporta pinch-to-zoom por defecto, pero estos limites amplian el rango util.
               */
              private fun configurePhotoViewZoom(root: View) {
                  val maxScale = loadComicZoomMax()
                  val medScale = loadComicDoubleTap()
                  if (root is com.github.chrisbanes.photoview.PhotoView) {
                      runCatching {
                          root.maximumScale = maxScale
                          root.mediumScale = medScale
                          root.minimumScale = 0.5f
                          root.scaleType = when (loadComicViewMode()) {
                              "FULL" -> android.widget.ImageView.ScaleType.CENTER_CROP
                              else -> android.widget.ImageView.ScaleType.FIT_CENTER
                          }
                          // PhotoView tiene zoom activo por defecto (no hay setter para desactivarlo).
                      }
                      return
                  }
                  if (root is ViewGroup) {
                      for (i in 0 until root.childCount) {
                          configurePhotoViewZoom(root.getChildAt(i))
                      }
                  }
              }
          
              private fun updateProgress(locator: Locator) {
                  val idx = chapters.indexOfFirst { it.url() == locator.href }
                  if (idx >= 0) chapterIndex = idx
          
                  val globalPct = locator.locations.totalProgression?.let { (it * 100).toInt() }
                      ?: run {
                          if (chapters.isEmpty()) 0
                          else {
                              val frac = if (lastTotalPages > 0)
                                  (lastPageIndex + 1).toDouble() / lastTotalPages else 0.5
                              (((chapterIndex.coerceAtLeast(0)) + frac) / chapters.size * 100).toInt()
                          }
                      }
          
                  progressBar.progress = (globalPct * 10).coerceIn(0, 1000)
                  progressText.text = "$globalPct% del libro"
          
                  val chTitle = chapters.getOrNull(chapterIndex)?.title
                  chapterText.text = chTitle
                      ?: if (chapterIndex >= 0) "Capitulo ${chapterIndex + 1} de ${chapters.size}"
                      else ""
          
                  btnPrevChapter.isEnabled = chapterIndex > 0
                  btnNextChapter.isEnabled = chapterIndex < chapters.lastIndex
                  btnPrevChapter.alpha = if (btnPrevChapter.isEnabled) 1f else 0.35f
                  btnNextChapter.alpha = if (btnNextChapter.isEnabled) 1f else 0.35f
              }
          
              private fun goToChapter(delta: Int) {
                  val nav = navigator as? org.readium.r2.navigator.Navigator ?: return
                  if (chapters.isEmpty()) return
                  val cur = if (chapterIndex >= 0) chapterIndex else 0
                  val idx = (cur + delta).coerceIn(0, chapters.lastIndex)
                  if (idx == cur && chapterIndex >= 0) return
                  nav.go(chapters[idx])
                  chapterIndex = idx
              }
          
              private fun flattenToc(
                  links: List<Link>,
                  level: Int = 0,
                  out: MutableList<Pair<Link, Int>> = mutableListOf(),
              ): MutableList<Pair<Link, Int>> {
                  for (l in links) {
                      val title = l.title ?: ""
                      val href = l.url().toString()
                      if (title.isNotBlank() || href.isNotBlank()) {
                          out.add(l to level)
                      }
                      if (l.children.isNotEmpty()) {
                          flattenToc(l.children, level + 1, out)
                      }
                  }
                  return out
              }
          
              private fun showChapterList() {
                  val nav = navigator as? org.readium.r2.navigator.Navigator ?: return
                  if (tableOfContents.isEmpty() && chapters.isEmpty()) {
                      Toast.makeText(this, "Sin indice de capitulos", Toast.LENGTH_SHORT).show()
                      return
                  }
                  val flat = flattenToc(if (tableOfContents.isNotEmpty()) tableOfContents else chapters)
                  if (flat.isEmpty()) {
                      Toast.makeText(this, "Sin indice de capitulos", Toast.LENGTH_SHORT).show()
                      return
                  }
                  val items = flat.mapIndexed { i, (link, level) ->
                      val indent = "  ".repeat(level)
                      (link.title ?: "Capitulo ${i + 1}").let { indent + it }
                  }.toTypedArray()
                  AlertDialog.Builder(this)
                      .setTitle("Capitulos")
                      .setItems(items) { _, which ->
                          val (link, _) = flat[which]
                          nav.go(link)
                          if (settingsVisible) toggleSettingsPanel()
                          topBar.visibility = View.GONE
                          bottomBar.visibility = View.GONE
                      }
                      .setNegativeButton("Cerrar", null)
                      .show()
              }
          
              fun toggleReaderOverlay() {
                  if (settingsVisible) {
                      toggleSettingsPanel()
                      return
                  }
                  val newVisibility = if (topBar.visibility == View.VISIBLE) View.GONE else View.VISIBLE
                  topBar.visibility = newVisibility
                  bottomBar.visibility = newVisibility
              }
          
              private fun toggleSettingsPanel() {
                  settingsVisible = !settingsVisible
                  settingsPanel.visibility = if (settingsVisible) View.VISIBLE else View.GONE
                  if (settingsVisible) {
                      // Solo mostramos las bars del lector si el lector está activo.
                      if (readerRoot.visibility == View.VISIBLE) {
                          topBar.visibility = View.VISIBLE
                          bottomBar.visibility = View.VISIBLE
                      }
                      brightnessSeekBar.progress = (loadActiveBrightness() * 100).toInt().coerceIn(0, 100)
                      brightnessValue.text = "${brightnessSeekBar.progress}%"
                      fontSizeValue.text = "${((loadEpubFontSize() ?: 1.0) * 100).toInt()}%"
                  } else {
                      if (readerRoot.visibility == View.VISIBLE) {
                          topBar.visibility = View.GONE
                          bottomBar.visibility = View.GONE
                      }
                  }
              }
          
              private fun closeBook() {
                  sidecarJob?.cancel()
                  val book = currentBookName
                  val loc = lastLocator
                  if (book != null && loc != null) {
                      appScope.launch { saveSidecar(book, loc) }
                  }
                  lastLocator = null
                  lastPageIndex = 0
                  lastTotalPages = 1
                  chapters = emptyList()
                  tableOfContents = emptyList()
                  chapterIndex = -1
                  navigator?.let {
                      try {
                          (it as? android.app.Fragment)?.let { frag ->
                              fragmentManager.beginTransaction().remove(frag)
                                  .commitNowAllowingStateLoss()
                          }
                      } catch (_: Throwable) {}
                      try {
                          (it as? androidx.fragment.app.Fragment)?.let { frag ->
                              supportFragmentManager.beginTransaction().remove(frag)
                                  .commitNowAllowingStateLoss()
                          }
                      } catch (_: Throwable) {}
                  }
                  navigator = null
                  currentBookName = null
                  exitImmersive()
                  settingsPanel.visibility = View.GONE
                  settingsVisible = false
                  topBar.visibility = View.GONE
                  bottomBar.visibility = View.GONE
                  readerRoot.visibility = View.GONE
                  libraryRoot.visibility = View.VISIBLE
                  // Restaurar brillo general y keep-screen al cerrar libro.
                  applyActiveBrightness()
                  applyKeepScreenToWindow()
                  lifecycleScope.launch { reloadLibrary() }
              }
          
              private fun enterImmersive() {
                  if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.R) {
                      window.setDecorFitsSystemWindows(false)
                      window.insetsController?.let {
                          it.systemBarsBehavior = WindowInsetsController.BEHAVIOR_SHOW_TRANSIENT_BARS_BY_SWIPE
                          it.hide(WindowInsets.Type.systemBars())
                      }
                  } else {
                      @Suppress("DEPRECATION")
                      window.decorView.systemUiVisibility = (
                          View.SYSTEM_UI_FLAG_IMMERSIVE_STICKY
                              or View.SYSTEM_UI_FLAG_FULLSCREEN
                              or View.SYSTEM_UI_FLAG_HIDE_NAVIGATION
                              or View.SYSTEM_UI_FLAG_LAYOUT_FULLSCREEN
                              or View.SYSTEM_UI_FLAG_LAYOUT_HIDE_NAVIGATION
                              or View.SYSTEM_UI_FLAG_LAYOUT_STABLE
                      )
                  }
              }
          
              private fun exitImmersive() {
                  if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.R) {
                      window.setDecorFitsSystemWindows(true)
                      window.insetsController?.show(WindowInsets.Type.systemBars())
                  } else {
                      @Suppress("DEPRECATION")
                      window.decorView.systemUiVisibility = View.SYSTEM_UI_FLAG_VISIBLE
                  }
              }
          
              @OptIn(ExperimentalReadiumApi::class)
              private fun currentEpubPreferences(): EpubPreferences {
                  // publisherStyles=false por defecto para que las preferencias de fuente/tamaño/etc.
                  // tengan efecto. Si el usuario activa "Respetar estilos autor" se pone a true.
                  val publisherStyles = prefs().getBoolean("pref_epub_pub_styles", false)
                  return EpubPreferences(
                      theme = loadEpubTheme(),
                      fontFamily = loadEpubFont()?.let { FontFamily(it) },
                      fontSize = loadEpubFontSize(),
                      fontWeight = loadEpubFontWeight(),
                      lineHeight = loadEpubLineHeight(),
                      pageMargins = loadEpubPageMargin(),
                      textAlign = loadEpubTextAlign(),
                      paragraphIndent = loadEpubParaIndent(),
                      paragraphSpacing = loadEpubParaSpacing(),
                      publisherStyles = publisherStyles,
                      readingProgression = loadEpubReadingProgression(),
                      columnCount = loadEpubColumnCount(),
                  )
              }
          
              @OptIn(ExperimentalReadiumApi::class)
              private fun applyTheme(theme: Theme?) {
                  // Tema de la APP (UI): solo afecta a library/panel, no al contenido EPUB.
                  prefs().edit().putString("pref_theme", theme?.name ?: "AUTO").apply()
                  applyGlobalTheme()
              }
          
