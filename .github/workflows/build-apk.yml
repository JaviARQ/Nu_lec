              private fun applyKeepScreenToWindow() {
                  if (prefs().getBoolean("pref_keep_screen", false)) {
                      window.addFlags(WindowManager.LayoutParams.FLAG_KEEP_SCREEN_ON)
                  } else {
                      window.clearFlags(WindowManager.LayoutParams.FLAG_KEEP_SCREEN_ON)
                  }
              }
          
              // ===== Brillo (general) =====
              // v22: brillo único global (no hay brillo específico de cómic).
          
              private fun applyBrightness(factor: Float) {
                  // v39: si Auto está activado, no aplicar brillo manual.
                  if (prefs().getBoolean("pref_brightness_auto", true)) return
                  val lp = window.attributes
                  lp.screenBrightness = factor.coerceIn(0.01f, 1f)
                  window.attributes = lp
              }
          
              /** v39: activa/desactiva el brillo automatico del sistema. */
              private fun applyBrightnessAuto(enabled: Boolean) {
                  prefs().edit().putBoolean("pref_brightness_auto", enabled).apply()
                  if (enabled) {
                      // Restaurar brillo del sistema: BRIGHTNESS_OVERRIDE_NONE = -1f
                      val lp = window.attributes
                      lp.screenBrightness = -1f
                      window.attributes = lp
                  } else {
                      // Aplicar brillo manual guardado
                      applyBrightness(loadActiveBrightness())
                  }
                  // v42: actualizar visibilidad del seekbar en tiempo real.
                    brightnessSeekBar.visibility = if (enabled) View.GONE else View.VISIBLE
                    brightnessValue.visibility = if (enabled) View.GONE else View.VISIBLE
                    if (!enabled) {
                        brightnessSeekBar.progress = (loadActiveBrightness() * 100).toInt().coerceIn(0, 100)
                        brightnessValue.text = "${brightnessSeekBar.progress}%"
                    }
                    refreshChips()
                }
          
              private fun loadActiveBrightness(): Float =
                  prefs().getFloat("pref_brightness", 0.5f)
          
              private fun saveActiveBrightness(factor: Float) {
                  prefs().edit().putFloat("pref_brightness", factor.coerceIn(0.01f, 1f)).apply()
              }
          
              private fun applyActiveBrightness() {
                  // v39: si Auto está activado, respetar el brillo del sistema.
                  if (prefs().getBoolean("pref_brightness_auto", true)) {
                      val lp = window.attributes
                      lp.screenBrightness = -1f
                      window.attributes = lp
                  } else {
                      applyBrightness(loadActiveBrightness())
                  }
              }
          
