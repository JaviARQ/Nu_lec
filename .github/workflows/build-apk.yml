              /** Handler para auto-ocultar los overlays del lector tras unos segundos. */
              private val overlayHideHandler = Handler(Looper.getMainLooper())
              private val overlayHideRunnable = Runnable {
                  if (readerRoot.visibility == View.VISIBLE && !settingsVisible) {
                      topBar.visibility = View.GONE
                      bottomBar.visibility = View.GONE
                  }
              }
              /** Programa el auto-ocultar de overlays tras 4 segundos. */
              private fun scheduleOverlayHide() {
                  overlayHideHandler.removeCallbacks(overlayHideRunnable)
                  overlayHideHandler.postDelayed(overlayHideRunnable, 4000)
              }
          
              private val openEpubLauncher = registerForActivityResult(
                  ActivityResultContracts.OpenDocument()
              ) { uri ->
                  if (uri != null) lifecycleScope.launch { openEpubExternal(uri) }
              }
          
              private val pickLibraryTreeLauncher = registerForActivityResult(
                  ActivityResultContracts.OpenDocumentTree()
              ) { uri ->
                  if (uri != null) {
                      contentResolver.takePersistableUriPermission(
                          uri,
                          Intent.FLAG_GRANT_READ_URI_PERMISSION or
                              Intent.FLAG_GRANT_WRITE_URI_PERMISSION
                      )
                      val prefsKey = when (currentMedia) {
                          LibraryMediaType.EPUB -> "library_tree_uri"
                          LibraryMediaType.COMIC -> "comics_tree_uri"
                      }
                      prefs().edit().putString(prefsKey, uri.toString()).apply()
                      when (currentMedia) {
                          LibraryMediaType.EPUB -> libraryTreeUri = uri
                          LibraryMediaType.COMIC -> comicsTreeUri = uri
                      }
                      currentFolderUri = null
                      refreshLibraryButtons()
                      applyGlobalTheme()
                      lifecycleScope.launch { reloadLibrary() }
                  }
              }
          
              @OptIn(ExperimentalReadiumApi::class)
              override fun onCreate(savedInstanceState: Bundle?) {
                  super.onCreate(savedInstanceState)
                  libraryTreeUri = prefs().getString("library_tree_uri", null)?.let {
                      runCatching { Uri.parse(it) }.getOrNull()
                  }
                  comicsTreeUri = prefs().getString("comics_tree_uri", null)?.let {
                      runCatching { Uri.parse(it) }.getOrNull()
                  }
                  buildUI()
                  applyGlobalTheme()
                  updateLibraryColumns()
                  applyKeepScreenToWindow()
                  applyActiveBrightness()
                  if (libraryTreeUri != null) {
                      lifecycleScope.launch { reloadLibrary() }
                  }
              }
          
              override fun onConfigurationChanged(newConfig: Configuration) {
                  super.onConfigurationChanged(newConfig)
                  updateLibraryColumns()
                  applyGlobalTheme()
              }
          
