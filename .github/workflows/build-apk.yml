            -webkit-font-smoothing: antialiased;
            font-size: 17px; line-height: 1.4;
            height: 100vh; height: 100dvh;
            overflow: hidden;
          }
          .visually-hidden {
            position: absolute !important;
            width: 1px; height: 1px;
            margin: -1px; padding: 0; border: 0;
            overflow: hidden;
            clip: rect(0 0 0 0);
            clip-path: inset(50%);
            white-space: nowrap;
          }
          .topbar {
            position: fixed; top: 0; left: 0; right: 0;
            height: 56px; padding-top: env(safe-area-inset-top, 0);
            display: flex; align-items: center; justify-content: space-between;
            padding-left: 8px; padding-right: 8px;
            background: #fff; border-bottom: 1px solid #f2f2f2;
            z-index: 10;
          }
          .icon-btn {
            width: 40px; height: 40px;
            border: none; background: transparent;
            font-size: 28px; color: #000;
            cursor: pointer; border-radius: 50%;
            display: flex; align-items: center; justify-content: center;
            line-height: 1; font-weight: 300;
          }
          .icon-btn:active { background: #f2f2f2; }
          .title {
            flex: 1; font-size: 17px; font-weight: 600;
            text-align: center; margin: 0;
            white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
            letter-spacing: -0.2px;
          }
          .empty {
            height: 100vh; height: 100dvh;
            display: flex; flex-direction: column;
            align-items: center; justify-content: center;
            padding: 32px 24px; text-align: center;
          }
          .empty-icon { font-size: 64px; margin-bottom: 16px; }
          .empty h2 { margin: 0 0 8px; font-size: 24px; font-weight: 700; letter-spacing: -0.5px; }
          .empty p { margin: 0 0 24px; color: #8a8a8e; font-size: 15px; max-width: 320px; }
          .primary-btn {
            display: block;
            padding: 14px 32px; background: #000; color: #fff;
            border: none; border-radius: 14px;
            font-size: 17px; font-weight: 600;
            cursor: pointer; margin-bottom: 12px;
            width: 100%; max-width: 320px;
            text-align: center;
            -webkit-user-select: none; user-select: none;
          }
          .primary-btn:active { opacity: 0.7; }
          .ghost-btn {
            display: block;
            padding: 12px 24px; background: transparent;
            color: #007aff; border: none;
            font-size: 15px; font-weight: 500;
            cursor: pointer; margin-bottom: 32px;
            text-align: center;
            -webkit-user-select: none; user-select: none;
          }
          .ghost-btn:active { opacity: 0.5; }
          .hint {
            font-size: 13px; color: #8a8a8e;
            max-width: 320px !important; line-height: 1.5; margin-bottom: 0;
          }
          .reader {
            position: fixed; top: 0; left: 0; right: 0; bottom: 0;
            display: flex; flex-direction: column;
          }
          #viewer {
            flex: 1; width: 100%;
            margin-top: 56px; margin-bottom: 56px;
            overflow: hidden;
          }
          .bottombar {
            position: fixed; bottom: 0; left: 0; right: 0;
            height: 56px; padding-bottom: env(safe-area-inset-bottom, 0);
            background: #fff; border-top: 1px solid #f2f2f2;
            display: flex; align-items: center; justify-content: space-between;
            padding-left: 8px; padding-right: 8px;
            z-index: 10;
          }
          .nav-btn {
            width: 44px; height: 44px;
            border: none; background: transparent;
            font-size: 32px; color: #000;
            cursor: pointer; border-radius: 50%;
            display: flex; align-items: center; justify-content: center;
            line-height: 1; font-weight: 300;
          }
          .nav-btn:active { background: #f2f2f2; }
          .progress-info {
            flex: 1; display: flex; flex-direction: column;
            align-items: center; font-size: 13px; color: #8a8a8e;
          }
          #progress-text { font-weight: 600; color: #000; font-size: 14px; }
          .overlay {
            position: fixed; top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(0,0,0,0.4); z-index: 100;
          }
          .sheet {
            position: fixed; bottom: 0; left: 0; right: 0;
            background: #f2f2f2; border-radius: 16px 16px 0 0;
            padding: 8px; padding-bottom: calc(8px + env(safe-area-inset-bottom, 0));
            z-index: 101;
          }
          .sheet-item {
            display: block; width: 100%; padding: 16px;
            background: #fff; border: none; border-radius: 10px;
            text-align: center; font-size: 17px; color: #007aff;
            cursor: pointer; margin-bottom: 8px; font-family: inherit;
            -webkit-user-select: none; user-select: none;
          }
          .sheet-item:active { background: #f0f0f0; }
          .sheet-cancel { font-weight: 600; margin-bottom: 0; }
          @media (prefers-color-scheme: dark) {
            html, body { background: #000; color: #fff; }
            .topbar, .bottombar { background: #000; border-color: #1c1c1e; }
            .icon-btn, .nav-btn { color: #fff; }
            .icon-btn:active, .nav-btn:active { background: #1c1c1e; }
            .primary-btn { background: #fff; color: #000; }
            .ghost-btn, .sheet-item { color: #0a84ff; }
            .sheet { background: #1c1c1e; }
            .sheet-item { background: #2c2c2e; color: #0a84ff; }
            .sheet-item:active { background: #3a3a3c; }
            .sheet-cancel { color: #0a84ff; }
            #progress-text { color: #fff; }
            .empty p, .hint { color: #8a8a8e; }
          }
          EOF

      - name: Crear src/app.js
        run: |
          cat > src/app.js <<'EOF'
          (function () {
            'use strict';

            var currentBook = null;
            var currentRendition = null;
            var currentFileName = null;
            var touchStartX = null;

            var emptyState = document.getElementById('empty');
            var readerView = document.getElementById('reader');
            var titleEl = document.getElementById('title');
            var progressEl = document.getElementById('progress-text');
            var viewerEl = document.getElementById('viewer');
            var topbar = document.getElementById('topbar');
            var bottombar = document.getElementById('bottombar');
            var fileInput = document.getElementById('file-input');
            var jsonInput = document.getElementById('json-input');
            var overlay = document.getElementById('overlay');
            var sheet = document.getElementById('sheet');

            // Abrir/Importar se hacen con <label for="..."> (mas fiable en WebView).
            document.getElementById('back-btn').addEventListener('click', closeBook);
            document.getElementById('menu-btn').addEventListener('click', openSheet);
            document.getElementById('prev-btn').addEventListener('click', function () {
              if (currentRendition) currentRendition.prev();
            });
            document.getElementById('next-btn').addEventListener('click', function () {
              if (currentRendition) currentRendition.next();
            });

            document.getElementById('sheet-open').addEventListener('click', closeSheet);
            document.getElementById('sheet-import').addEventListener('click', closeSheet);
            document.getElementById('sheet-export').addEventListener('click', function () {
              closeSheet();
              exportProgress();
            });
            document.getElementById('sheet-cancel').addEventListener('click', closeSheet);
            overlay.addEventListener('click', closeSheet);

            fileInput.addEventListener('change', function (e) {
              var file = e.target.files[0];
              if (!file) return;
              currentFileName = file.name;
              var reader = new FileReader();
              reader.onload = function () {
                openBook(reader.result, file.name);
              };
              reader.readAsArrayBuffer(file);
              e.target.value = '';
            });

            function openBook(arrayBuffer, fileName) {
              if (currentRendition) { try { currentRendition.destroy(); } catch (err) {} }
              if (currentBook) { try { currentBook.destroy(); } catch (err) {} }
              viewerEl.innerHTML = '';

              emptyState.hidden = true;
              readerView.hidden = false;
              titleEl.textContent = fileName.replace(/\.epub$/i, '');
              progressEl.textContent = '...';

              try {
                currentBook = ePub(arrayBuffer);
                currentRendition = currentBook.renderTo(viewerEl, {
                  width: '100%',
                  height: '100%',
                  spread: 'none',
                  flow: 'paginated'
                });

                var savedCfi = localStorage.getItem('book:' + fileName + ':cfi');

                currentRendition.display(savedCfi || undefined).then(function () {
                  return currentBook.ready.then(function () {
                    return currentBook.locations.generate(1200);
                  });
                }).then(function () {
                  updateProgressFromCfi(localStorage.getItem('book:' + fileName + ':cfi'));
                }).catch(function () {});

                currentBook.loaded.metadata.then(function (meta) {
                  if (meta && meta.title) titleEl.textContent = meta.title;
                }).catch(function () {});

                currentRendition.on('relocated', function (location) {
                  if (!location || !location.start) return;
                  var cfi = location.start.cfi;
                  localStorage.setItem('book:' + fileName + ':cfi', cfi);
                  updateProgressFromCfi(cfi);
                });

                // Navegacion por gestos: deslizar horizontal
                viewerEl.addEventListener('touchstart', function (e) {
                  touchStartX = e.changedTouches[0].clientX;
                }, { passive: true });
                viewerEl.addEventListener('touchend', function (e) {
                  if (touchStartX === null) return;
                  var dx = e.changedTouches[0].clientX - touchStartX;
                  touchStartX = null;
                  if (Math.abs(dx) < 50) return;
                  if (dx < 0) { if (currentRendition) currentRendition.next(); }
                  else { if (currentRendition) currentRendition.prev(); }
                }, { passive: true });

              } catch (err) {
                alert('Error al abrir el EPUB: ' + err.message);
                closeBook();
              }
            }

            function updateProgressFromCfi(cfi) {
              if (!cfi || !currentBook || !currentBook.locations.length()) {
                progressEl.textContent = '0%';
                return;
              }
              try {
                var pct = currentBook.locations.percentageFromCfi(cfi);
                progressEl.textContent = Math.round(pct * 100) + '%';
                localStorage.setItem('book:' + currentFileName + ':progress', String(pct));
              } catch (err) {
                progressEl.textContent = '...';
              }
            }

            function closeBook() {
              if (currentRendition) { try { currentRendition.destroy(); } catch (err) {} }
              if (currentBook) { try { currentBook.destroy(); } catch (err) {} }
              currentBook = null;
              currentRendition = null;
              currentFileName = null;
              viewerEl.innerHTML = '';
              emptyState.hidden = false;
              readerView.hidden = true;
            }

            function exportProgress() {
              if (!currentFileName) {
                alert('Abre un EPUB primero.');
                return;
              }
              var cfi = localStorage.getItem('book:' + currentFileName + ':cfi') || '';
              var progress = parseFloat(localStorage.getItem('book:' + currentFileName + ':progress') || '0');
              var data = {
                version: 1,
                bookName: currentFileName,
                cfi: cfi,
                progress: progress,
                updatedAt: new Date().toISOString()
              };
              var blob = new Blob([JSON.stringify(data, null, 2)], { type: 'application/json' });
              var url = URL.createObjectURL(blob);
              var a = document.createElement('a');
              a.href = url;
              a.download = currentFileName.replace(/\.epub$/i, '.json');
              document.body.appendChild(a);
              a.click();
              document.body.removeChild(a);
              setTimeout(function () { URL.revokeObjectURL(url); }, 1000);
            }

            jsonInput.addEventListener('change', function (e) {
              var file = e.target.files[0];
              if (!file) return;
              var reader = new FileReader();
              reader.onload = function () {
                try {
                  var data = JSON.parse(reader.result);
                  if (!data.bookName || !data.cfi) {
                    alert('Archivo no valido. Debe contener bookName y cfi.');
                    return;
                  }
                  localStorage.setItem('book:' + data.bookName + ':cfi', data.cfi);
                  if (typeof data.progress === 'number') {
                    localStorage.setItem('book:' + data.bookName + ':progress', String(data.progress));
                  }
                  if (currentFileName === data.bookName && currentRendition) {
                    currentRendition.display(data.cfi);
                    alert('Progreso aplicado a "' + data.bookName + '".');
                  } else {
                    alert('Progreso importado para "' + data.bookName + '". Abrelo para continuar desde ahi.');
                  }
                } catch (err) {
                  alert('Error al leer el JSON: ' + err.message);
                }
              };
              reader.readAsText(file);
              e.target.value = '';
            });

            function openSheet() {
              overlay.hidden = false;
              sheet.hidden = false;
            }
            function closeSheet() {
              overlay.hidden = true;
              sheet.hidden = true;
            }
          })();
          EOF

      - name: Instalar dependencias npm
        run: npm install

      - name: Compilar assets web
        run: npm run build

      - name: Añadir plataforma Android
        run: npx cap add android

      - name: Sincronizar Capacitor
        run: npx cap sync android

      - name: Compilar APK debug con Gradle
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Subir APK como artifact descargable
        uses: actions/upload-artifact@v5
        with:
          name: lector-epub-debug-apk
          path: android/app/build/outputs/apk/debug/*.apk
          retention-days: 90
          if-no-files-found: error
