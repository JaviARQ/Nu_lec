              private fun applyGlobalTheme() {
                  val dark = isDark
                  val bg = if (dark) 0xFF121212.toInt() else 0xFFFAFAFA.toInt()
                  val txt = if (dark) 0xFFF5F5F5.toInt() else 0xFF1A1A1A.toInt()
                  val sub = if (dark) 0xFF9E9E9E.toInt() else 0xFF757575.toInt()
          
                  libraryRoot.setBackgroundColor(bg)
                  headerTitle.setTextColor(if (dark) 0xFFFFFFFF.toInt() else ACCENT)
                  headerSub.setTextColor(sub)
                  libraryHint.setTextColor(sub)
                  libraryAdapter.isDark = dark
          
                  val btnBg = GradientDrawable().apply {
                      cornerRadius = 14 * density
                      setColor(if (dark) 0xFF2A2A2A.toInt() else ACCENT)
                      setStroke(dp(1), if (dark) 0xFF444444.toInt() else ACCENT_DARK)
                  }
                  btnPickLibrary.background = btnBg
                  btnPickLibrary.setTextColor(if (dark) 0xFFEDEDED.toInt() else Color.WHITE)
                  btnOpenExternal.background = btnBg
                  btnOpenExternal.setTextColor(if (dark) 0xFFEDEDED.toInt() else Color.WHITE)
          
                  val panelBg = GradientDrawable().apply {
                      cornerRadius = 16 * density
                      // Panel ligeramente translucido para ver la lectura debajo.
                      setColor(if (dark) 0xEE1E1E1E.toInt() else 0xEEFAFAFA.toInt())
                      setStroke(dp(1), if (dark) 0xFF333333.toInt() else 0xFFE0E0E0.toInt())
                  }
                  settingsContent.background = panelBg
                  sectionLabels.forEach {
                      it.setTextColor(if (dark) 0xFF8AB4F8.toInt() else ACCENT)
                  }
                  labelsSmall.forEach {
                      it.setTextColor(txt)
                  }
                  fun paintChipActive(b: Button, isActive: Boolean) {
                      val chipBg = GradientDrawable().apply {
                          cornerRadius = 14 * density
                          if (isActive) {
                              setColor(ACCENT)
                              setStroke(dp(1), ACCENT_DARK)
                          } else {
                              setColor(if (dark) 0xFF2E2E2E.toInt() else 0xFFEEEEEE.toInt())
                          }
                      }
                      b.background = chipBg
                      b.setTextColor(if (isActive) Color.WHITE else (if (dark) 0xFFEDEDED.toInt() else 0xFF1A1A1A.toInt()))
                  }
                  allChips.forEach { b ->
                      // Cada chip guarda en tag una lambda () -> Boolean (si tiene estado).
                      val isActive = (b.tag as? (() -> Boolean))?.invoke() == true
                      paintChipActive(b, isActive)
                  }
                  brightnessValue.setTextColor(txt)
                  // Actualiza el color de los iconos de selección de biblioteca.
                  updateMediaToggle()
              }
          
              /**
               * Re-pinta solo el resaltado de los chips segun su estado activo.
               * Llamado tras cualquier apply* para que el chip recien pulsado se
               * resalte al instante sin tener que re-tematizar toda la UI.
               */
              private fun refreshChips() {
                  val dark = isDark
                  allChips.forEach { b ->
                      val isActive = (b.tag as? (() -> Boolean))?.invoke() == true
                      val chipBg = GradientDrawable().apply {
                          cornerRadius = 20 * density
                          if (isActive) {
                              setColor(ACCENT)
                              setStroke(dp(1), ACCENT_DARK)
                          } else {
                              setColor(if (dark) 0xFF2E2E2E.toInt() else 0xFFEEEEEE.toInt())
                          }
                      }
                      b.background = chipBg
                      b.setTextColor(if (isActive) Color.WHITE else (if (dark) 0xFFEDEDED.toInt() else 0xFF1A1A1A.toInt()))
                  }
              }
          
              /**
               * Muestra/oculta las secciones del panel de ajustes segun el contexto:
               *  - En biblioteca: solo GENERAL.
               *  - Lector EPUB: GENERAL + LECTURA EPUB.
               *  - Lector Comic: GENERAL + LECTURA COMIC.
               */
              private fun updateSettingsSections() {
                  val readerVisible = readerRoot.visibility == View.VISIBLE
                  val isEpub = navigator is EpubNavigatorFragment
                  val isComic = navigator is ImageNavigatorFragment
                  // v26: separación estricta.
                  //  - En biblioteca (reader oculto): solo GENERALES
                  //  - En lector EPUB: solo LECTURA EPUB
                  //  - En lector COMIC: solo LECTURA COMIC
                  sectionGeneral.visibility = if (!readerVisible) View.VISIBLE else View.GONE
                  sectionEpub.visibility = if (readerVisible && isEpub) View.VISIBLE else View.GONE
                  sectionComic.visibility = if (readerVisible && isComic) View.VISIBLE else View.GONE
              }
          
              /**
               * v28: actualiza la visibilidad de los controles del lector segun el
               * tipo de navigator. El botón de citas (btnHighlights) solo es visible
               * en EPUB; los comics no soportan highlights.
               * Llamado tras asignar `navigator` en openInternal y al cerrar libro.
               */
              private fun updateReaderControls() {
                  val isEpub = navigator is EpubNavigatorFragment
                  btnHighlights.visibility = if (isEpub) View.VISIBLE else View.GONE
              }
          
              private fun refreshLibraryButtons() {
                  val hasLibrary = activeTreeUri() != null
                  btnPickLibrary.visibility = if (hasLibrary) View.GONE else View.VISIBLE
                  btnOpenExternal.visibility = if (hasLibrary) View.GONE else View.VISIBLE
                  btnRefreshLibrary.visibility = if (hasLibrary) View.VISIBLE else View.GONE
                  // Botón "Todas las citas": visible solo si hay biblioteca y es EPUB
                  // (los comics no soportan highlights).
                  btnAllQuotes.visibility =
                      if (hasLibrary && currentMedia == LibraryMediaType.EPUB) View.VISIBLE else View.GONE
              }
          
              /** URI raiz de la biblioteca actualmente activa. */
              private fun activeTreeUri(): Uri? = when (currentMedia) {
                  LibraryMediaType.EPUB -> libraryTreeUri
                  LibraryMediaType.COMIC -> comicsTreeUri
              }
          
              /** Cambia entre biblioteca de libros y comics. */
              private fun switchMedia(media: LibraryMediaType) {
                  if (currentMedia == media) return
                  currentMedia = media
                  currentFolderUri = null
                  updateMediaToggle()
                  refreshLibraryButtons()
                  headerSub.text = when (media) {
                      LibraryMediaType.EPUB -> "Tu biblioteca de libros"
                      LibraryMediaType.COMIC -> "Tu biblioteca de comics"
                  }
                  lifecycleScope.launch { reloadLibrary() }
              }
          
              /** Marca visualmente qué botón está activo (libro/comic). */
              private fun updateMediaToggle() {
                  val active = ACCENT_DARK
                  val inactive = if (isDark) 0xFF666666.toInt() else 0xFF999999.toInt()
                  btnMediaEpub.setColorFilter(
                      if (currentMedia == LibraryMediaType.EPUB) active else inactive
                  )
                  btnMediaComic.setColorFilter(
                      if (currentMedia == LibraryMediaType.COMIC) active else inactive
                  )
              }
          
              // ============== LIBRARY ==============
          
              private suspend fun reloadLibrary() {
                  val tree = activeTreeUri() ?: run {
                      libraryAdapter.submit(emptyList())
                      refreshLibraryButtons()
                      updateFolderNav()
                      headerSub.text = when (currentMedia) {
                          LibraryMediaType.EPUB -> "Elige una carpeta de libros"
                          LibraryMediaType.COMIC -> "Elige una carpeta de comics"
                      }
                      libraryHint.text = ""
                      return
                  }
                  refreshLibraryButtons()
                  updateFolderNav()
                  libraryHint.text = "Cargando biblioteca..."
                  val folderUri = currentFolderUri ?: tree
                  val mediaExts = when (currentMedia) {
                      LibraryMediaType.EPUB -> setOf("epub")
                      LibraryMediaType.COMIC -> setOf("cbz", "cbr")
                  }
                  val mediaMimes = when (currentMedia) {
                      LibraryMediaType.EPUB -> setOf("application/epub+zip")
                      LibraryMediaType.COMIC -> setOf(
                          "application/vnd.comicbook+zip", "application/vnd.comicbook-rar",
                          "application/x-cbz", "application/x-cbr"
                      )
                  }
                  val entries = withContext(Dispatchers.IO) {
                      val folderDocId = if (currentFolderUri != null)
                          DocumentsContract.getDocumentId(folderUri)
                      else
                          DocumentsContract.getTreeDocumentId(folderUri)
                      val children = DocumentsContract.buildChildDocumentsUriUsingTree(tree, folderDocId)
                      val books = mutableListOf<LibraryEntry>()
                      val folders = mutableListOf<LibraryEntry>()
                      contentResolver.query(children, arrayOf(
                          Document.COLUMN_DOCUMENT_ID,
                          Document.COLUMN_DISPLAY_NAME,
                          Document.COLUMN_MIME_TYPE
                      ), null, null, null)?.use { c ->
                          val idIdx = c.getColumnIndexOrThrow(Document.COLUMN_DOCUMENT_ID)
                          val nameIdx = c.getColumnIndexOrThrow(Document.COLUMN_DISPLAY_NAME)
                          val mimeIdx = c.getColumnIndexOrThrow(Document.COLUMN_MIME_TYPE)
                          while (c.moveToNext()) {
                              val name = c.getString(nameIdx) ?: continue
                              val mime = c.getString(mimeIdx) ?: ""
                              val docId = c.getString(idIdx)
                              val docUri = DocumentsContract.buildDocumentUriUsingTree(tree, docId)
          
                              val isDir = mime == DocumentsContract.Document.MIME_TYPE_DIR
                              val ext = name.substringAfterLast('.', "").lowercase()
                              val isMedia = mime in mediaMimes || ext in mediaExts
          
                              if (isDir) {
                                  val count = countMediaIn(folderUri = docUri, tree = tree, exts = mediaExts, mimes = mediaMimes)
                                  if (count > 0) {
                                      folders.add(LibraryEntry(
                                          fileName = name,
                                          title = name,
                                          cover = null,
                                          documentUri = docUri,
                                          type = LibraryEntryType.COLLECTION,
                                          bookCount = count,
                                      ))
                                  }
                              } else if (isMedia) {
                                  val meta = readMetadata(docUri, name)
                                  val pct = prefs().getInt("progress_$name", -1)
                                  books.add(LibraryEntry(
                                      fileName = name,
                                      title = meta.first,
                                      cover = meta.second,
                                      documentUri = docUri,
                                      extension = ext,
                                      progressPct = pct,
                                  ))
                              }
                          }
                      }
                      (folders.sortedBy { it.title.lowercase() } +
                          books.sortedBy { it.title.lowercase() })
                  }
                  libraryAdapter.submit(entries)
                  val nBooks = entries.count { it.type == LibraryEntryType.BOOK }
                  val nFolders = entries.count { it.type == LibraryEntryType.COLLECTION }
                  val noun = when (currentMedia) {
                      LibraryMediaType.EPUB -> "libros"
                      LibraryMediaType.COMIC -> "comics"
                  }
                  headerSub.text = when {
                      nFolders > 0 && nBooks > 0 -> "$nFolders colecciones, $nBooks $noun"
                      nFolders > 0 -> "$nFolders colecciones"
                      else -> "$nBooks $noun en tu biblioteca"
                  }
                  libraryHint.text = if (entries.isEmpty()) "Carpeta vacía" else ""
              }
          
              private suspend fun countMediaIn(
                  folderUri: Uri,
                  tree: Uri,
                  exts: Set<String>,
                  mimes: Set<String>,
              ): Int = withContext(Dispatchers.IO) {
                  try {
                      val folderDocId = DocumentsContract.getDocumentId(folderUri)
                      val children = DocumentsContract.buildChildDocumentsUriUsingTree(tree, folderDocId)
                      var count = 0
                      contentResolver.query(children, arrayOf(
                          Document.COLUMN_DISPLAY_NAME,
                          Document.COLUMN_MIME_TYPE
                      ), null, null, null)?.use { c ->
                          val nameIdx = c.getColumnIndexOrThrow(Document.COLUMN_DISPLAY_NAME)
                          val mimeIdx = c.getColumnIndexOrThrow(Document.COLUMN_MIME_TYPE)
                          while (c.moveToNext()) {
                              val name = c.getString(nameIdx) ?: continue
                              val mime = c.getString(mimeIdx) ?: ""
                              val ext = name.substringAfterLast('.', "").lowercase()
                              if (mime in mimes || ext in exts) count++
                          }
                      }
                      count
                  } catch (_: Throwable) { 0 }
              }
          
              private suspend fun enterFolder(folderDocUri: Uri, title: String) {
                  currentFolderUri = folderDocUri
                  reloadLibrary()
              }
          
              private fun goUpFolder() {
                  currentFolderUri = null
                  lifecycleScope.launch { reloadLibrary() }
              }
          
              private fun updateFolderNav() {
                  val navRow = libraryRoot.findViewWithTag<View>("folder_nav_row") ?: return
                  val folderName = libraryRoot.findViewWithTag<View>("folder_name") as? TextView ?: return
                  if (currentFolderUri != null) {
                      navRow.visibility = View.VISIBLE
                      val name = runCatching {
                          DocumentsContract.getDocumentId(currentFolderUri!!)
                              .substringAfterLast('/')
                      }.getOrNull() ?: "Carpeta"
                      folderName.text = name
                  } else {
                      navRow.visibility = View.GONE
                      folderName.text = ""
                  }
              }
          
              private suspend fun readMetadata(uri: Uri, fallbackName: String): Pair<String, Bitmap?> = withContext(Dispatchers.IO) {
                  try {
                      val ext = fallbackName.substringAfterLast('.', "epub").lowercase()
                      // v26: para CBR, Readium no puede abrirlo nativamente. Convertimos a CBZ en cache
                      // primero (igual que al abrir para leer), y luego abrimos el CBZ.
                      val cached: File = if (ext == "cbr") {
                          runCatching { ComicConverter.convertCbrToCbz(this@MainActivity, uri, fallbackName) }
                              .getOrNull()
                              ?: return@withContext fallbackName.substringBeforeLast('.') to null
                      } else {
                          val c = File.createTempFile("meta_", ".$ext", cacheDir)
                          contentResolver.openInputStream(uri)?.use { input ->
                              c.outputStream().use { input.copyTo(it) }
                          } ?: return@withContext fallbackName to null
                          c
                      }
                      val assetResult = app.assetRetriever.retrieve(cached)
                      val asset = assetResult.getOrNull()
                          ?: return@withContext fallbackName.substringBeforeLast('.') to null
                      val pubResult = app.publicationOpener.open(asset, allowUserInteraction = false)
                      val pub = pubResult.getOrNull() ?: return@withContext fallbackName.substringBeforeLast('.') to null
                      // v22: para comics (cbz/cbr) el título suele ser null o igual al nombre del archivo.
                      // En ese caso, devolvemos el nombre SIN extensión para no mostrar ".cbz"/".cbr".
                      val rawTitle = pub.metadata.title
                      val title = if (ext == "cbz" || ext == "cbr") {
                          if (rawTitle.isNullOrBlank() || rawTitle == fallbackName) {
                              fallbackName.substringBeforeLast('.')
                          } else {
                              rawTitle
                          }
                      } else {
                          rawTitle ?: fallbackName
                      }
                      // Primero intentar pub.cover() (funciona para EPUB y CBZ si el parser lo soporta).
                      var cover: Bitmap? = runCatching { pub.cover() }.getOrNull()
                      // Si es comic (CBZ/CBR) y no hay cover, extraer la primera imagen del readingOrder.
                      if (cover == null && (ext == "cbz" || ext == "cbr")) {
                          cover = extractFirstImageAsBitmap(pub)
                      }
                      pub.close()
                      if (ext != "cbr") cached.delete()  // El CBZ de CBR queda en cache para reutilizar al abrir
                      title to cover
                  } catch (_: Throwable) {
                      fallbackName.substringBeforeLast('.') to null
                  }
              }
          
              /**
               * Para comics: extrae la primera imagen del readingOrder como Bitmap.
               * Lee el primer Link, obtiene su recurso como InputStream, y lo decodifica.
               */
              private suspend fun extractFirstImageAsBitmap(publication: Publication): Bitmap? = withContext(Dispatchers.IO) {
                  try {
                      val firstLink = publication.readingOrder.firstOrNull() ?: return@withContext null
                      val resource = publication.get(firstLink) ?: return@withContext null
                      // Resource.read() devuelve Try<ByteArray, ReadError>; getOrNull() da el ByteArray directo.
                      val bytes = runCatching {
                          resource.read().getOrNull()
                      }.getOrNull() ?: return@withContext null
                      runCatching {
                          android.graphics.BitmapFactory.decodeByteArray(bytes, 0, bytes.size)
                      }.getOrNull()
                  } catch (_: Throwable) { null }
              }
          
              private suspend fun openFromLibrary(entry: LibraryEntry) {
                  currentBookFolderUri = currentFolderUri ?: activeTreeUri()
                  openInternal(
                      uri = entry.documentUri,
                      displayName = entry.fileName,
                      title = entry.title,
                      extension = entry.extension,
                  )
              }
          
              private suspend fun openEpubExternal(uri: Uri) {
                  currentBookFolderUri = currentFolderUri ?: activeTreeUri()
                  val name = queryDisplayName(uri) ?: "libro.epub"
                  val ext = name.substringAfterLast('.', "").lowercase()
                  openInternal(uri = uri, displayName = name, title = name.substringBeforeLast('.'), extension = ext)
              }
          
              // ============== READER ==============
          
              @OptIn(ExperimentalReadiumApi::class)
              private suspend fun openInternal(uri: Uri, displayName: String, title: String, extension: String) {
                  try {
                      // Para CBR: convertir a CBZ en cache primero (Readium no soporta CBR).
                      val cached: File
                      val isComic = extension == "cbz" || extension == "cbr"
                      if (extension == "cbr") {
                          Toast.makeText(this, "Convirtiendo CBR a CBZ...", Toast.LENGTH_SHORT).show()
                          cached = ComicConverter.convertCbrToCbz(this, uri, displayName)
                      } else {
                          cached = File(cacheDir, displayName)
                          withContext(Dispatchers.IO) {
                              contentResolver.openInputStream(uri)?.use { input ->
                                  cached.outputStream().use { input.copyTo(it) }
                              } ?: error("No se pudo leer el archivo seleccionado")
                          }
                      }
                      currentBookName = displayName
          
                      val assetResult = withContext(Dispatchers.IO) {
                          app.assetRetriever.retrieve(cached)
                      }
                      val asset = assetResult.getOrNull()
                          ?: error("Readium no pudo leer el archivo: " +
                              "${assetResult.failureOrNull()?.message ?: "formato no reconocido"}")
                      val publicationResult = withContext(Dispatchers.IO) {
                          app.publicationOpener.open(asset, allowUserInteraction = true)
                      }
                      val publication = publicationResult.getOrNull()
                          ?: error("Readium no pudo abrir el archivo: " +
                              "${publicationResult.failureOrNull()?.message ?: "error desconocido"}")
          
                      currentPublication = publication
                      chapters = publication.readingOrder
                      tableOfContents = publication.tableOfContents
                      chapterIndex = 0
          
                      val sidecarData = loadSidecar(displayName)
                      // v46: la posicion de lectura SOLO viene de readingpos_ (SharedPreferences).
                      // Si venimos de una cita (pendingHighlightLocator), ir a la cita.
                      // Si no, ir a la posicion de lectura guardada.
                      val initialLocator = pendingHighlightLocator ?: loadLocator(displayName)
                      // Cargar highlights del libro actual (vacío si el sidecar es v1 o no existe).
                      currentHighlights.clear()
                      currentHighlights.addAll(sidecarData?.second ?: emptyList())
          
                      libraryRoot.visibility = View.GONE
                      readerRoot.visibility = View.VISIBLE
                      enterImmersive()
          
                      if (isComic) {
                          // COMIC: ImageNavigatorFragment (sin preferencias, sin PaginationListener).
                          supportFragmentManager.fragmentFactory = ImageNavigatorFragment.createFactory(
                              publication = publication,
                              initialLocator = initialLocator,
                              listener = null,
                          )
                          val frag = supportFragmentManager.fragmentFactory
                              .instantiate(classLoader, ImageNavigatorFragment::class.java.name)
                              as ImageNavigatorFragment
                          supportFragmentManager.beginTransaction()
                              .replace(navContainer.id, frag, "image_nav")
                              .commitNowAllowingStateLoss()
                          navigator = frag
                          topBarTitle.text = title
                          // v28: ocultar botón de citas en lector Comic.
                          updateReaderControls()
                          // v30: polling permanente cada 800ms para configurar PhotoViews nuevos.
                          // El ViewPager de Readium crea los R2CbzPageFragment (con su PhotoView)
                          // bajo demanda al hacer swipe. Necesitamos configurarlos continuamente
                          // porque cualquier página nueva nace con los defaults de PhotoView (8x).
                          // configurePhotoViewLimits NO resetea el zoom del usuario; solo configura
                          // maxScale/medScale/minScale y scaleType si no están ya puestos.
                          val rootView = frag.view ?: navContainer
                          val handler = Handler(Looper.getMainLooper())
                          val pollRunnable = object : Runnable {
                              override fun run() {
                                  configurePhotoViewLimits(rootView)
                                  applyComicNavigatorStyle(rootView)
                                  // Polling permanente mientras el lector esté visible.
                                  if (readerRoot.visibility == View.VISIBLE) {
                                      handler.postDelayed(this, 800)
                                  }
                              }
                          }
                          handler.postDelayed(pollRunnable, 200)
                          // Aplicar brillo especifico de cómic si está activado.
                          applyActiveBrightness()
                          // v32: si venimos de "Todas las citas", navegar al locator pendiente.
                          pendingHighlightLocator?.let { loc ->
                              lifecycleScope.launch {
                                  delay(800)  // Esperar a que el navigator esté listo.
                                  (navigator as? org.readium.r2.navigator.Navigator)?.go(loc)
                                  pendingHighlightLocator = null
                              }
                          }
                          lifecycleScope.launch {
                              frag.currentLocator.collect { locator ->
                                  lastLocator = locator
                                  if (!navigatingToHighlight) {
                                      saveLocator(displayName, locator)
                                      sidecarJob?.cancel()
                                      sidecarJob = appScope.launch {
                                          delay(2000)
                                          saveSidecar(displayName, locator, currentHighlights.toList())
                                      }
                                  }
                                  updateProgress(locator)
                              }
                          }
                      } else {
                          // EPUB: EpubNavigatorFactory con preferencias y PaginationListener.
                          // v28: pasamos EpubNavigatorFragment.Configuration (no Factory.Configuration)
                          // con selectionActionModeCallback para añadir "Crear cita" al menú nativo.
                          val prefs = currentEpubPreferences()
                          val factory = EpubNavigatorFactory(publication = publication)
                          supportFragmentManager.fragmentFactory = factory.createFragmentFactory(
                              initialLocator = initialLocator,
                              initialPreferences = prefs,
                              paginationListener = object : EpubNavigatorFragment.PaginationListener {
                                  override fun onPageChanged(pageIndex: Int, totalPages: Int, locator: Locator) {
                                      lastPageIndex = pageIndex
                                      lastTotalPages = totalPages
                                  }
                              },
                              configuration = EpubNavigatorFragment.Configuration {
                                  selectionActionModeCallback = createSelectionActionModeCallback()
                              },
                          )
                          val frag = supportFragmentManager.fragmentFactory
                              .instantiate(classLoader, EpubNavigatorFragment::class.java.name)
                              as EpubNavigatorFragment
                          supportFragmentManager.beginTransaction()
                              .replace(navContainer.id, frag, "epub_nav")
                              .commitNowAllowingStateLoss()
                          navigator = frag
                          topBarTitle.text = title
                          // v28: el botón de citas solo es visible en EPUB.
                          updateReaderControls()
                          // v30: fallback para crear citas con pulsación larga en el contenido.
                          // Si el ActionMode nativo de selección no aparece (algunos WebView no lo
                          // activan por defecto), el usuario puede mantener pulsado para abrir
                          // un diálogo que crea la cita desde la selección actual.
                          frag.view?.setOnLongClickListener {
                              showCreateHighlightFallback()
                              true
                          }
                          // v28: aplicar decorations de highlights existentes con un pequeño
                          // retardo para que el navigator esté listo.
                          lifecycleScope.launch {
                              delay(300)
                              applyAllDecorations()
                              // v32: si venimos de "Todas las citas", navegar al locator pendiente.
                              // v47: el flag navigatingToHighlight ya se activó en
                              // openBookAndGoToHighlight ANTES de abrir el libro. No tocar aquí.
                          }
                          lifecycleScope.launch {
                              frag.currentLocator.collect { locator ->
                                  lastLocator = locator
                                  if (!navigatingToHighlight) {
                                      saveLocator(displayName, locator)
                                      sidecarJob?.cancel()
                                      sidecarJob = appScope.launch {
                                          delay(2000)
                                          saveSidecar(displayName, locator, currentHighlights.toList())
                                      }
                                  }
                                  updateProgress(locator)
                              }
                          }
                      }
                  } catch (e: Throwable) {
                      Toast.makeText(this, "Error: ${e.message}", Toast.LENGTH_LONG).show()
                      closeBook()
                  }
              }
          
              /**
               * Busca recursivamente cualquier PhotoView dentro de la vista del navigator
               * y configura los LIMITES de zoom (maximo, medio, minimo).
               * NO resetea el zoom actual del usuario — respeta el zoom que tenga activo.
               * Solo configura los limites si no estan ya configurados (para no interferir).
               * El scaleType se aplica aparte en applyPhotoViewScaleType().
               */
              private fun configurePhotoViewLimits(root: View) {
                  if (root is com.github.chrisbanes.photoview.PhotoView) {
                      runCatching {
                          if (root.maximumScale != 10f) {
                              root.maximumScale = 10f
                              root.mediumScale = 4f
                              root.minimumScale = 0.5f
                          }
                      }
                      return
                  }
                  if (root is ViewGroup) {
                      for (i in 0 until root.childCount) {
                          configurePhotoViewLimits(root.getChildAt(i))
                      }
                  }
              }
          
              /**
               * Aplica el scaleType segun el modo de visualizacion al pulsar el chip.
               * Esta funcion SI resetea el display matrix (es una accion explicita del usuario).
               */
              private fun applyPhotoViewScaleType(root: View) {
                  if (root is com.github.chrisbanes.photoview.PhotoView) {
                      runCatching {
                          val mode = loadComicViewMode()
                          root.scaleType = when (mode) {
                              "FULL" -> android.widget.ImageView.ScaleType.CENTER_CROP
                              "HEIGHT" -> android.widget.ImageView.ScaleType.CENTER_CROP
                              "WIDTH" -> android.widget.ImageView.ScaleType.FIT_CENTER
                              else -> android.widget.ImageView.ScaleType.FIT_CENTER
                          }
                          runCatching { root.setScale(root.minimumScale, false) }
                      }
                      return
                  }
                  if (root is ViewGroup) {
                      for (i in 0 until root.childCount) {
                          applyPhotoViewScaleType(root.getChildAt(i))
                      }
                  }
              }
          
              /** Alias para compatibilidad (applyComicViewMode lo usa). */
              private fun configurePhotoViewZoom(root: View) {
                  configurePhotoViewLimits(root)
                  applyPhotoViewScaleType(root)
              }
          
              private fun updateProgress(locator: Locator) {
                  val idx = chapters.indexOfFirst { it.url() == locator.href }
                  if (idx >= 0) chapterIndex = idx
          
                  val globalPct = locator.locations.totalProgression?.let { (it * 100).toInt() }
                      ?: run {
                          if (chapters.isEmpty()) 0
                          else {
                              val frac = if (lastTotalPages > 0)
                                  (lastPageIndex + 1).toDouble() / lastTotalPages else 0.5
                              (((chapterIndex.coerceAtLeast(0)) + frac) / chapters.size * 100).toInt()
                          }
                      }
          
                  progressBar.progress = (globalPct * 10).coerceIn(0, 1000)
                  progressText.text = "$globalPct% del libro"
                  // v43: guardar porcentaje para mostrar en la biblioteca.
                    currentBookName?.let { bn ->
                        prefs().edit().putInt("progress_$bn", globalPct).apply()
                    }
          
                  val chTitle = chapters.getOrNull(chapterIndex)?.title
                  chapterText.text = chTitle
                      ?: if (chapterIndex >= 0) "Capitulo ${chapterIndex + 1} de ${chapters.size}"
                      else ""
          
                  btnPrevChapter.isEnabled = chapterIndex > 0
                  btnNextChapter.isEnabled = chapterIndex < chapters.lastIndex
                  btnPrevChapter.alpha = if (btnPrevChapter.isEnabled) 1f else 0.35f
                  btnNextChapter.alpha = if (btnNextChapter.isEnabled) 1f else 0.35f
              }
          
              private fun goToChapter(delta: Int) {
                  val nav = navigator as? org.readium.r2.navigator.Navigator ?: return
                  if (chapters.isEmpty()) return
                  val cur = if (chapterIndex >= 0) chapterIndex else 0
                  val idx = (cur + delta).coerceIn(0, chapters.lastIndex)
                  if (idx == cur && chapterIndex >= 0) return
                  nav.go(chapters[idx])
                  chapterIndex = idx
                  // NOTA: NO se reaplica configurePhotoViewZoom al cambiar de pagina,
                  // porque interfiere con el zoom del usuario y/o resetea el PhotoView
                  // mientras el usuario interactua. Cada PhotoView nuevo nace con defaults
                  // de PhotoView (zoom maximo 8x, doble tap 3x) que son suficientes.
              }
          
              private fun flattenToc(
                  links: List<Link>,
                  level: Int = 0,
                  out: MutableList<Pair<Link, Int>> = mutableListOf(),
              ): MutableList<Pair<Link, Int>> {
                  for (l in links) {
                      val title = l.title ?: ""
                      val href = l.url().toString()
                      if (title.isNotBlank() || href.isNotBlank()) {
                          out.add(l to level)
                      }
                      if (l.children.isNotEmpty()) {
                          flattenToc(l.children, level + 1, out)
                      }
                  }
                  return out
              }
          
              private fun showChapterList() {
                  val nav = navigator as? org.readium.r2.navigator.Navigator ?: return
                  if (tableOfContents.isEmpty() && chapters.isEmpty()) {
                      Toast.makeText(this, "Sin indice de capitulos", Toast.LENGTH_SHORT).show()
                      return
                  }
                  val flat = flattenToc(if (tableOfContents.isNotEmpty()) tableOfContents else chapters)
                  if (flat.isEmpty()) {
                      Toast.makeText(this, "Sin indice de capitulos", Toast.LENGTH_SHORT).show()
                      return
                  }
                  val items = flat.mapIndexed { i, (link, level) ->
                      val indent = "  ".repeat(level)
                      (link.title ?: "Capitulo ${i + 1}").let { indent + it }
                  }.toTypedArray()
                  AlertDialog.Builder(this)
                      .setTitle("Capitulos")
                      .setItems(items) { _, which ->
                          val (link, _) = flat[which]
                          nav.go(link)
                          if (settingsVisible) toggleSettingsPanel()
                          topBar.visibility = View.GONE
                          bottomBar.visibility = View.GONE
                      }
                      .setNegativeButton("Cerrar", null)
                      .show()
              }
          
              fun toggleReaderOverlay() {
                  if (settingsVisible) {
                      toggleSettingsPanel()
                      return
                  }
                  val newVisibility = if (topBar.visibility == View.VISIBLE) View.GONE else View.VISIBLE
                  topBar.visibility = newVisibility
                  bottomBar.visibility = newVisibility
                  // v33: auto-ocultar tras 4 segundos si se están mostrando.
                  if (newVisibility == View.VISIBLE) {
                      scheduleOverlayHide()
                  } else {
                      overlayHideHandler.removeCallbacks(overlayHideRunnable)
                  }
              }
          
              private fun toggleSettingsPanel() {
                  settingsVisible = !settingsVisible
                  settingsPanel.visibility = if (settingsVisible) View.VISIBLE else View.GONE
                  if (settingsVisible) {
                      // Solo mostramos las bars del lector si el lector está activo.
                      if (readerRoot.visibility == View.VISIBLE) {
                          topBar.visibility = View.VISIBLE
                          bottomBar.visibility = View.VISIBLE
                      }
                      // Mostrar/ocultar secciones del panel segun el contexto
                      // (biblioteca: solo GENERAL; lector EPUB: GENERAL+EPUB; lector Comic: GENERAL+COMIC).
                      updateSettingsSections()
                      // v39: ocultar seekbar si Auto está activado.
                      val auto = prefs().getBoolean("pref_brightness_auto", true)
                      brightnessSeekBar.visibility = if (auto) View.GONE else View.VISIBLE
                      brightnessValue.visibility = if (auto) View.GONE else View.VISIBLE
                      if (!auto) {
                          brightnessSeekBar.progress = (loadActiveBrightness() * 100).toInt().coerceIn(0, 100)
                          brightnessValue.text = "${brightnessSeekBar.progress}%"
                      }
                      // Actualizar el valor mostrado del tamaño de fuente.
                      val fs = loadFontSize() ?: 1.0
                      fontSizeValue.text = "${(fs * 100).toInt()}%"
                      // Repintar chips para que el activo se resalte.
                      refreshChips()
                  } else {
                      if (readerRoot.visibility == View.VISIBLE) {
                          topBar.visibility = View.GONE
                          bottomBar.visibility = View.GONE
                      }
                  }
              }
          
              private fun closeBook() {
                  sidecarJob?.cancel()
                  val book = currentBookName
                  val loc = lastLocator
                  // Snapshot de highlights antes de limpiar para persistirlos.
                  val highlightsSnapshot = currentHighlights.toList()
                  // v45: si estamos en modo "vista de cita" (navigatingToHighlight),
                  // NO guardar el locator (que seria el de la cita). Solo guardar highlights
                  // usando el locator que ya tenia el sidecar (no sobrescribir).
                  if (book != null && loc != null) {
                      if (navigatingToHighlight) {
                          // Vista de cita: guardar highlights pero NO sobrescribir el locator del sidecar.
                          appScope.launch { saveHighlights(book, highlightsSnapshot) }
                      } else {
                          // Lectura normal: guardar locator + highlights.
                          appScope.launch { saveSidecar(book, loc, highlightsSnapshot) }
                      }
                  }
                  lastLocator = null
                  lastPageIndex = 0
                  lastTotalPages = 1
                  chapters = emptyList()
                  tableOfContents = emptyList()
                  chapterIndex = -1
                  currentHighlights.clear()
                  navigator?.let {
                      try {
                          (it as? android.app.Fragment)?.let { frag ->
                              fragmentManager.beginTransaction().remove(frag)
                                  .commitNowAllowingStateLoss()
                          }
                      } catch (_: Throwable) {}
                      try {
                          (it as? androidx.fragment.app.Fragment)?.let { frag ->
                              supportFragmentManager.beginTransaction().remove(frag)
                                  .commitNowAllowingStateLoss()
                          }
                      } catch (_: Throwable) {}
                  }
                  navigator = null
                  currentBookName = null
                  currentPublication = null
                  preHighlightLocator = null
                  preHighlightBookName = null
                  navigatingToHighlight = false
                  exitImmersive()
                  settingsPanel.visibility = View.GONE
                  settingsVisible = false
                  topBar.visibility = View.GONE
                  bottomBar.visibility = View.GONE
                  // v28: ocultar botón de citas al cerrar libro.
                  updateReaderControls()
                  readerRoot.visibility = View.GONE
                  libraryRoot.visibility = View.VISIBLE
                  // Restaurar brillo general y keep-screen al cerrar libro.
                  applyActiveBrightness()
                  applyKeepScreenToWindow()
                  // Al cerrar el libro volvemos a contexto biblioteca: el panel de
                  // ajustes volvera a mostrar solo GENERAL si se reabre.
                  updateSettingsSections()
                  lifecycleScope.launch { reloadLibrary() }
              }
          
              private fun enterImmersive() {
                  if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.R) {
                      window.setDecorFitsSystemWindows(false)
                      window.insetsController?.let {
                          it.systemBarsBehavior = WindowInsetsController.BEHAVIOR_SHOW_TRANSIENT_BARS_BY_SWIPE
                          it.hide(WindowInsets.Type.systemBars())
                      }
                  } else {
                      @Suppress("DEPRECATION")
                      window.decorView.systemUiVisibility = (
                          View.SYSTEM_UI_FLAG_IMMERSIVE_STICKY
                              or View.SYSTEM_UI_FLAG_FULLSCREEN
                              or View.SYSTEM_UI_FLAG_HIDE_NAVIGATION
                              or View.SYSTEM_UI_FLAG_LAYOUT_FULLSCREEN
                              or View.SYSTEM_UI_FLAG_LAYOUT_HIDE_NAVIGATION
                              or View.SYSTEM_UI_FLAG_LAYOUT_STABLE
                      )
                  }
              }
          
              private fun exitImmersive() {
                  if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.R) {
                      window.setDecorFitsSystemWindows(true)
                      window.insetsController?.show(WindowInsets.Type.systemBars())
                  } else {
                      @Suppress("DEPRECATION")
                      window.decorView.systemUiVisibility = View.SYSTEM_UI_FLAG_VISIBLE
                  }
              }
          
              @OptIn(ExperimentalReadiumApi::class)
              private fun currentEpubPreferences(): EpubPreferences {
                  // v26: el tema del contenido EPUB es independiente del tema de la app.
                  // publisherStyles=false FORZADO para que interlineado, justificación,
                  // espaciado párrafos, fuente y margen lateral tengan efecto.
                  // v37: scroll continuo (true) o paginado (false).
                  return EpubPreferences(
                      theme = loadEpubContentTheme(),
                      fontFamily = loadEpubFont()?.let { FontFamily(it) },
                      fontSize = loadFontSize(),
                      lineHeight = loadEpubLineHeight(),
                      pageMargins = loadEpubPageMargin(),
                      textAlign = loadEpubTextAlign(),
                      paragraphSpacing = loadEpubParaSpacing(),
                      publisherStyles = false,
                      scroll = loadEpubScroll(),
                  )
              }
          
              @OptIn(ExperimentalReadiumApi::class)
              private fun applyTheme(theme: Theme?) {
                  // Tema de la APP (UI). En v22 también afecta al contenido EPUB (no hay ajuste separado).
                  prefs().edit().putString("pref_theme", theme?.name ?: "AUTO").apply()
                  applyGlobalTheme()
                  // Si hay un EPUB abierto, re-aplicar preferencias para que el contenido cambie de tema.
                  (navigator as? EpubNavigatorFragment)?.submitPreferences(currentEpubPreferences())
              }
          
              @OptIn(ExperimentalReadiumApi::class)
              private fun applyEpubFont(family: String) {
                  prefs().edit().putString("pref_font_family", family).apply()
                  (navigator as? EpubNavigatorFragment)?.submitPreferences(currentEpubPreferences())
                  refreshChips()
              }
          
              @OptIn(ExperimentalReadiumApi::class)
              private fun applyEpubContentTheme(theme: String) {
                  prefs().edit().putString("pref_epub_content_theme", theme).apply()
                  (navigator as? EpubNavigatorFragment)?.submitPreferences(currentEpubPreferences())
                  refreshChips()
              }
          
              @OptIn(ExperimentalReadiumApi::class)
              private fun applyFontSizeDelta(delta: Double) {
                  val cur = loadFontSize() ?: 1.0
                  val new = (cur + delta).coerceIn(0.5, 3.0)
                  prefs().edit().putFloat("pref_font_size", new.toFloat()).apply()
                  fontSizeValue.text = "${(new * 100).toInt()}%"
                  (navigator as? EpubNavigatorFragment)?.submitPreferences(currentEpubPreferences())
              }
          
              @OptIn(ExperimentalReadiumApi::class)
              private fun applyEpubLineHeight(v: Double) {
                  prefs().edit().putFloat("pref_epub_line_height", v.toFloat()).apply()
                  (navigator as? EpubNavigatorFragment)?.submitPreferences(currentEpubPreferences())
                  refreshChips()
              }
          
              @OptIn(ExperimentalReadiumApi::class)
              private fun applyEpubMargin(v: Double) {
                  prefs().edit().putFloat("pref_epub_margin", v.toFloat()).apply()
                  (navigator as? EpubNavigatorFragment)?.submitPreferences(currentEpubPreferences())
                  refreshChips()
              }
          
              @OptIn(ExperimentalReadiumApi::class)
              private fun applyEpubJustify(align: String) {
                  prefs().edit().putString("pref_epub_align", align).apply()
                  (navigator as? EpubNavigatorFragment)?.submitPreferences(currentEpubPreferences())
                  refreshChips()
              }
          
              @OptIn(ExperimentalReadiumApi::class)
              private fun applyEpubParaSpacing(v: Double) {
                  prefs().edit().putFloat("pref_epub_para_spacing", v.toFloat()).apply()
                  (navigator as? EpubNavigatorFragment)?.submitPreferences(currentEpubPreferences())
                  refreshChips()
              }
          
              // v37: Scroll continuo
              @OptIn(ExperimentalReadiumApi::class)
              private fun applyEpubScroll(enabled: Boolean) {
                  prefs().edit().putBoolean("pref_epub_scroll", enabled).apply()
                  (navigator as? EpubNavigatorFragment)?.submitPreferences(currentEpubPreferences())
                  refreshChips()
              }
          
              // v37: Búsqueda de texto en el EPUB
              @OptIn(ExperimentalReadiumApi::class)
              private fun showSearchDialog() {
                  val nav = navigator as? EpubNavigatorFragment
                  if (nav == null) {
                      Toast.makeText(this, "Solo disponible en EPUB", Toast.LENGTH_SHORT).show()
                      return
                  }
                  val edit = android.widget.EditText(this).apply {
                      hint = "Texto a buscar"
                      setPadding(dp(16), dp(12), dp(16), dp(12))
                  }
                  AlertDialog.Builder(this)
                      .setTitle("Buscar")
                      .setView(edit)
                      .setPositiveButton("Buscar") { _, _ ->
                          val query = edit.text.toString().trim()
                          if (query.isBlank()) return@setPositiveButton
                          lifecycleScope.launch {
                              performSearch(nav, query)
                          }
                      }
                      .setNegativeButton("Cancelar", null)
                      .show()
              }
          
              @OptIn(ExperimentalReadiumApi::class)
              private suspend fun performSearch(nav: EpubNavigatorFragment, query: String) {
                  val pub = currentPublication ?: run {
                      Toast.makeText(this, "No hay libro abierto", Toast.LENGTH_SHORT).show()
                      return
                  }
                  val iterator = pub.search(query) ?: run {
                      Toast.makeText(this, "Este libro no soporta búsqueda", Toast.LENGTH_SHORT).show()
                      return
                  }
                  val results = mutableListOf<Locator>()
                  try {
                      while (true) {
                          val res = iterator.next()
                          val locs = res.getOrNull()
                          if (locs == null) break
                          results.addAll(locs.locators)
                          if (results.size >= 100) break  // límite de seguridad
                      }
                  } finally {
                      iterator.close()
                  }
                  if (results.isEmpty()) {
                      Toast.makeText(this, "Sin resultados para '$query'", Toast.LENGTH_SHORT).show()
                      return
                  }
                  showSearchResults(results, query)
              }
          
              private fun showSearchResults(results: List<Locator>, query: String) {
                  val ctx = this
                  val dp = { v: Int -> (v * resources.displayMetrics.density).toInt() }
                  val items = results.mapIndexed { i, loc ->
                      val preview = loc.text?.before?.take(60) ?: loc.text?.highlight?.take(60) ?: "Resultado ${i+1}"
                      "${i+1}. ${preview}..."
                  }.toTypedArray()
                  AlertDialog.Builder(ctx)
                      .setTitle("Resultados (${results.size})")
                      .setItems(items) { _, which ->
                          val loc = results[which]
                          val nav = navigator as? EpubNavigatorFragment ?: return@setItems
                          // v39: guardar posicion actual antes de saltar al resultado.
                          preHighlightLocator = lastLocator
                          // v47: activar flag antes de saltar para no guardar.
                          navigatingToHighlight = true
                          lifecycleScope.launch { nav.go(loc) }
                      }
                      .setNegativeButton("Cerrar", null)
                      .show()
              }
          
