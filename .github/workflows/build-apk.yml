              @Suppress("DEPRECATION")
              override fun onBackPressed() {
                  if (settingsVisible) {
                      toggleSettingsPanel()
                      return
                  }
                  if (quotesRoot.visibility == View.VISIBLE) {
                      closeQuotesScreen()
                      return
                  }
                  if (readerRoot.visibility == View.VISIBLE) {
                      // v39: si saltamos a una cita, Atras vuelve a la posicion anterior.
                      val pre = preHighlightLocator
                      val preBook = preHighlightBookName
                      if (pre != null) {
                          preHighlightLocator = null
                          preHighlightBookName = null
                          if (preBook != null && preBook != currentBookName) {
                              // Estabamos en OTRO libro: hay que reabrirlo en la posicion guardada.
                              pendingHighlightLocator = pre
                              val entry = kotlinx.coroutines.runBlocking { findLibraryEntryByName(preBook) }
                              if (entry != null) {
                                  lifecycleScope.launch { openFromLibrary(entry) }
                              } else {
                                  // No se encontro el libro: navegar en el actual como fallback.
                                  lifecycleScope.launch {
                                      (navigator as? org.readium.r2.navigator.Navigator)?.go(pre)
                                  }
                              }
                          } else {
                              // Mismo libro: solo navegar a la posicion guardada.
                              navigatingToHighlight = false
                              lifecycleScope.launch {
                                  (navigator as? org.readium.r2.navigator.Navigator)?.go(pre)
                              }
                          }
                      } else {
                          closeBook()
                      }
                  } else if (currentFolderUri != null) {
                      goUpFolder()
                  } else {
                      super.onBackPressed()
                  }
              }
          
              // v31: en vez de tap centro (que interfiere con zoom y selección de texto),
              // el toggle de overlays se hace con SWIPE DOWN desde el borde superior.
              // El usuario desliza el dedo de arriba hacia abajo para mostrar/ocultar menús.
              // v33: además, un tap simple en el contenido oculta los overlays si están visibles.
              private var swipeStartY = -1f
              private var swipeStartX = -1f
              private var tapDownX = -1f
              private var tapDownY = -1f
              private var tapDownTime = 0L
          
              override fun dispatchTouchEvent(ev: MotionEvent): Boolean {
                  when (ev.actionMasked) {
                      MotionEvent.ACTION_DOWN -> {
                          tapDownX = ev.x
                          tapDownY = ev.y
                          tapDownTime = System.currentTimeMillis()
                          // Cerrar panel de ajustes al tocar fuera (funciona en library y reader).
                          if (settingsVisible) {
                              val panelLoc = IntArray(2)
                              settingsContent.getLocationOnScreen(panelLoc)
                              val inPanel = ev.x >= panelLoc[0] && ev.x <= panelLoc[0] + settingsContent.width &&
                                  ev.y >= panelLoc[1] && ev.y <= panelLoc[1] + settingsContent.height
                              if (!inPanel) {
                                  toggleSettingsPanel()
                                  return true
                              }
                          }
                          // Registrar el inicio del swipe si está en el borde superior.
                          if (readerRoot.visibility == View.VISIBLE && !settingsVisible) {
                              val h = resources.displayMetrics.heightPixels
                              // Solo iniciar swipe si empieza en el 8% superior de la pantalla.
                              if (ev.y < h * 0.08f) {
                                  swipeStartY = ev.y
                                  swipeStartX = ev.x
                              } else {
                                  swipeStartY = -1f
                              }
                          }
                      }
                      MotionEvent.ACTION_MOVE -> {
                          // Si hay un swipe en curso desde el borde superior y baja >100dp,
                          // toggle overlays y cancelar swipe.
                          if (swipeStartY >= 0 && readerRoot.visibility == View.VISIBLE && !settingsVisible) {
                              val deltaY = ev.y - swipeStartY
                              val threshold = 100 * density
                              if (deltaY > threshold) {
                                  toggleReaderOverlay()
                                  swipeStartY = -1f
                                  return true
                              }
                          }
                      }
                      MotionEvent.ACTION_UP -> {
                          // v33: si fue un tap simple (no swipe desde arriba) y los overlays
                          // están visibles, y el toque no fue dentro de topBar/bottomBar,
                          // ocultar los overlays.
                          val wasSwipeFromTop = swipeStartY >= 0
                          swipeStartY = -1f
                          if (readerRoot.visibility == View.VISIBLE && !settingsVisible && !wasSwipeFromTop) {
                              val elapsed = System.currentTimeMillis() - tapDownTime
                              val moved = kotlin.math.abs(ev.x - tapDownX) > 20 * density ||
                                  kotlin.math.abs(ev.y - tapDownY) > 20 * density
                              if (elapsed < 300 && !moved) {
                                  // Fue un tap simple. ¿Está dentro de topBar o bottomBar?
                                  val topLoc = IntArray(2)
                                  topBar.getLocationOnScreen(topLoc)
                                  val inTopBar = ev.x >= topLoc[0] && ev.x <= topLoc[0] + topBar.width &&
                                      ev.y >= topLoc[1] && ev.y <= topLoc[1] + topBar.height
                                  val botLoc = IntArray(2)
                                  bottomBar.getLocationOnScreen(botLoc)
                                  val inBottomBar = ev.x >= botLoc[0] && ev.x <= botLoc[0] + bottomBar.width &&
                                      ev.y >= botLoc[1] && ev.y <= botLoc[1] + bottomBar.height
                                  if (!inTopBar && !inBottomBar && topBar.visibility == View.VISIBLE) {
                                      topBar.visibility = View.GONE
                                      bottomBar.visibility = View.GONE
                                      overlayHideHandler.removeCallbacks(overlayHideRunnable)
                                      return true
                                  }
                              }
                          }
                      }
                      MotionEvent.ACTION_CANCEL -> {
                          swipeStartY = -1f
                      }
                  }
                  return super.dispatchTouchEvent(ev)
              }
          
              private fun prefs() = getSharedPreferences("lector_positions", MODE_PRIVATE)
          
              private fun loadLocator(bookName: String): Locator? {
                  // v45: leer de clave separada "readingpos_" que no se afecta por citas.
                  val json = prefs().getString("readingpos_$bookName", null) ?: return null
                  return runCatching { Locator.fromJSON(JSONObject(json)) }.getOrNull()
              }
          
              private fun saveLocator(bookName: String, locator: Locator) {
                  // v45: guardar en clave separada "readingpos_" para independizar de citas.
                  prefs().edit().putString("readingpos_$bookName", locator.toJSON().toString()).apply()
              }
          
              /**
               * Tree URI de la biblioteca donde esta el libro actualmente abierto.
               * Se deriva de currentBookFolderUri (que apunta a la carpeta donde se abrio)
               * o se hace fallback a la biblioteca activa.
               */
              private fun bookTreeUri(): Uri? {
                  val folder = currentBookFolderUri ?: return activeTreeUri()
                  // Si currentBookFolderUri es la raiz (tree) de alguna biblioteca, devolverla.
                  if (folder == libraryTreeUri) return libraryTreeUri
                  if (folder == comicsTreeUri) return comicsTreeUri
                  // Si es una subcarpeta, el tree es el de la biblioteca activa.
                  return activeTreeUri()
              }
          
              private suspend fun findSidecarUri(bookName: String): Uri? {
                  val tree = bookTreeUri() ?: return null
                  val folderUri = currentBookFolderUri ?: tree
                  val sidecarName = bookName.substringBeforeLast('.') + ".json"
                  return withContext(Dispatchers.IO) {
                      val folderDocId = if (folderUri == tree)
                          DocumentsContract.getTreeDocumentId(tree)
                      else
                          runCatching { DocumentsContract.getDocumentId(folderUri) }.getOrNull()
                              ?: DocumentsContract.getTreeDocumentId(tree)
                      var found: Uri? = null
                      contentResolver.query(
                          DocumentsContract.buildChildDocumentsUriUsingTree(tree, folderDocId),
                          arrayOf(Document.COLUMN_DOCUMENT_ID, Document.COLUMN_DISPLAY_NAME),
                          null, null, null
                      )?.use { c ->
                          val idIdx = c.getColumnIndexOrThrow(Document.COLUMN_DOCUMENT_ID)
                          val nameIdx = c.getColumnIndexOrThrow(Document.COLUMN_DISPLAY_NAME)
                          while (c.moveToNext()) {
                              if (c.getString(nameIdx) == sidecarName) {
                                  found = DocumentsContract.buildDocumentUriUsingTree(
                                      tree, c.getString(idIdx)
                                  )
                                  break
                              }
                          }
                      }
                      found
                  }
              }
          
              private suspend fun loadSidecar(bookName: String): Pair<Locator?, List<Highlight>>? {
                  val uri = findSidecarUri(bookName) ?: return null
                  return withContext(Dispatchers.IO) {
                      val text = contentResolver.openInputStream(uri)?.use {
                          it.readBytes().toString(Charsets.UTF_8)
                      } ?: return@withContext null
                      try {
                          val json = JSONObject(text)
                          val locator = runCatching {
                              json.optJSONObject("locator")?.let { Locator.fromJSON(it) }
                          }.getOrNull()
                          // v2: array `highlights`. JSONs viejos (v1) no tienen el campo → array vacío.
                          val highlights = mutableListOf<Highlight>()
                          val arr = json.optJSONArray("highlights")
                          if (arr != null) {
                              for (i in 0 until arr.length()) {
                                  val hj = arr.optJSONObject(i) ?: continue
                                  jsonToHighlight(hj)?.let { highlights.add(it) }
                              }
                          }
                          locator to highlights.toList()
                      } catch (_: Throwable) {
                          null
                      }
                  }
              }
          
              /** Convierte un JSONObject (de un elemento del array `highlights`) a Highlight. */
              private fun jsonToHighlight(json: JSONObject): Highlight? = try {
                  Highlight(
                      id = json.getString("id"),
                      text = json.getString("text"),
                      locator = json.optJSONObject("locator")?.let {
                          runCatching { Locator.fromJSON(it) }.getOrNull()
                      },
                      color = json.optString("color", "yellow"),
                      note = json.optString("note", ""),
                      createdAt = json.optString("createdAt", ""),
                  )
              } catch (_: Throwable) { null }
          
              /** Convierte un Highlight a JSONObject (para añadirlo al array `highlights`). */
              private fun highlightToJson(h: Highlight): JSONObject = JSONObject().apply {
                  put("id", h.id)
                  put("text", h.text)
                  h.locator?.let { put("locator", it.toJSON()) }
                  put("color", h.color)
                  put("note", h.note)
                  put("createdAt", h.createdAt)
              }
          
              private suspend fun saveSidecar(bookName: String, locator: Locator, highlights: List<Highlight> = emptyList()) {
                  val tree = bookTreeUri() ?: return
                  val folderUri = currentBookFolderUri ?: tree
                  val sidecarName = bookName.substringBeforeLast('.') + ".json"
                  val arr = JSONArray()
                  for (h in highlights) {
                      arr.put(highlightToJson(h))
                  }
                  val json = JSONObject().apply {
                      put("version", 2)
                      put("bookName", bookName)
                      put("locator", locator.toJSON())
                      put("updatedAt",
                          SimpleDateFormat("yyyy-MM-dd HH:mm:ss", Locale.US).format(Date()))
                      put("highlights", arr)
                  }.toString(2)
                  withContext(Dispatchers.IO) {
                      val folderDocId = if (folderUri == tree)
                          DocumentsContract.getTreeDocumentId(tree)
                      else
                          runCatching { DocumentsContract.getDocumentId(folderUri) }.getOrNull()
                              ?: DocumentsContract.getTreeDocumentId(tree)
                      val folderDocUri = DocumentsContract.buildDocumentUriUsingTree(tree, folderDocId)
                      var target = findSidecarUri(bookName)
                      if (target == null) {
                          target = DocumentsContract.createDocument(
                              contentResolver, folderDocUri,
                              "application/json", sidecarName
                          ) ?: return@withContext
                      }
                      contentResolver.openOutputStream(target, "wt")?.use { os ->
                          os.write(json.toByteArray(Charsets.UTF_8))
                          os.flush()
                      }
                  }
              }
          
              private fun queryDisplayName(uri: Uri): String? {
                  contentResolver.query(uri, null, null, null, null)?.use { c ->
                      val idx = c.getColumnIndex(OpenableColumns.DISPLAY_NAME)
                      if (idx >= 0 && c.moveToFirst()) return c.getString(idx)
                  }
                  return uri.lastPathSegment
              }
          
              // ===== HIGHLIGHTS (citas) =====
          
              /** Carga los highlights de un sidecar JSON (vacío si no existe o es v1). */
              private suspend fun loadHighlights(bookName: String): List<Highlight> {
                  return loadSidecar(bookName)?.second ?: emptyList()
              }
          
              /**
               * Persiste la lista de highlights en el sidecar JSON del libro.
               * Reusa el último locator conocido para no perder la posición al
               * añadir / eliminar una cita sin moverse en el libro.
               */
              private suspend fun saveHighlights(bookName: String, highlights: List<Highlight>) {
                  val loc = lastLocator ?: return
                  currentHighlights.clear()
                  currentHighlights.addAll(highlights)
                  saveSidecar(bookName, loc, currentHighlights.toList())
              }
          
              /** Añade un highlight al libro actual y lo persiste. */
              private suspend fun addHighlight(bookName: String, text: String, locator: Locator?, note: String = "") {
                  val h = Highlight(
                      id = "hl_${System.currentTimeMillis()}",
                      text = text,
                      locator = locator,
                      color = "yellow",
                      note = note,
                      createdAt = SimpleDateFormat("yyyy-MM-dd HH:mm:ss", Locale.US).format(Date())
                  )
                  currentHighlights.add(h)
                  val loc = locator ?: lastLocator
                  if (loc != null) {
                      saveSidecar(bookName, loc, currentHighlights.toList())
                  }
              }
          
              /** Elimina un highlight por id y persiste el sidecar actualizado. */
              private suspend fun removeHighlight(bookName: String, highlightId: String) {
                  currentHighlights.removeAll { it.id == highlightId }
                  val loc = lastLocator
                  if (loc != null) {
                      saveSidecar(bookName, loc, currentHighlights.toList())
                  }
              }
          
              /**
               * Carga los highlights de TODOS los libros de la carpeta activa.
               * Devuelve pares (bookName, highlight) para agrupar / mostrar.
               * Solo se consideran archivos .json (sidecars) de la carpeta actual.
               */
              private suspend fun loadAllHighlights(): List<Pair<String, Highlight>> = withContext(Dispatchers.IO) {
                  val result = mutableListOf<Pair<String, Highlight>>()
                  val tree = activeTreeUri() ?: return@withContext emptyList()
                  val folderUri = currentFolderUri ?: tree
                  try {
                      val folderDocId = if (folderUri == tree)
                          DocumentsContract.getTreeDocumentId(tree)
                      else
                          runCatching { DocumentsContract.getDocumentId(folderUri) }.getOrNull()
                            ?: DocumentsContract.getTreeDocumentId(tree)
                      val children = DocumentsContract.buildChildDocumentsUriUsingTree(tree, folderDocId)
                      contentResolver.query(children, arrayOf(
                          Document.COLUMN_DOCUMENT_ID,
                          Document.COLUMN_DISPLAY_NAME,
                          Document.COLUMN_MIME_TYPE
                      ), null, null, null)?.use { c ->
                          val idIdx = c.getColumnIndexOrThrow(Document.COLUMN_DOCUMENT_ID)
                          val nameIdx = c.getColumnIndexOrThrow(Document.COLUMN_DISPLAY_NAME)
                          while (c.moveToNext()) {
                              val name = c.getString(nameIdx) ?: continue
                              // Solo sidecars .json generados por la app.
                              if (!name.endsWith(".json")) continue
                              val docId = c.getString(idIdx)
                              val docUri = DocumentsContract.buildDocumentUriUsingTree(tree, docId)
                              val text = runCatching {
                                  contentResolver.openInputStream(docUri)?.use {
                                      it.readBytes().toString(Charsets.UTF_8)
                                  }
                              }.getOrNull() ?: continue
                              try {
                                  val json = JSONObject(text)
                                  val arr = json.optJSONArray("highlights") ?: continue
                                  // v35: usar el campo "bookName" del JSON (nombre del archivo del libro,
                                  // ej: "libro.epub") en vez del nombre del archivo JSON.
                                  // Esto coincide con lo que busca findLibraryEntryByName.
                                  val bookName = json.optString("bookName", name.substringBeforeLast('.'))
                                  for (i in 0 until arr.length()) {
                                      val hj = arr.optJSONObject(i) ?: continue
                                      jsonToHighlight(hj)?.let { result.add(bookName to it) }
                                  }
                              } catch (_: Throwable) { /* sidecar corrupto, ignorar */ }
                          }
                      }
                  } catch (_: Throwable) { /* sin permisos / carpeta inaccesible */ }
                  result
              }
          
              // ===== UI: DIÁLOGOS DE CITAS =====
          
              /**
               * Diálogo con la lista de citas del libro actual.
               * Cada cita muestra: texto (máx 2 líneas), nota si existe, fecha.
               * Pulsar una cita navega al punto del libro donde está.
               * Botón "Eliminar" en cada cita para borrarla.
               *
               * v28: la captura de citas se hace ahora desde el menú contextual nativo
               * de Android al seleccionar texto en el EPUB (createHighlightFromSelection).
               * Se ha eliminado el botón "+" que abría el diálogo manual de pegado.
               */
              private fun showBookHighlights() {
                  val book = currentBookName ?: return
                  val ctx = this
                  val highlights = currentHighlights.toList()
                  val dp = { v: Int -> (v * resources.displayMetrics.density).toInt() }
                  // `var` para permitir que los lambdas internos hagan dismiss antes de crear el dialog.
                  var dialog: AlertDialog? = null
          
                  val container = LinearLayout(ctx).apply {
                      orientation = LinearLayout.VERTICAL
                      setPadding(dp(16), dp(8), dp(16), dp(8))
                  }
                  // v28: eliminado el botón "+" de añadir cita manual; las citas se
                  // crean ahora desde el menú contextual de selección nativa.
          
                  if (highlights.isEmpty()) {
                      val tv = TextView(ctx).apply {
                          text = "No hay citas todavía. Selecciona texto en el libro para crear una."
                          textSize = 13f
                          setPadding(dp(8), dp(12), dp(8), dp(12))
                          setTextColor(if (isDark) 0xFFEDEDED.toInt() else 0xFF1A1A1A.toInt())
                      }
                      container.addView(tv)
                  } else {
                      for (h in highlights) {
                          val row = LinearLayout(ctx).apply {
                              orientation = LinearLayout.VERTICAL
                              setPadding(dp(12), dp(10), dp(12), dp(10))
                              background = GradientDrawable().apply {
                                  cornerRadius = 12 * density
                                  setColor(if (isDark) 0xFF2A2A2A.toInt() else 0xFFEEEEEE.toInt())
                              }
                              val lp = LinearLayout.LayoutParams(
                                  LinearLayout.LayoutParams.MATCH_PARENT,
                                  LinearLayout.LayoutParams.WRAP_CONTENT
                              ).apply { bottomMargin = dp(8) }
                              layoutParams = lp
                              // v28: pulsar la cita navega al punto del libro.
                              setOnClickListener {
                                  val nav = navigator as? EpubNavigatorFragment
                                  if (nav == null) {
                                      Toast.makeText(ctx, "Abre el libro primero para ir a la cita", Toast.LENGTH_SHORT).show()
                                      return@setOnClickListener
                                  }
                                  val loc = h.locator
                                  if (loc == null) {
                                      Toast.makeText(ctx, "Cita sin posición válida", Toast.LENGTH_SHORT).show()
                                      return@setOnClickListener
                                  }
                                  // v47: activar flag antes de saltar para no guardar.
                                  navigatingToHighlight = true
                                  dialog?.dismiss()
                                  lifecycleScope.launch { nav.go(loc) }
                              }
                          }
                          val textTv = TextView(ctx).apply {
                              text = "\"${h.text}\""
                              maxLines = 2
                              ellipsize = android.text.TextUtils.TruncateAt.END
                              textSize = 13f
                              setTypeface(Typeface.create(Typeface.DEFAULT, Typeface.BOLD))
                              setTextColor(if (isDark) 0xFFEDEDED.toInt() else 0xFF1A1A1A.toInt())
                          }
                          row.addView(textTv)
                          if (h.note.isNotEmpty()) {
                              val noteTv = TextView(ctx).apply {
                                  text = "Nota: ${h.note}"
                                  textSize = 11f
                                  maxLines = 2
                                  ellipsize = android.text.TextUtils.TruncateAt.END
                                  setTextColor(if (isDark) 0xFFB0B0B0.toInt() else 0xFF666666.toInt())
                                  setPadding(0, dp(4), 0, 0)
                              }
                              row.addView(noteTv)
                          }
                          val dateTv = TextView(ctx).apply {
                              text = h.createdAt
                              textSize = 10f
                              setTextColor(0xFF888888.toInt())
                              setPadding(0, dp(4), 0, dp(6))
                          }
                          row.addView(dateTv)
                          val deleteBtn = Button(ctx).apply {
                              text = "Eliminar"
                              setAllCaps(false)
                              setTypeface(Typeface.create(Typeface.DEFAULT, Typeface.BOLD))
                              textSize = 11f
                              setOnClickListener {
                                  lifecycleScope.launch {
                                      removeHighlight(book, h.id)
                                      // v28: refrescar decorations visuales tras eliminar.
                                      applyAllDecorations()
                                      Toast.makeText(ctx, "Cita eliminada", Toast.LENGTH_SHORT).show()
                                      dialog?.dismiss()
                                      showBookHighlights()
                                  }
                              }
                          }
                          row.addView(deleteBtn)
                          container.addView(row)
                      }
                  }
          
                  val scrollView = ScrollView(ctx).apply { addView(container) }
                  dialog = AlertDialog.Builder(ctx)
                      .setTitle("Citas: ${book.substringBeforeLast('.')}")
                      .setView(scrollView)
                      .setNegativeButton("Cerrar", null)
                      .create()
                  dialog?.show()
              }
          
              /**
               * Diálogo con TODAS las citas de todos los libros de la carpeta actual,
               * agrupadas por libro. Cada item muestra: texto, nota (si existe), fecha.
               * v28: pulsar una cita navega a ella si el libro correspondiente está abierto.
               */
              /**
               * v35: Pantalla completa de citas (no diálogo).
               * Muestra TODAS las citas de la biblioteca, agrupadas por libro.
               * Al pulsar una cita, abre el libro y navega a ella.
               */
              private suspend fun showAllHighlights() {
                  val ctx = this@MainActivity
                  val dp = { v: Int -> (v * resources.displayMetrics.density).toInt() }
                  val all = loadAllHighlights()
                  // Limpiar contenedor
                  quotesContainer.removeAllViews()
                  // Fondo según tema
                  quotesRoot.setBackgroundColor(if (isDark) 0xFF121212.toInt() else 0xFFFAFAFA.toInt())
                  if (all.isEmpty()) {
                      val tv = TextView(ctx).apply {
                          text = "No hay citas en la biblioteca."
                          textSize = 14f
                          setPadding(dp(16), dp(24), dp(16), dp(24))
                          setTextColor(if (isDark) 0xFFEDEDED.toInt() else 0xFF1A1A1A.toInt())
                          gravity = Gravity.CENTER
                      }
                      quotesContainer.addView(tv)
                  } else {
                      val grouped = all.groupBy { it.first }
                      for ((book, items) in grouped) {
                          val headerTv = TextView(ctx).apply {
                              text = "📖 ${book.substringBeforeLast('.')}"
                              textSize = 13f
                              setTypeface(Typeface.create(Typeface.DEFAULT, Typeface.BOLD))
                              setTextColor(ACCENT)
                              setPadding(dp(8), dp(14), dp(8), dp(4))
                          }
                          quotesContainer.addView(headerTv)
                          for ((_, h) in items) {
                              val row = LinearLayout(ctx).apply {
                                  orientation = LinearLayout.VERTICAL
                                  setPadding(dp(14), dp(12), dp(14), dp(12))
                                  background = GradientDrawable().apply {
                                      cornerRadius = 12 * density
                                      setColor(if (isDark) 0xFF2A2A2A.toInt() else 0xFFEEEEEE.toInt())
                                  }
                                  val lp = LinearLayout.LayoutParams(
                                      LinearLayout.LayoutParams.MATCH_PARENT,
                                      LinearLayout.LayoutParams.WRAP_CONTENT
                                  ).apply { bottomMargin = dp(8) }
                                  layoutParams = lp
                                  // v35: pulsar la cita ABRE el libro y navega.
                                  setOnClickListener {
                                      closeQuotesScreen()
                                      lifecycleScope.launch {
                                          openBookAndGoToHighlight(book, h)
                                      }
                                  }
                              }
                              val textTv = TextView(ctx).apply {
                                  text = "\"${h.text}\""
                                  textSize = 14f
                                  setTextColor(if (isDark) 0xFFEDEDED.toInt() else 0xFF1A1A1A.toInt())
                              }
                              row.addView(textTv)
                              if (h.note.isNotEmpty()) {
                                  val noteTv = TextView(ctx).apply {
                                      text = "Nota: ${h.note}"
                                      textSize = 12f
                                      setTextColor(if (isDark) 0xFFB0B0B0.toInt() else 0xFF666666.toInt())
                                      setPadding(0, dp(6), 0, 0)
                                  }
                                  row.addView(noteTv)
                              }
                              val dateTv = TextView(ctx).apply {
                                  text = h.createdAt
                                  textSize = 10f
                                  setTextColor(0xFF888888.toInt())
                                  setPadding(0, dp(6), 0, 0)
                              }
                              row.addView(dateTv)
                              quotesContainer.addView(row)
                          }
                      }
                  }
                  // Mostrar pantalla de citas sobre la biblioteca.
                  libraryRoot.visibility = View.GONE
                  readerRoot.visibility = View.GONE
                  quotesRoot.visibility = View.VISIBLE
              }
          
              /** Cierra la pantalla de citas y vuelve a la biblioteca. */
              private fun closeQuotesScreen() {
                  quotesRoot.visibility = View.GONE
                  libraryRoot.visibility = View.VISIBLE
              }
          
              /**
               * v32: Abre un libro desde la biblioteca (buscándolo por nombre) y, una vez
               * cargado, navega al locator del highlight indicado.
               */
              private suspend fun openBookAndGoToHighlight(bookName: String, h: Highlight) {
                  // v39: si hay un libro abierto, guardar su posicion para poder volver.
                  if (readerRoot.visibility == View.VISIBLE && lastLocator != null) {
                      preHighlightLocator = lastLocator
                      preHighlightBookName = currentBookName
                  }
                  // Buscar el libro en la biblioteca activa (carpeta actual incluida).
                  val entry = findLibraryEntryByName(bookName)
                  if (entry == null) {
                      Toast.makeText(this, "No se encontró '$bookName' en la biblioteca", Toast.LENGTH_SHORT).show()
                      return
                  }
                  // Guardar el locator pendiente para navegar tras abrir.
                  pendingHighlightLocator = h.locator
                  // v47: activar el flag ANTES de abrir, para que el primer
                  // currentLocator.collect ya lo respete y no guarde la cita como posicion.
                  navigatingToHighlight = true
                  // Abrir el libro (sincrono: espera a que el navigator esté listo).
                  openFromLibrary(entry)
              }
          
              /** Locator pendiente de aplicar tras abrir un libro desde "Todas las citas". */
              private var pendingHighlightLocator: Locator? = null
              /** Flag: cuando es true, el currentLocator.collect NO guarda la posicion
               *  (estamos navegando a una cita, no queremos sobrescribir la posicion de lectura). */
              private var navigatingToHighlight: Boolean = false
              /** Posicion de lectura anterior al salto a una cita (para volver con Atras). */
              private var preHighlightLocator: Locator? = null
              /** Nombre del libro donde estabamos leyendo antes del salto a cita. */
              private var preHighlightBookName: String? = null
          
              /**
               * Busca una entrada en las bibliotecas por nombre de archivo.
               * v35: busca en AMBAS bibliotecas (libros y comics) por si la cita es de
               * un libro pero la biblioteca activa es comics o viceversa.
               */
              private suspend fun findLibraryEntryByName(bookName: String): LibraryEntry? {
                  // Buscar en cada biblioteca disponible.
                  for (tree in listOfNotNull(libraryTreeUri, comicsTreeUri)) {
                      val found = scanForFile(tree, bookName)
                      if (found != null) return found
                      val recursive = scanForFileRecursive(tree, bookName, maxDepth = 3)
                      if (recursive != null) return recursive
                  }
                  return null
              }
          
              private suspend fun scanForFile(tree: Uri, bookName: String): LibraryEntry? = withContext(Dispatchers.IO) {
                  try {
                      val treeDocId = DocumentsContract.getTreeDocumentId(tree)
                      val children = DocumentsContract.buildChildDocumentsUriUsingTree(tree, treeDocId)
                      var result: LibraryEntry? = null
                      contentResolver.query(children, arrayOf(
                          Document.COLUMN_DOCUMENT_ID,
                          Document.COLUMN_DISPLAY_NAME,
                          Document.COLUMN_MIME_TYPE
                      ), null, null, null)?.use { c ->
                          val idIdx = c.getColumnIndexOrThrow(Document.COLUMN_DOCUMENT_ID)
                          val nameIdx = c.getColumnIndexOrThrow(Document.COLUMN_DISPLAY_NAME)
                          val mimeIdx = c.getColumnIndexOrThrow(Document.COLUMN_MIME_TYPE)
                          while (c.moveToNext()) {
                              val name = c.getString(nameIdx) ?: continue
                              if (name == bookName) {
                                  val docId = c.getString(idIdx)
                                  val docUri = DocumentsContract.buildDocumentUriUsingTree(tree, docId)
                                  val ext = name.substringAfterLast('.', "").lowercase()
                                  result = LibraryEntry(
                                      fileName = name,
                                      title = name.substringBeforeLast('.'),
                                      cover = null,
                                      documentUri = docUri,
                                      extension = ext,
                                  )
                                  break
                              }
                          }
                      }
                      result
                  } catch (_: Throwable) { null }
              }
          
              private suspend fun scanForFileRecursive(folderUri: Uri, bookName: String, maxDepth: Int): LibraryEntry? = withContext(Dispatchers.IO) {
                  if (maxDepth <= 0) return@withContext null
                  try {
                      val folderDocId = DocumentsContract.getDocumentId(folderUri)
                      val children = DocumentsContract.buildChildDocumentsUriUsingTree(folderUri, folderDocId)
                      val subfolders = mutableListOf<Uri>()
                      var found: LibraryEntry? = null
                      contentResolver.query(children, arrayOf(
                          Document.COLUMN_DOCUMENT_ID,
                          Document.COLUMN_DISPLAY_NAME,
                          Document.COLUMN_MIME_TYPE
                      ), null, null, null)?.use { c ->
                          val idIdx = c.getColumnIndexOrThrow(Document.COLUMN_DOCUMENT_ID)
                          val nameIdx = c.getColumnIndexOrThrow(Document.COLUMN_DISPLAY_NAME)
                          val mimeIdx = c.getColumnIndexOrThrow(Document.COLUMN_MIME_TYPE)
                          while (c.moveToNext()) {
                              val name = c.getString(nameIdx) ?: continue
                              val mime = c.getString(mimeIdx) ?: ""
                              val docId = c.getString(idIdx)
                              val docUri = DocumentsContract.buildDocumentUriUsingTree(folderUri, docId)
                              val isDir = mime == DocumentsContract.Document.MIME_TYPE_DIR
                              if (isDir) {
                                  subfolders.add(docUri)
                              } else if (name == bookName) {
                                  val ext = name.substringAfterLast('.', "").lowercase()
                                  found = LibraryEntry(
                                      fileName = name,
                                      title = name.substringBeforeLast('.'),
                                      cover = null,
                                      documentUri = docUri,
                                      extension = ext,
                                  )
                                  return@use
                              }
                          }
                      }
                      if (found != null) return@withContext found
                      // Recursión en subcarpetas.
                      for (sub in subfolders) {
                          val r = scanForFileRecursive(sub, bookName, maxDepth - 1)
                          if (r != null) return@withContext r
                      }
                      null
                  } catch (_: Throwable) { null }
              }
          }
