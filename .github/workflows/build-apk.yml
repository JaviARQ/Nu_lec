name: Build APK

on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout del repositorio
        uses: actions/checkout@v5

      - name: Setup Java 17 (Temurin)
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - name: Setup Gradle 9.3.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      - name: Aceptar licencias del Android SDK
        run: yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses > /dev/null || true

      - name: Instalar SDK Platform 37 + build-tools
        run: |
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager \
            "platforms;android-37" \
            "build-tools;37.0.0" > /dev/null || true

      - name: Restaurar keystore de firma (fijo)
        run: |
          mkdir -p app
          echo "$KEYSTORE_BASE64" | base64 -d > app/nulec.keystore
          ls -la app/nulec.keystore
        env:
          KEYSTORE_BASE64: 

      - name: Escribir archivos del proyecto
        run: |
          mkdir -p app/src/main/java/com/lector/epub
          mkdir -p app/src/main/res/layout
          mkdir -p app/src/main/res/values
          mkdir -p app/src/main/res/values-night
          mkdir -p app/src/main/res/drawable
          mkdir -p app/src/main/res/mipmap-anydpi-v26
          mkdir -p app/src/main/res/mipmap-mdpi
          mkdir -p app/src/main/res/mipmap-hdpi
          mkdir -p app/src/main/res/mipmap-xhdpi
          mkdir -p app/src/main/res/mipmap-xxhdpi
          mkdir -p app/src/main/res/mipmap-xxxhdpi

          cat > settings.gradle.kts <<'EOF'
                    pluginManagement {
                        repositories {
                            google()
                            mavenCentral()
                            gradlePluginPortal()
                        }
                    }
                    dependencyResolutionManagement {
                        repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
                        repositories {
                            google()
                            mavenCentral()
                            maven { url = uri("https://jitpack.io") }
                        }
                    }
                    rootProject.name = "Nu_lec"
                    include(":app")
          EOF

          cat > build.gradle.kts <<'EOF'
                    buildscript {
                        dependencies {
                            classpath("org.jetbrains.kotlin:kotlin-gradle-plugin:2.4.20")
                        }
                    }
                    plugins {
                        id("com.android.application") version "9.1.1" apply false
                    }
          EOF

          cat > gradle.properties <<'EOF'
                    android.useAndroidX=true
                    kotlin.code.style=official
                    org.gradle.jvmargs=-Xmx2g -Dfile.encoding=UTF-8
                    android.nonTransitiveRClass=true
          EOF

          cat > app/build.gradle.kts <<'EOF'
                    plugins {
                        id("com.android.application")
                    }
          
                    android {
                        namespace = "com.lector.epub"
                        compileSdk = 37
          
                        signingConfigs {
                            create("release") {
                                storeFile = file("nulec.keystore")
                                storePassword = "nulec2025"
                                keyAlias = "nulec"
                                keyPassword = "nulec2025"
                            }
                        }
          
                        defaultConfig {
                            applicationId = "com.lector.epub"
                            minSdk = 24
                            targetSdk = 35
                            versionCode = 13
                            versionName = "1.5"
                        }
          
                        buildTypes {
                            debug {
                                isMinifyEnabled = false
                                signingConfig = signingConfigs.getByName("release")
                            }
                        }
          
                        compileOptions {
                            sourceCompatibility = JavaVersion.VERSION_17
                            targetCompatibility = JavaVersion.VERSION_17
                            isCoreLibraryDesugaringEnabled = true
                        }
                        buildFeatures {
                            viewBinding = true
                        }
                    }
          
                    kotlin {
                        compilerOptions {
                            jvmTarget.set(org.jetbrains.kotlin.gradle.dsl.JvmTarget.JVM_17)
                        }
                    }
          
                    dependencies {
                        coreLibraryDesugaring("com.android.tools:desugar_jdk_libs:2.1.5")
                        implementation("androidx.core:core-ktx:1.13.1")
                        implementation("androidx.appcompat:appcompat:1.7.0")
                        implementation("com.google.android.material:material:1.12.0")
                        implementation("androidx.activity:activity-ktx:1.9.2")
                        implementation("androidx.fragment:fragment-ktx:1.8.3")
                        implementation("androidx.lifecycle:lifecycle-runtime-ktx:2.8.5")
                        implementation("androidx.recyclerview:recyclerview:1.3.2")
                        implementation("org.jetbrains.kotlinx:kotlinx-coroutines-android:1.8.1")
                        implementation("org.readium.kotlin-toolkit:readium-shared:3.4.0")
                        implementation("org.readium.kotlin-toolkit:readium-streamer:3.4.0")
                        implementation("org.readium.kotlin-toolkit:readium-navigator:3.4.0")
                    }
          EOF

          cat > app/src/main/AndroidManifest.xml <<'EOF'
                    <?xml version="1.0" encoding="utf-8"?>
                    <manifest xmlns:android="http://schemas.android.com/apk/res/android">
                        <application
                            android:name=".LectorApp"
                            android:allowBackup="true"
                            android:icon="@mipmap/ic_launcher"
                            android:roundIcon="@mipmap/ic_launcher_round"
                            android:label="@string/app_name"
                            android:supportsRtl="true"
                            android:theme="@style/Theme.NuLec">
                            <activity
                                android:name=".MainActivity"
                                android:exported="true"
                                android:configChanges="orientation|screenSize|keyboardHidden">
                                <intent-filter>
                                    <action android:name="android.intent.action.MAIN" />
                                    <category android:name="android.intent.category.LAUNCHER" />
                                </intent-filter>
                            </activity>
                        </application>
                    </manifest>
          EOF

          cat > app/src/main/java/com/lector/epub/LectorApp.kt <<'EOF'
                    package com.lector.epub
          
                    import android.app.Application
                    import org.readium.r2.shared.util.asset.AssetRetriever
                    import org.readium.r2.shared.util.http.DefaultHttpClient
                    import org.readium.r2.streamer.PublicationOpener
                    import org.readium.r2.streamer.parser.DefaultPublicationParser
          
                    class LectorApp : Application() {
                        lateinit var assetRetriever: AssetRetriever
                            private set
                        lateinit var publicationOpener: PublicationOpener
                            private set
                        override fun onCreate() {
                            super.onCreate()
                            val httpClient = DefaultHttpClient()
                            assetRetriever = AssetRetriever(contentResolver, httpClient)
                            publicationOpener = PublicationOpener(
                                publicationParser = DefaultPublicationParser(
                                    context = this,
                                    httpClient = httpClient,
                                    assetRetriever = assetRetriever,
                                    pdfFactory = null,
                                ),
                            )
                        }
                    }
          EOF

          cat > app/src/main/java/com/lector/epub/LibraryEntry.kt <<'EOF'
                    package com.lector.epub
          
                    import android.graphics.Bitmap
                    import android.net.Uri
          
                    /**
                     * Tipo de entrada en la biblioteca.
                     *  - BOOK: archivo .epub individual.
                     *  - COLLECTION: subcarpeta que contiene mas .epub.
                     */
                    enum class LibraryEntryType { BOOK, COLLECTION }
          
                    data class LibraryEntry(
                        val fileName: String,
                        val title: String,
                        val cover: Bitmap?,
                        val documentUri: Uri,
                        val type: LibraryEntryType = LibraryEntryType.BOOK,
                        val bookCount: Int = 0,
                    )
          EOF

          cat > app/src/main/java/com/lector/epub/LibraryAdapter.kt <<'EOF'
                    package com.lector.epub
          
                    import android.graphics.Canvas
                    import android.graphics.Color
                    import android.graphics.Outline
                    import android.graphics.Paint
                    import android.graphics.Rect
                    import android.graphics.Typeface
                    import android.graphics.drawable.GradientDrawable
                    import android.text.TextUtils
                    import android.view.Gravity
                    import android.view.View
                    import android.view.ViewGroup
                    import android.view.ViewOutlineProvider
                    import android.widget.ImageView
                    import android.widget.LinearLayout
                    import android.widget.TextView
                    import androidx.recyclerview.widget.RecyclerView
          
                    /**
                     * Biblioteca en rejilla: tarjetas con esquinas redondeadas, sombra suave,
                     * portada con placeholder generado cuando el EPUB no trae portada.
                     * Soporta tipo BOOK (libro individual) y COLLECTION (subcarpeta).
                     */
                    class LibraryAdapter(
                        private val items: MutableList<LibraryEntry> = mutableListOf(),
                        private val onClick: (LibraryEntry) -> Unit,
                    ) : RecyclerView.Adapter<LibraryAdapter.VH>() {
          
                        var isDark: Boolean = false
                            set(value) {
                                field = value
                                notifyDataSetChanged()
                            }
          
                        fun submit(newItems: List<LibraryEntry>) {
                            items.clear()
                            items.addAll(newItems)
                            notifyDataSetChanged()
                        }
          
                        inner class VH(val root: LinearLayout) : RecyclerView.ViewHolder(root) {
                            val cover: ImageView = (root.getChildAt(0) as ImageView)
                            val title: TextView = (root.getChildAt(1) as TextView)
                            val subtitle: TextView = (root.getChildAt(2) as TextView)
                        }
          
                        override fun onCreateViewHolder(parent: ViewGroup, viewType: Int): VH {
                            val ctx = parent.context
                            val dp = { v: Int -> (v * ctx.resources.displayMetrics.density).toInt() }
                            val density = ctx.resources.displayMetrics.density
          
                            val root = LinearLayout(ctx).apply {
                                orientation = LinearLayout.VERTICAL
                                gravity = Gravity.CENTER_HORIZONTAL
                                layoutParams = ViewGroup.LayoutParams(dp(112), ViewGroup.LayoutParams.WRAP_CONTENT)
                                setPadding(dp(6), dp(8), dp(6), dp(12))
                                clipToOutline = true
                                elevation = dp(3).toFloat()
                                outlineProvider = object : ViewOutlineProvider() {
                                    override fun getOutline(view: View, outline: Outline) {
                                        outline.setRoundRect(0, 0, view.width, view.height, 18 * density)
                                    }
                                }
                            }
                            val cover = ImageView(ctx).apply {
                                layoutParams = LinearLayout.LayoutParams(dp(100), dp(150))
                                scaleType = ImageView.ScaleType.CENTER_CROP
                                clipToOutline = true
                                outlineProvider = object : ViewOutlineProvider() {
                                    override fun getOutline(view: View, outline: Outline) {
                                        outline.setRoundRect(0, 0, view.width, view.height, 12 * density)
                                    }
                                }
                            }
                            val title = TextView(ctx).apply {
                                layoutParams = LinearLayout.LayoutParams(dp(100), ViewGroup.LayoutParams.WRAP_CONTENT)
                                maxLines = 2
                                ellipsize = TextUtils.TruncateAt.END
                                textSize = 12.5f
                                setTypeface(Typeface.create(Typeface.DEFAULT, Typeface.BOLD))
                                gravity = Gravity.CENTER_HORIZONTAL
                                setPadding(0, dp(10), 0, 0)
                                setLineSpacing(dp(2).toFloat(), 1f)
                            }
                            val subtitle = TextView(ctx).apply {
                                layoutParams = LinearLayout.LayoutParams(dp(100), ViewGroup.LayoutParams.WRAP_CONTENT)
                                maxLines = 1
                                ellipsize = TextUtils.TruncateAt.END
                                textSize = 10f
                                setTypeface(Typeface.DEFAULT)
                                gravity = Gravity.CENTER_HORIZONTAL
                                setPadding(0, dp(2), 0, 0)
                                visibility = View.GONE
                            }
                            root.addView(cover)
                            root.addView(title)
                            root.addView(subtitle)
                            return VH(root)
                        }
          
                        override fun onBindViewHolder(holder: VH, position: Int) {
                            val e = items[position]
                            val density = holder.root.resources.displayMetrics.density
          
                            if (e.type == LibraryEntryType.COLLECTION) {
                                holder.cover.setImageBitmap(folderPlaceholder(e.title, e.bookCount, isDark))
                                holder.title.text = e.title
                                holder.title.setTextColor(if (isDark) 0xFFEDEDED.toInt() else 0xFF1A1A1A.toInt())
                                holder.subtitle.text = "${e.bookCount} libros"
                                holder.subtitle.setTextColor(if (isDark) 0xFF8AB4F8.toInt() else 0xFF2563EB.toInt())
                                holder.subtitle.visibility = View.VISIBLE
                            } else {
                                if (e.cover != null) {
                                    holder.cover.setImageBitmap(e.cover)
                                } else {
                                    holder.cover.setImageBitmap(placeholderFor(e.title, isDark))
                                }
                                holder.title.text = e.title
                                holder.title.setTextColor(if (isDark) 0xFFEDEDED.toInt() else 0xFF1A1A1A.toInt())
                                holder.subtitle.visibility = View.GONE
                            }
          
                            val cardBg = GradientDrawable().apply {
                                cornerRadius = 18 * density
                                setColor(if (isDark) 0xFF1F1F1F.toInt() else 0xFFFFFFFF.toInt())
                            }
                            holder.root.background = cardBg
                            holder.root.setOnClickListener { onClick(e) }
                        }
          
                        private fun folderPlaceholder(name: String, count: Int, dark: Boolean): android.graphics.Bitmap {
                            val w = 200; val h = 300
                            val bmp = android.graphics.Bitmap.createBitmap(w, h, android.graphics.Bitmap.Config.ARGB_8888)
                            val canvas = Canvas(bmp)
                            val bgPaint = Paint().apply {
                                isAntiAlias = true
                                color = if (dark) 0xFF1E2A3A.toInt() else 0xFFE3EDF7.toInt()
                            }
                            canvas.drawRect(0f, 0f, w.toFloat(), h.toFloat(), bgPaint)
                            val folderPaint = Paint().apply {
                                isAntiAlias = true
                                color = if (dark) 0xFF8AB4F8.toInt() else 0xFF2563EB.toInt()
                            }
                            val rect = android.graphics.RectF(40f, 110f, 160f, 200f)
                            canvas.drawRoundRect(rect, 8f, 8f, folderPaint)
                            val tab = android.graphics.RectF(40f, 90f, 90f, 115f)
                            canvas.drawRoundRect(tab, 6f, 6f, folderPaint)
                            val tp = Paint().apply {
                                isAntiAlias = true
                                color = Color.WHITE
                                textAlign = Paint.Align.CENTER
                                textSize = 36f
                                typeface = Typeface.create(Typeface.DEFAULT, Typeface.BOLD)
                            }
                            canvas.drawText("$count", w / 2f, 170f, tp)
                            return bmp
                        }
          
                        private fun placeholderFor(title: String, dark: Boolean): android.graphics.Bitmap {
                            val w = 200; val h = 300
                            val bmp = android.graphics.Bitmap.createBitmap(w, h, android.graphics.Bitmap.Config.ARGB_8888)
                            val canvas = Canvas(bmp)
                            val hue = (title.hashCode().absoluteValue() % 360).toFloat()
                            val hsv1 = floatArrayOf(hue, 0.45f, if (dark) 0.30f else 0.85f)
                            val hsv2 = floatArrayOf((hue + 40) % 360, 0.50f, if (dark) 0.20f else 0.70f)
                            val paint = Paint().apply {
                                isAntiAlias = true
                                shader = android.graphics.LinearGradient(0f, 0f, w.toFloat(), h.toFloat(),
                                    intArrayOf(Color.HSVToColor(hsv1), Color.HSVToColor(hsv2)),
                                    null, android.graphics.Shader.TileMode.CLAMP)
                            }
                            canvas.drawRect(0f, 0f, w.toFloat(), h.toFloat(), paint)
                            val initials = title.split(" ", "_", "-")
                                .filter { it.isNotBlank() }
                                .take(2)
                                .joinToString("") { it.first().uppercaseChar().toString() }
                                .ifEmpty { "?" }
                            val tp = Paint().apply {
                                isAntiAlias = true
                                color = Color.WHITE
                                textAlign = Paint.Align.CENTER
                                textSize = 72f
                                typeface = Typeface.create(Typeface.DEFAULT, Typeface.BOLD)
                                setShadowLayer(8f, 0f, 2f, 0x44000000)
                            }
                            val r = Rect()
                            tp.getTextBounds(initials, 0, initials.length, r)
                            canvas.drawText(initials, w / 2f, h / 2f - r.exactCenterY(), tp)
                            return bmp
                        }
          
                        private fun Int.absoluteValue(): Int = if (this < 0) -this else this
          
                        override fun getItemCount(): Int = items.size
                    }
          EOF

          cat > app/src/main/java/com/lector/epub/MainActivity.kt <<'EOF'
                    package com.lector.epub
          
                    import android.content.Intent
                    import android.content.res.Configuration
                    import android.graphics.Bitmap
                    import android.graphics.Color
                    import android.graphics.Typeface
                    import android.graphics.drawable.GradientDrawable
                    import android.net.Uri
                    import android.os.Build
                    import android.os.Bundle
                    import android.provider.DocumentsContract
                    import android.provider.DocumentsContract.Document
                    import android.provider.OpenableColumns
                    import android.view.Gravity
                    import android.view.MotionEvent
                    import android.view.View
                    import android.view.WindowInsets
                    import android.view.WindowInsetsController
                    import android.widget.Button
                    import android.widget.FrameLayout
                    import android.widget.ImageButton
                    import android.widget.LinearLayout
                    import android.widget.ProgressBar
                    import android.widget.SeekBar
                    import android.widget.TextView
                    import android.widget.Toast
