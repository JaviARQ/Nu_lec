name: Build APK

on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout del repositorio
        uses: actions/checkout@v5

      - name: Setup Java 17 (Temurin)
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - name: Setup Gradle 9.3.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      - name: Aceptar licencias del Android SDK
        run: yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses > /dev/null || true

      - name: Instalar SDK Platform 37 + build-tools
        run: |
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager \
            "platforms;android-37" \
            "build-tools;37.0.0" > /dev/null || true

      - name: Restaurar keystore de firma (fijo)
        run: |
          mkdir -p app
          echo "$KEYSTORE_BASE64" | base64 -d > app/nulec.keystore
          ls -la app/nulec.keystore
        env:
          KEYSTORE_BASE64: 


      - name: Escribir archivos del proyecto
        run: |
          # --- settings.gradle.kts ---
          cat > settings.gradle.kts <<'EOF'
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
                  maven { url = uri("https://jitpack.io") }
              }
          }
          rootProject.name = "Nu_lec"
          include(":app")
          EOF

          # --- build.gradle.kts (root) ---
          cat > build.gradle.kts <<'EOF'
          buildscript {
              dependencies {
                  classpath("org.jetbrains.kotlin:kotlin-gradle-plugin:2.4.20")
              }
          }
          plugins {
              id("com.android.application") version "9.1.1" apply false
          }
          EOF

          # --- gradle.properties ---
          cat > gradle.properties <<'EOF'
          android.useAndroidX=true
          kotlin.code.style=official
          org.gradle.jvmargs=-Xmx2g -Dfile.encoding=UTF-8
          android.nonTransitiveRClass=true
          EOF

          # --- app/build.gradle.kts ---
          mkdir -p app
          cat > app/build.gradle.kts <<'EOF'
          plugins {
              id("com.android.application")
          }

          android {
              namespace = "com.lector.epub"
              compileSdk = 37

              signingConfigs {
                  create("release") {
                      storeFile = file("nulec.keystore")
                      storePassword = "nulec2025"
                      keyAlias = "nulec"
                      keyPassword = "nulec2025"
                  }
              }

              defaultConfig {
                  applicationId = "com.lector.epub"
                  minSdk = 24
                  targetSdk = 35
                  versionCode = 9
                  versionName = "1.1"
              }

              buildTypes {
                  debug {
                      isMinifyEnabled = false
                      signingConfig = signingConfigs.getByName("release")
                  }
              }

              compileOptions {
                  sourceCompatibility = JavaVersion.VERSION_17
                  targetCompatibility = JavaVersion.VERSION_17
                  isCoreLibraryDesugaringEnabled = true
              }
              buildFeatures {
                  viewBinding = true
              }
          }

          kotlin {
              compilerOptions {
                  jvmTarget.set(org.jetbrains.kotlin.gradle.dsl.JvmTarget.JVM_17)
              }
          }

          dependencies {
              coreLibraryDesugaring("com.android.tools:desugar_jdk_libs:2.1.5")
              implementation("androidx.core:core-ktx:1.13.1")
              implementation("androidx.appcompat:appcompat:1.7.0")
              implementation("com.google.android.material:material:1.12.0")
              implementation("androidx.activity:activity-ktx:1.9.2")
              implementation("androidx.fragment:fragment-ktx:1.8.3")
              implementation("androidx.lifecycle:lifecycle-runtime-ktx:2.8.5")
              implementation("androidx.recyclerview:recyclerview:1.3.2")
              implementation("org.jetbrains.kotlinx:kotlinx-coroutines-android:1.8.1")
              implementation("org.readium.kotlin-toolkit:readium-shared:3.4.0")
              implementation("org.readium.kotlin-toolkit:readium-streamer:3.4.0")
              implementation("org.readium.kotlin-toolkit:readium-navigator:3.4.0")
          }
          EOF

          # --- AndroidManifest.xml ---
          mkdir -p app/src/main/java/com/lector/epub
          mkdir -p app/src/main/res/layout
          mkdir -p app/src/main/res/values
          mkdir -p app/src/main/res/drawable

          cat > app/src/main/AndroidManifest.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <application
                  android:name=".LectorApp"
                  android:allowBackup="true"
                  android:icon="@drawable/ic_launcher"
                  android:label="@string/app_name"
                  android:supportsRtl="true"
                  android:theme="@style/Theme.NuLec">
                  <activity
                      android:name=".MainActivity"
                      android:exported="true"
                      android:configChanges="orientation|screenSize|keyboardHidden">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>
              </application>
          </manifest>
          EOF

          # --- LectorApp.kt ---
          cat > app/src/main/java/com/lector/epub/LectorApp.kt <<'EOF'
          package com.lector.epub

          import android.app.Application
          import org.readium.r2.shared.util.asset.AssetRetriever
          import org.readium.r2.shared.util.http.DefaultHttpClient
          import org.readium.r2.streamer.PublicationOpener
          import org.readium.r2.streamer.parser.DefaultPublicationParser

          class LectorApp : Application() {
              lateinit var assetRetriever: AssetRetriever
                  private set
              lateinit var publicationOpener: PublicationOpener
                  private set
              override fun onCreate() {
                  super.onCreate()
                  val httpClient = DefaultHttpClient()
                  assetRetriever = AssetRetriever(contentResolver, httpClient)
                  publicationOpener = PublicationOpener(
                      publicationParser = DefaultPublicationParser(
                          context = this,
                          httpClient = httpClient,
                          assetRetriever = assetRetriever,
                          pdfFactory = null,
                      ),
                  )
              }
          }
          EOF

          # --- LibraryEntry.kt ---
          cat > app/src/main/java/com/lector/epub/LibraryEntry.kt <<'EOF'
          package com.lector.epub

          import android.graphics.Bitmap
          import android.net.Uri

          data class LibraryEntry(
              val fileName: String,
              val title: String,
              val cover: Bitmap?,
              val documentUri: Uri,
          )
          EOF

          # --- LibraryAdapter.kt ---
          cat > app/src/main/java/com/lector/epub/LibraryAdapter.kt <<'EOF'
          package com.lector.epub

          import android.graphics.Outline
          import android.graphics.drawable.GradientDrawable
          import android.view.Gravity
          import android.view.View
          import android.view.ViewGroup
          import android.view.ViewOutlineProvider
          import android.widget.ImageView
          import android.widget.LinearLayout
          import android.widget.TextView
          import androidx.recyclerview.widget.RecyclerView

          /**
           * Biblioteca en rejilla: tarjetas redondeadas con sombra, portada con
           * esquinas redondeadas y titulo centrado. Soporta modo claro/oscuro.
           */
          class LibraryAdapter(
              private val items: MutableList<LibraryEntry> = mutableListOf(),
              private val onClick: (LibraryEntry) -> Unit,
          ) : RecyclerView.Adapter<LibraryAdapter.VH>() {

              /** Modo oscuro: repinta las tarjetas al cambiarlo. */
              var isDark: Boolean = false
                  set(value) {
                      field = value
                      notifyDataSetChanged()
                  }

              fun submit(newItems: List<LibraryEntry>) {
                  items.clear()
                  items.addAll(newItems)
                  notifyDataSetChanged()
              }

              inner class VH(val root: LinearLayout) : RecyclerView.ViewHolder(root) {
                  val card: LinearLayout = root as LinearLayout
                  val cover: ImageView = (root.getChildAt(0) as ImageView)
                  val title: TextView = (root.getChildAt(1) as TextView)
              }

              override fun onCreateViewHolder(parent: ViewGroup, viewType: Int): VH {
                  val ctx = parent.context
                  val dp = { v: Int -> (v * ctx.resources.displayMetrics.density).toInt() }
                  val density = ctx.resources.displayMetrics.density

                  val root = LinearLayout(ctx).apply {
                      orientation = LinearLayout.VERTICAL
                      gravity = Gravity.CENTER_HORIZONTAL
                      layoutParams = ViewGroup.LayoutParams(dp(120), ViewGroup.LayoutParams.WRAP_CONTENT)
                      setPadding(dp(6), dp(6), dp(6), dp(10))
                      clipToOutline = true
                      elevation = dp(4).toFloat()
                      outlineProvider = object : ViewOutlineProvider() {
                          override fun getOutline(view: View, outline: Outline) {
                              outline.setRoundRect(
                                  0, 0, view.width, view.height, 14 * density
                              )
                          }
                      }
                  }
                  val cover = ImageView(ctx).apply {
                      layoutParams = LinearLayout.LayoutParams(dp(104), dp(150))
                      scaleType = ImageView.ScaleType.CENTER_CROP
                      clipToOutline = true
                      outlineProvider = object : ViewOutlineProvider() {
                          override fun getOutline(view: View, outline: Outline) {
                              outline.setRoundRect(
                                  0, 0, view.width, view.height, 10 * density
                              )
                          }
                      }
                  }
                  val title = TextView(ctx).apply {
                      layoutParams = LinearLayout.LayoutParams(dp(104), ViewGroup.LayoutParams.WRAP_CONTENT)
                      maxLines = 2
                      ellipsize = android.text.TextUtils.TruncateAt.END
                      textSize = 12f
                      gravity = Gravity.CENTER_HORIZONTAL
                      setPadding(0, dp(8), 0, 0)
                  }
                  root.addView(cover)
                  root.addView(title)
                  return VH(root)
              }

              override fun onBindViewHolder(holder: VH, position: Int) {
                  val e = items[position]
                  holder.cover.setImageBitmap(e.cover)
                  holder.title.text = e.title
                  holder.title.setTextColor(if (isDark) 0xFFEDEDED.toInt() else 0xFF1A1A1A.toInt())
                  val cardBg = GradientDrawable().apply {
                      cornerRadius = 14 * holder.card.resources.displayMetrics.density
                      setColor(if (isDark) 0xFF1E1E1E.toInt() else 0xFFFFFFFF.toInt())
                  }
                  holder.card.background = cardBg
                  if (e.cover == null) {
                      holder.cover.setBackgroundColor(if (isDark) 0xFF2A2A2A.toInt() else 0xFFE8E4DC.toInt())
                  }
                  // Capturar la entrada directamente (evita bugs de posicion).
                  holder.card.setOnClickListener { onClick(e) }
              }

              override fun getItemCount(): Int = items.size
          }
          EOF

          # --- MainActivity.kt ---
          cat > app/src/main/java/com/lector/epub/MainActivity.kt <<'EOF'
          package com.lector.epub

          import android.content.Intent
          import android.content.res.Configuration
          import android.graphics.Bitmap
          import android.graphics.Color
          import android.graphics.drawable.GradientDrawable
          import android.net.Uri
          import android.os.Build
          import android.os.Bundle
          import android.provider.DocumentsContract
          import android.provider.DocumentsContract.Document
          import android.provider.OpenableColumns
          import android.view.Gravity
          import android.view.MotionEvent
          import android.view.View
          import android.view.WindowInsets
          import android.view.WindowInsetsController
          import android.widget.Button
          import android.widget.FrameLayout
          import android.widget.ImageButton
          import android.widget.LinearLayout
          import android.widget.ProgressBar
          import android.widget.SeekBar
          import android.widget.TextView
          import android.widget.Toast
          import androidx.activity.result.contract.ActivityResultContracts
          import androidx.appcompat.app.AppCompatActivity
          import androidx.lifecycle.lifecycleScope
          import androidx.recyclerview.widget.GridLayoutManager
          import androidx.recyclerview.widget.RecyclerView
          import kotlinx.coroutines.CoroutineScope
          import kotlinx.coroutines.Dispatchers
          import kotlinx.coroutines.Job
          import kotlinx.coroutines.SupervisorJob
          import kotlinx.coroutines.delay
          import kotlinx.coroutines.launch
          import kotlinx.coroutines.withContext
          import org.json.JSONObject
          import org.readium.r2.navigator.epub.EpubNavigatorFactory
          import org.readium.r2.navigator.epub.EpubNavigatorFragment
          import org.readium.r2.navigator.preferences.FontFamily
          import org.readium.r2.navigator.preferences.Theme
          import org.readium.r2.shared.ExperimentalReadiumApi
          import org.readium.r2.shared.publication.Link
          import org.readium.r2.shared.publication.Locator
          import org.readium.r2.shared.publication.services.cover
          import java.io.File
          import java.text.SimpleDateFormat
          import java.util.Date
          import java.util.Locale

          /**
           * Nu_lec - lector EPUB minimalista con sincronizacion de posicion.
           *
           * LIBRARY: rejilla de libros (portada + titulo) con tema claro/oscuro.
           *   Sin botones cuando ya hay biblioteca elegida (viven en Ajustes).
           * READER: pantalla completa inmersiva. Tap centro alterna overlays:
           *   arriba: [icono atras] titulo [icono ajustes]
           *   abajo:  [icono cap<] progreso global del libro [icono cap>] + capitulo.
           * AJUSTES: tema, brillo, fuente/tamano, carpeta biblioteca, abrir externo.
           */
          class MainActivity : AppCompatActivity() {

              private val app: LectorApp get() = application as LectorApp
              private val appScope = CoroutineScope(SupervisorJob() + Dispatchers.IO)
              private val density get() = resources.displayMetrics.density
              private fun dp(v: Int) = (v * density).toInt()

              // ----- Tema -----
              private val isDark: Boolean
                  get() = when (prefs().getString("pref_theme", "AUTO")) {
                      "DARK" -> true
                      "LIGHT" -> false
                      else -> (resources.configuration.uiMode and
                          Configuration.UI_MODE_NIGHT_MASK) == Configuration.UI_MODE_NIGHT_YES
                  }

              // ----- Vistas: LIBRARY -----
              private lateinit var libraryRoot: LinearLayout
              private lateinit var headerTitle: TextView
              private lateinit var headerSub: TextView
              private lateinit var libraryHint: TextView
              private lateinit var btnPickLibrary: Button
              private lateinit var btnOpenExternal: Button
              private lateinit var libraryRecycler: RecyclerView
              private val libraryAdapter = LibraryAdapter { entry ->
                  lifecycleScope.launch { openEpubFromLibrary(entry) }
              }

              // ----- Vistas: READER -----
              private lateinit var readerRoot: FrameLayout
              private lateinit var navContainer: FrameLayout
              private lateinit var topBar: LinearLayout
              private lateinit var topBarTitle: TextView
              private lateinit var bottomBar: LinearLayout
              private lateinit var progressText: TextView
              private lateinit var progressBar: ProgressBar
              private lateinit var chapterText: TextView

              // ----- Vistas: PANEL AJUSTES -----
              private lateinit var settingsPanel: LinearLayout
              private lateinit var brightnessSeekBar: SeekBar
              private lateinit var brightnessValue: TextView
              private lateinit var fontSizeValue: TextView
              private val themeChips = mutableListOf<Button>()
              private val fontChips = mutableListOf<Button>()
              private val otherChips = mutableListOf<Button>()
              private val sectionLabels = mutableListOf<TextView>()
              private var settingsVisible = false

              // ----- Estado -----
              private var navigator: EpubNavigatorFragment? = null
              private var currentBookName: String? = null
              private var sidecarJob: Job? = null
              private var lastLocator: Locator? = null
              private var lastTotalPages: Int = 1
              private var lastPageIndex: Int = 0
              private var chapters: List<Link> = emptyList()
              private var chapterIndex: Int = -1
              private var libraryTreeUri: Uri? = null

              private val openEpubLauncher = registerForActivityResult(
                  ActivityResultContracts.OpenDocument()
              ) { uri ->
                  if (uri != null) lifecycleScope.launch { openEpubExternal(uri) }
              }

              private val pickLibraryTreeLauncher = registerForActivityResult(
                  ActivityResultContracts.OpenDocumentTree()
              ) { uri ->
                  if (uri != null) {
                      contentResolver.takePersistableUriPermission(
                          uri,
                          Intent.FLAG_GRANT_READ_URI_PERMISSION or
                              Intent.FLAG_GRANT_WRITE_URI_PERMISSION
                      )
                      prefs().edit().putString("library_tree_uri", uri.toString()).apply()
                      libraryTreeUri = uri
                      refreshLibraryButtons()
                      applyGlobalTheme()
                      lifecycleScope.launch { reloadLibrary() }
                  }
              }

              @OptIn(ExperimentalReadiumApi::class)
              override fun onCreate(savedInstanceState: Bundle?) {
                  super.onCreate(savedInstanceState)
                  libraryTreeUri = prefs().getString("library_tree_uri", null)?.let {
                      runCatching { Uri.parse(it) }.getOrNull()
                  }
                  buildUI()
                  applyGlobalTheme()
                  if (libraryTreeUri != null) {
                      lifecycleScope.launch { reloadLibrary() }
                  }
              }

              // ============== CONSTRUCCION DE LA UI ==============

              private fun buildUI() {
                  val root = FrameLayout(this)

                  // ============== LIBRARY ==============
                  libraryRoot = LinearLayout(this).apply {
                      orientation = LinearLayout.VERTICAL
                      setPadding(dp(24), dp(56), dp(24), dp(24))
                  }
                  headerTitle = TextView(this).apply {
                      text = "Nu_lec"
                      textSize = 32f
                      letterSpacing = 0.02f
                      setPadding(dp(4), 0, 0, 0)
                  }
                  libraryRoot.addView(headerTitle)
                  headerSub = TextView(this).apply {
                      text = "Tu biblioteca"
                      textSize = 13f
                      setPadding(dp(4), dp(2), 0, dp(16))
                  }
                  libraryRoot.addView(headerSub)
                  libraryHint = TextView(this).apply {
                      textSize = 12f
                      setPadding(dp(4), 0, 0, dp(12))
                  }
                  libraryRoot.addView(libraryHint)
                  btnPickLibrary = Button(this).apply {
                      text = "Elegir carpeta biblioteca"
                        setOnClickListener { pickLibraryTreeLauncher.launch(null) }
                  }
                  libraryRoot.addView(btnPickLibrary)
                  btnOpenExternal = Button(this).apply {
                      text = "Abrir EPUB externo"
                      setOnClickListener {
                          openEpubLauncher.launch(arrayOf(
                              "application/epub+zip", "application/octet-stream"
                          ))
                      }
                  }
                  libraryRoot.addView(btnOpenExternal)
                  libraryRecycler = RecyclerView(this).apply {
                      layoutManager = GridLayoutManager(this@MainActivity, 3)
                      adapter = libraryAdapter
                      layoutParams = LinearLayout.LayoutParams(
                          LinearLayout.LayoutParams.MATCH_PARENT,
                          LinearLayout.LayoutParams.MATCH_PARENT
                      ).apply { topMargin = dp(8) }
                  }
                  libraryRoot.addView(libraryRecycler)
                  root.addView(libraryRoot, FrameLayout.LayoutParams(
                      FrameLayout.LayoutParams.MATCH_PARENT,
                      FrameLayout.LayoutParams.MATCH_PARENT
                  ))

                  // ============== READER ==============
                  readerRoot = FrameLayout(this).apply { visibility = View.GONE }
                  navContainer = FrameLayout(this).apply {
                      id = View.generateViewId()
                      setBackgroundColor(Color.BLACK)
                  }
                  readerRoot.addView(navContainer, FrameLayout.LayoutParams(
                      FrameLayout.LayoutParams.MATCH_PARENT,
                      FrameLayout.LayoutParams.MATCH_PARENT
                  ))

                  // ----- Top bar: [atras] titulo [ajustes] -----
                  topBar = LinearLayout(this).apply {
                      orientation = LinearLayout.HORIZONTAL
                      gravity = Gravity.CENTER_VERTICAL
                      setBackgroundColor(0xE6222222.toInt())
                      setPadding(dp(8), dp(28), dp(8), dp(8))
                      visibility = View.GONE
                  }
                  topBar.addView(ImageButton(this).apply {
                      setImageResource(R.drawable.ic_back)
                      background = null
                      setPadding(dp(12), dp(12), dp(12), dp(12))
                      setOnClickListener { closeBook() }
                  })
                  topBarTitle = TextView(this).apply {
                      textSize = 16f
                      maxLines = 1
                      setTextColor(Color.WHITE)
                      layoutParams = LinearLayout.LayoutParams(0, FrameLayout.LayoutParams.WRAP_CONTENT, 1f).apply {
                          marginStart = dp(8); marginEnd = dp(8)
                      }
                  }
                  topBar.addView(topBarTitle)
                  topBar.addView(ImageButton(this).apply {
                      setImageResource(R.drawable.ic_settings)
                      background = null
                      setPadding(dp(12), dp(12), dp(12), dp(12))
                      setOnClickListener { toggleSettingsPanel() }
                  })
                  readerRoot.addView(topBar, FrameLayout.LayoutParams(
                      FrameLayout.LayoutParams.MATCH_PARENT,
                      FrameLayout.LayoutParams.WRAP_CONTENT,
                      Gravity.TOP
                  ))

                  // ----- Bottom bar: [cap<] progreso [cap>] + capitulo -----
                  bottomBar = LinearLayout(this).apply {
                      orientation = LinearLayout.VERTICAL
                      setBackgroundColor(0xE6222222.toInt())
                      setPadding(dp(12), dp(12), dp(12), dp(28))
                      visibility = View.GONE
                  }
                  val progressRow = LinearLayout(this).apply {
                      orientation = LinearLayout.HORIZONTAL
                      gravity = Gravity.CENTER_VERTICAL
                  }
                  progressRow.addView(ImageButton(this).apply {
                      setImageResource(R.drawable.ic_prev_chapter)
                      background = null
                      setPadding(dp(10), dp(10), dp(10), dp(10))
                      setOnClickListener { goToChapter(-1) }
                  })
                  val progressCenter = LinearLayout(this).apply {
                      orientation = LinearLayout.VERTICAL
                      gravity = Gravity.CENTER_HORIZONTAL
                      layoutParams = LinearLayout.LayoutParams(0, FrameLayout.LayoutParams.WRAP_CONTENT, 1f)
                  }
                  progressText = TextView(this).apply {
                      text = "0% del libro"
                      setTextColor(Color.WHITE)
                      textSize = 13f
                      gravity = Gravity.CENTER_HORIZONTAL
                  }
                  progressBar = ProgressBar(this, null, android.R.attr.progressBarStyleHorizontal).apply {
                      max = 1000
                      progress = 0
                  }
                  progressCenter.addView(progressText)
                  progressCenter.addView(progressBar)
                  progressRow.addView(progressCenter)
                  progressRow.addView(ImageButton(this).apply {
                      setImageResource(R.drawable.ic_next_chapter)
                      background = null
                      setPadding(dp(10), dp(10), dp(10), dp(10))
                      setOnClickListener { goToChapter(+1) }
                  })
                  bottomBar.addView(progressRow)
                  chapterText = TextView(this).apply {
                      text = ""
                      setTextColor(0xFFB0B0B0.toInt())
                      textSize = 11f
                      maxLines = 1
                      gravity = Gravity.CENTER_HORIZONTAL
                      setPadding(0, dp(6), 0, 0)
                  }
                  bottomBar.addView(chapterText)
                  readerRoot.addView(bottomBar, FrameLayout.LayoutParams(
                      FrameLayout.LayoutParams.MATCH_PARENT,
                      FrameLayout.LayoutParams.WRAP_CONTENT,
                      Gravity.BOTTOM
                  ))

                  // ----- Panel de Ajustes -----
                  settingsPanel = LinearLayout(this).apply {
                      orientation = LinearLayout.VERTICAL
                      setPadding(dp(24), dp(28), dp(24), dp(28))
                      visibility = View.GONE
                      elevation = dp(12).toFloat()
                  }

                  fun sectionLabel(txt: String): TextView {
                      val tv = TextView(this).apply {
                          text = txt
                          textSize = 12f
                          letterSpacing = 0.08f
                          setPadding(dp(4), dp(18), 0, dp(6))
                      }
                      sectionLabels.add(tv)
                      return tv
                  }
                  fun chip(label: String, onClick: (View) -> Unit): Button {
                      val b = Button(this).apply {
                          text = label
                          setAllCaps(false)
                          textSize = 13f
                          setOnClickListener(onClick)
                          layoutParams = LinearLayout.LayoutParams(
                              0, FrameLayout.LayoutParams.WRAP_CONTENT, 1f
                          ).apply { marginEnd = dp(6) }
                      }
                      return b
                  }

                  settingsPanel.addView(sectionLabel("TEMA"))
                  val themeRow = LinearLayout(this)
                  themeChips.add(chip("Auto") { applyTheme(null) }.also(themeRow::addView))
                  themeChips.add(chip("Claro") { applyTheme(Theme.LIGHT) }.also(themeRow::addView))
                  themeChips.add(chip("Sepia") { applyTheme(Theme.SEPIA) }.also(themeRow::addView))
                  themeChips.add(chip("Oscuro") { applyTheme(Theme.DARK) }.also(themeRow::addView))
                  settingsPanel.addView(themeRow)

                  settingsPanel.addView(sectionLabel("BRILLO"))
                  val brightnessRow = LinearLayout(this).apply {
                      orientation = LinearLayout.HORIZONTAL
                      gravity = Gravity.CENTER_VERTICAL
                  }
                  brightnessSeekBar = SeekBar(this).apply {
                      max = 100
                      progress = (loadBrightness() * 100).toInt().coerceIn(0, 100)
                      setOnSeekBarChangeListener(object : SeekBar.OnSeekBarChangeListener {
                          override fun onProgressChanged(sb: SeekBar?, p: Int, fromUser: Boolean) {
                              if (fromUser) applyBrightness(p / 100f)
                              brightnessValue.text = "$p%"
                          }
                          override fun onStartTrackingTouch(sb: SeekBar?) {}
                          override fun onStopTrackingTouch(sb: SeekBar?) {
                              saveBrightness(brightnessSeekBar.progress / 100f)
                          }
                      })
                      layoutParams = LinearLayout.LayoutParams(0, FrameLayout.LayoutParams.WRAP_CONTENT, 1f)
                  }
                  brightnessValue = TextView(this).apply {
                      text = "${brightnessSeekBar.progress}%"
                      textSize = 13f
                      setPadding(dp(12), 0, 0, 0)
                  }
                  brightnessRow.addView(brightnessSeekBar)
                  brightnessRow.addView(brightnessValue)
                  settingsPanel.addView(brightnessRow)

                  settingsPanel.addView(sectionLabel("FUENTE"))
                  val fontRow = LinearLayout(this)
                  fontChips.add(chip("Original") { applyFontFamily("") }.also(fontRow::addView))
                  fontChips.add(chip("Serif") { applyFontFamily("PT Serif") }.also(fontRow::addView))
                  fontChips.add(chip("Sans") { applyFontFamily("Roboto") }.also(fontRow::addView))
                  fontChips.add(chip("Sans Pro") { applyFontFamily("Source Sans Pro") }.also(fontRow::addView))
                  settingsPanel.addView(fontRow)

                  val fontSizeRow = LinearLayout(this).apply {
                      orientation = LinearLayout.HORIZONTAL
                      gravity = Gravity.CENTER_VERTICAL
                  }
                  otherChips.add(chip("A-") { applyFontSizeDelta(-0.1) }.also(fontSizeRow::addView))
                  fontSizeValue = TextView(this).apply {
                      text = "100%"
                      textSize = 13f
                      gravity = Gravity.CENTER
                      layoutParams = LinearLayout.LayoutParams(0, FrameLayout.LayoutParams.WRAP_CONTENT, 1f)
                  }
                  fontSizeRow.addView(fontSizeValue)
                  otherChips.add(chip("A+") { applyFontSizeDelta(+0.1) }.also(fontSizeRow::addView))
                  settingsPanel.addView(fontSizeRow)

                  settingsPanel.addView(sectionLabel("BIBLIOTECA"))
                  otherChips.add(chip("Cambiar carpeta") { pickLibraryTreeLauncher.launch(null) }
                      .also(settingsPanel::addView))
                  otherChips.add(chip("Abrir EPUB externo") {
                      openEpubLauncher.launch(arrayOf(
                          "application/epub+zip", "application/octet-stream"
                      ))
                  }.also { b ->
                      b.layoutParams = LinearLayout.LayoutParams(
                          FrameLayout.LayoutParams.MATCH_PARENT,
                          FrameLayout.LayoutParams.WRAP_CONTENT
                      )
                      settingsPanel.addView(b)
                  })

                  readerRoot.addView(settingsPanel, FrameLayout.LayoutParams(
                      FrameLayout.LayoutParams.MATCH_PARENT,
                      FrameLayout.LayoutParams.WRAP_CONTENT,
                      Gravity.CENTER
                  ))

                  root.addView(readerRoot, FrameLayout.LayoutParams(
                      FrameLayout.LayoutParams.MATCH_PARENT,
                      FrameLayout.LayoutParams.MATCH_PARENT
                  ))

                  setContentView(root)
              }

              // ============== TEMA GLOBAL (biblioteca + ajustes) ==============

              private fun applyGlobalTheme() {
                  val dark = isDark
                  val bg = if (dark) 0xFF121212.toInt() else 0xFFFCFCFC.toInt()
                  val txt = if (dark) 0xFFF5F5F5.toInt() else 0xFF1A1A1A.toInt()
                  val sub = if (dark) 0xFF9E9E9E.toInt() else 0xFF757575.toInt()

                  libraryRoot.setBackgroundColor(bg)
                  headerTitle.setTextColor(txt)
                  headerSub.setTextColor(sub)
                  libraryHint.setTextColor(sub)
                  libraryAdapter.isDark = dark

                  // Panel de ajustes
                  val panelBg = GradientDrawable().apply {
                      cornerRadius = 20 * density
                      setColor(if (dark) 0xFF1E1E1E.toInt() else 0xFFF5F5F5.toInt())
                      setStroke(dp(1), if (dark) 0xFF333333.toInt() else 0xFFE0E0E0.toInt())
                  }
                  settingsPanel.background = panelBg
                  sectionLabels.forEach {
                      it.setTextColor(if (dark) 0xFF8AB4F8.toInt() else 0xFF3B6EA5.toInt())
                  }
                  fun paintChip(b: Button) {
                      val chipBg = GradientDrawable().apply {
                          cornerRadius = 20 * density
                          setColor(if (dark) 0xFF2E2E2E.toInt() else 0xFFEAEAEA.toInt())
                      }
                      b.background = chipBg
                      b.setTextColor(if (dark) 0xFFEDEDED.toInt() else 0xFF1A1A1A.toInt())
                  }
                  themeChips.forEach(::paintChip)
                  fontChips.forEach(::paintChip)
                  otherChips.forEach(::paintChip)
                  brightnessValue.setTextColor(txt)
                  fontSizeValue.setTextColor(txt)
              }

              /** Botones de la HOME: solo visibles si aun no hay biblioteca. */
              private fun refreshLibraryButtons() {
                  val hasLibrary = libraryTreeUri != null
                  btnPickLibrary.visibility = if (hasLibrary) View.GONE else View.VISIBLE
                  btnOpenExternal.visibility = if (hasLibrary) View.GONE else View.VISIBLE
              }

              // ============== LIBRARY ==============

              private suspend fun reloadLibrary() {
                  val tree = libraryTreeUri ?: return
                  refreshLibraryButtons()
                  libraryHint.text = "Cargando biblioteca..."
                  val entries = withContext(Dispatchers.IO) {
                      val treeDocId = DocumentsContract.getTreeDocumentId(tree)
                      val children = DocumentsContract.buildChildDocumentsUriUsingTree(tree, treeDocId)
                      val list = mutableListOf<LibraryEntry>()
                      contentResolver.query(children, arrayOf(
                          Document.COLUMN_DOCUMENT_ID,
                          Document.COLUMN_DISPLAY_NAME,
                          Document.COLUMN_MIME_TYPE
                      ), null, null, null)?.use { c ->
                          val idIdx = c.getColumnIndexOrThrow(Document.COLUMN_DOCUMENT_ID)
                          val nameIdx = c.getColumnIndexOrThrow(Document.COLUMN_DISPLAY_NAME)
                          val mimeIdx = c.getColumnIndexOrThrow(Document.COLUMN_MIME_TYPE)
                          while (c.moveToNext()) {
                              val name = c.getString(nameIdx) ?: continue
                              val mime = c.getString(mimeIdx) ?: ""
                              if (mime != "application/epub+zip" &&
                                  !name.lowercase().endsWith(".epub")) continue
                              val docId = c.getString(idIdx)
                              val docUri = DocumentsContract.buildDocumentUriUsingTree(tree, docId)
                              val meta = readMetadata(docUri, name)
                              list.add(LibraryEntry(
                                  fileName = name,
                                  title = meta.first,
                                  cover = meta.second,
                                  documentUri = docUri,
                              ))
                          }
                      }
                      list.sortedBy { it.title.lowercase() }
                  }
                  libraryAdapter.submit(entries)
                  headerSub.text = "${entries.size} libros en tu biblioteca"
                  libraryHint.text = ""
              }

              private suspend fun readMetadata(uri: Uri, fallbackName: String): Pair<String, Bitmap?> = withContext(Dispatchers.IO) {
                  try {
                      val cached = File.createTempFile("meta_", ".epub", cacheDir)
                      contentResolver.openInputStream(uri)?.use { input ->
                          cached.outputStream().use { input.copyTo(it) }
                      } ?: return@withContext fallbackName to null
                      val assetResult = app.assetRetriever.retrieve(cached)
                      val asset = assetResult.getOrNull()
                          ?: return@withContext fallbackName to null
                      val pubResult = app.publicationOpener.open(asset, allowUserInteraction = false)
                      val pub = pubResult.getOrNull() ?: return@withContext fallbackName to null
                      val title = pub.metadata.title ?: fallbackName
                      val cover = runCatching { pub.cover() }.getOrNull()
                      pub.close()
                      cached.delete()
                      title to cover
                  } catch (_: Throwable) {
                      fallbackName to null
                  }
              }

              private suspend fun openEpubFromLibrary(entry: LibraryEntry) {
                  openEpubInternal(uri = entry.documentUri, displayName = entry.fileName, title = entry.title)
              }

              private suspend fun openEpubExternal(uri: Uri) {
                  val name = queryDisplayName(uri) ?: "libro.epub"
                  openEpubInternal(uri = uri, displayName = name, title = name.substringBeforeLast('.'))
              }

              // ============== READER ==============

              @OptIn(ExperimentalReadiumApi::class)
              private suspend fun openEpubInternal(uri: Uri, displayName: String, title: String) {
                  try {
                      val cached = File(cacheDir, displayName)
                      withContext(Dispatchers.IO) {
                          contentResolver.openInputStream(uri)?.use { input ->
                              cached.outputStream().use { input.copyTo(it) }
                          } ?: error("No se pudo leer el archivo seleccionado")
                      }
                      currentBookName = displayName

                      val assetResult = withContext(Dispatchers.IO) {
                          app.assetRetriever.retrieve(cached)
                      }
                      val asset = assetResult.getOrNull()
                          ?: error("Readium no pudo leer el archivo: " +
                              "${assetResult.failureOrNull()?.message ?: "formato no reconocido"}")
                      val publicationResult = withContext(Dispatchers.IO) {
                          app.publicationOpener.open(asset, allowUserInteraction = true)
                      }
                      val publication = publicationResult.getOrNull()
                          ?: error("Readium no pudo abrir el EPUB: " +
                              "${publicationResult.failureOrNull()?.message ?: "error desconocido"}")

                      chapters = publication.readingOrder
                      chapterIndex = 0

                      val initialLocator = loadSidecar(displayName) ?: loadLocator(displayName)

                      libraryRoot.visibility = View.GONE
                      readerRoot.visibility = View.VISIBLE
                      enterImmersive()

                      val prefs = currentEpubPreferences()
                      val factory = EpubNavigatorFactory(publication = publication)
                      supportFragmentManager.fragmentFactory = factory.createFragmentFactory(
                          initialLocator = initialLocator,
                          initialPreferences = prefs,
                          paginationListener = object : EpubNavigatorFragment.PaginationListener {
                              override fun onPageChanged(pageIndex: Int, totalPages: Int, locator: Locator) {
                                  lastPageIndex = pageIndex
                                  lastTotalPages = totalPages
                              }
                          },
                      )
                      val frag = supportFragmentManager.fragmentFactory
                          .instantiate(classLoader, EpubNavigatorFragment::class.java.name)
                          as EpubNavigatorFragment
                      supportFragmentManager.beginTransaction()
                          .replace(navContainer.id, frag, "epub_nav")
                          .commitNowAllowingStateLoss()
                      navigator = frag
                      topBarTitle.text = title

                      lifecycleScope.launch {
                          frag.currentLocator.collect { locator ->
                              lastLocator = locator
                              saveLocator(displayName, locator)
                              sidecarJob?.cancel()
                              sidecarJob = appScope.launch {
                                  delay(2000)
                                  saveSidecar(displayName, locator)
                              }
                              updateProgress(locator)
                          }
                      }
                  } catch (e: Throwable) {
                      Toast.makeText(this, "Error: ${e.message}", Toast.LENGTH_LONG).show()
                      closeBook()
                  }
              }

              /** Progreso global del libro (no solo del capitulo). */
              private fun updateProgress(locator: Locator) {
                  // 1) Localizar capitulo actual por href.
                  val idx = chapters.indexOfFirst { it.url() == locator.href }
                  if (idx >= 0) chapterIndex = idx

                  // 2) Porcentaje global: Readium lo calcula en totalProgression.
                  //    Si no viene, aproximamos por capitulos.
                  val globalPct = locator.locations.totalProgression?.let { (it * 100).toInt() }
                      ?: run {
                          if (chapters.isEmpty()) 0
                          else {
                              val frac = if (lastTotalPages > 0)
                                  (lastPageIndex + 1).toDouble() / lastTotalPages else 0.5
                              (((chapterIndex.coerceAtLeast(0)) + frac) / chapters.size * 100).toInt()
                          }
                      }

                  progressBar.progress = (globalPct * 10).coerceIn(0, 1000)
                  progressText.text = "$globalPct% del libro"

                  // 3) Nombre del capitulo.
                  val chTitle = chapters.getOrNull(chapterIndex)?.title
                  chapterText.text = chTitle
                      ?: if (chapterIndex >= 0) "Capítulo ${chapterIndex + 1} de ${chapters.size}"
                      else ""
              }

              /** Salta al capitulo anterior/siguiente. */
              private fun goToChapter(delta: Int) {
                  val nav = navigator ?: return
                  if (chapters.isEmpty()) return
                  val idx = if (chapterIndex >= 0)
                      (chapterIndex + delta).coerceIn(0, chapters.lastIndex) else 0
                  nav.go(chapters[idx])
                  chapterIndex = idx
              }

              fun toggleReaderOverlay() {
                  if (settingsVisible) {
                      toggleSettingsPanel()
                      return
                  }
                  val newVisibility = if (topBar.visibility == View.VISIBLE) View.GONE else View.VISIBLE
                  topBar.visibility = newVisibility
                  bottomBar.visibility = newVisibility
              }

              private fun toggleSettingsPanel() {
                  settingsVisible = !settingsVisible
                  settingsPanel.visibility = if (settingsVisible) View.VISIBLE else View.GONE
                  if (settingsVisible) {
                      topBar.visibility = View.VISIBLE
                      bottomBar.visibility = View.VISIBLE
                      brightnessSeekBar.progress = (loadBrightness() * 100).toInt().coerceIn(0, 100)
                      brightnessValue.text = "${brightnessSeekBar.progress}%"
                      fontSizeValue.text = "${((loadFontSize() ?: 1.0) * 100).toInt()}%"
                  }
              }

              private fun closeBook() {
                  sidecarJob?.cancel()
                  val book = currentBookName
                  val loc = lastLocator
                  if (book != null && loc != null) {
                      appScope.launch { saveSidecar(book, loc) }
                  }
                  lastLocator = null
                  lastPageIndex = 0
                  lastTotalPages = 1
                  chapters = emptyList()
                  chapterIndex = -1
                  navigator?.let {
                      try {
                          supportFragmentManager.beginTransaction().remove(it)
                              .commitNowAllowingStateLoss()
                      } catch (_: Throwable) {}
                  }
                  navigator = null
                  currentBookName = null
                  exitImmersive()
                  settingsPanel.visibility = View.GONE
                  settingsVisible = false
                  topBar.visibility = View.GONE
                  bottomBar.visibility = View.GONE
                  readerRoot.visibility = View.GONE
                  libraryRoot.visibility = View.VISIBLE
                  lifecycleScope.launch { reloadLibrary() }
              }

              // ============== INMERSION (solo en lectura) ==============

              private fun enterImmersive() {
                  if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.R) {
                      window.setDecorFitsSystemWindows(false)
                      window.insetsController?.let {
                          it.systemBarsBehavior = WindowInsetsController.BEHAVIOR_SHOW_TRANSIENT_BARS_BY_SWIPE
                          it.hide(WindowInsets.Type.systemBars())
                      }
                  } else {
                      @Suppress("DEPRECATION")
                      window.decorView.systemUiVisibility = (
                          View.SYSTEM_UI_FLAG_IMMERSIVE_STICKY
                              or View.SYSTEM_UI_FLAG_FULLSCREEN
                              or View.SYSTEM_UI_FLAG_HIDE_NAVIGATION
                              or View.SYSTEM_UI_FLAG_LAYOUT_FULLSCREEN
                              or View.SYSTEM_UI_FLAG_LAYOUT_HIDE_NAVIGATION
                              or View.SYSTEM_UI_FLAG_LAYOUT_STABLE
                      )
                  }
              }

              private fun exitImmersive() {
                  if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.R) {
                      window.setDecorFitsSystemWindows(true)
                      window.insetsController?.show(WindowInsets.Type.systemBars())
                  } else {
                      @Suppress("DEPRECATION")
                      window.decorView.systemUiVisibility = View.SYSTEM_UI_FLAG_VISIBLE
                  }
              }

              // ============== PREFERENCIAS ==============

              @OptIn(ExperimentalReadiumApi::class)
              private fun currentEpubPreferences(): org.readium.r2.navigator.epub.EpubPreferences {
                  return org.readium.r2.navigator.epub.EpubPreferences(
                      theme = loadTheme(),
                      fontFamily = loadFontFamily()?.let { FontFamily(it) },
                      fontSize = loadFontSize(),
                  )
              }

              @OptIn(ExperimentalReadiumApi::class)
              private fun applyTheme(theme: Theme?) {
                  prefs().edit().putString("pref_theme", theme?.name ?: "AUTO").apply()
                  applyGlobalTheme()
                  navigator?.submitPreferences(currentEpubPreferences())
              }

              @OptIn(ExperimentalReadiumApi::class)
              private fun applyFontFamily(family: String) {
                  prefs().edit().putString("pref_font_family", family).apply()
                  navigator?.submitPreferences(currentEpubPreferences())
              }

              @OptIn(ExperimentalReadiumApi::class)
              private fun applyFontSizeDelta(delta: Double) {
                  val cur = loadFontSize() ?: 1.0
                  val new = (cur + delta).coerceIn(0.5, 3.0)
                  prefs().edit().putFloat("pref_font_size", new.toFloat()).apply()
                  fontSizeValue.text = "${(new * 100).toInt()}%"
                  navigator?.submitPreferences(currentEpubPreferences())
              }

              private fun applyBrightness(factor: Float) {
                  val lp = window.attributes
                  lp.screenBrightness = factor.coerceIn(0.01f, 1f)
                  window.attributes = lp
              }

              @OptIn(ExperimentalReadiumApi::class)
              private fun loadTheme(): Theme? = when (prefs().getString("pref_theme", "AUTO")) {
                  "LIGHT" -> Theme.LIGHT
                  "SEPIA" -> Theme.SEPIA
                  "DARK" -> Theme.DARK
                  else -> null
              }

              private fun loadFontFamily(): String? =
                  prefs().getString("pref_font_family", null)?.takeIf { it.isNotEmpty() }

              private fun loadFontSize(): Double? =
                  if (prefs().contains("pref_font_size"))
                      prefs().getFloat("pref_font_size", 1f).toDouble()
                  else null

              private fun loadBrightness(): Float =
                  prefs().getFloat("pref_brightness", 0.5f)

              private fun saveBrightness(factor: Float) {
                  prefs().edit().putFloat("pref_brightness", factor.coerceIn(0.01f, 1f)).apply()
              }

              // ============== BACK ==============

              @Suppress("DEPRECATION")
              override fun onBackPressed() {
                  if (readerRoot.visibility == View.VISIBLE) {
                      if (settingsVisible) toggleSettingsPanel()
                      else closeBook()
                  } else {
                      super.onBackPressed()
                  }
              }

              // Tap en el centro del lector -> toggle overlays.
              override fun dispatchTouchEvent(ev: MotionEvent): Boolean {
                  if (readerRoot.visibility == View.VISIBLE && ev.action == MotionEvent.ACTION_DOWN) {
                      val w = resources.displayMetrics.widthPixels
                      val h = resources.displayMetrics.heightPixels
                      val inCenterX = ev.x in (w * 0.30f)..(w * 0.70f)
                      val inCenterY = ev.y in (h * 0.30f)..(h * 0.70f)
                      if (settingsVisible) {
                          val panelLoc = IntArray(2)
                          settingsPanel.getLocationOnScreen(panelLoc)
                          val inPanel = ev.x >= panelLoc[0] && ev.x <= panelLoc[0] + settingsPanel.width &&
                              ev.y >= panelLoc[1] && ev.y <= panelLoc[1] + settingsPanel.height
                          if (!inPanel) {
                              toggleSettingsPanel()
                              return true
                          }
                      } else if (inCenterX && inCenterY) {
                          toggleReaderOverlay()
                          return true
                      }
                  }
                  return super.dispatchTouchEvent(ev)
              }

              // ============== PERSISTENCIA POSICION ==============

              private fun prefs() = getSharedPreferences("lector_positions", MODE_PRIVATE)

              private fun loadLocator(bookName: String): Locator? {
                  val json = prefs().getString(bookName, null) ?: return null
                  return runCatching { Locator.fromJSON(JSONObject(json)) }.getOrNull()
              }

              private fun saveLocator(bookName: String, locator: Locator) {
                  prefs().edit().putString(bookName, locator.toJSON().toString()).apply()
              }

              private suspend fun findSidecarUri(bookName: String): Uri? {
                  val tree = libraryTreeUri ?: return null
                  val sidecarName = bookName.substringBeforeLast('.') + ".json"
                  return withContext(Dispatchers.IO) {
                      val treeDocId = DocumentsContract.getTreeDocumentId(tree)
                      var found: Uri? = null
                      contentResolver.query(
                          DocumentsContract.buildChildDocumentsUriUsingTree(tree, treeDocId),
                          arrayOf(Document.COLUMN_DOCUMENT_ID, Document.COLUMN_DISPLAY_NAME),
                          null, null, null
                      )?.use { c ->
                          val idIdx = c.getColumnIndexOrThrow(Document.COLUMN_DOCUMENT_ID)
                          val nameIdx = c.getColumnIndexOrThrow(Document.COLUMN_DISPLAY_NAME)
                          while (c.moveToNext()) {
                              if (c.getString(nameIdx) == sidecarName) {
                                  found = DocumentsContract.buildDocumentUriUsingTree(
                                      tree, c.getString(idIdx)
                                  )
                                  break
                              }
                          }
                      }
                      found
                  }
              }

              private suspend fun loadSidecar(bookName: String): Locator? {
                  val uri = findSidecarUri(bookName) ?: return null
                  return withContext(Dispatchers.IO) {
                      val text = contentResolver.openInputStream(uri)?.use {
                          it.readBytes().toString(Charsets.UTF_8)
                      } ?: return@withContext null
                      runCatching {
                          Locator.fromJSON(JSONObject(text).getJSONObject("locator"))
                      }.getOrNull()
                  }
              }

              private suspend fun saveSidecar(bookName: String, locator: Locator) {
                  val tree = libraryTreeUri ?: return
                  val sidecarName = bookName.substringBeforeLast('.') + ".json"
                  val json = JSONObject().apply {
                      put("version", 1)
                      put("bookName", bookName)
                      put("locator", locator.toJSON())
                      put("updatedAt",
                          SimpleDateFormat("yyyy-MM-dd HH:mm:ss", Locale.US).format(Date()))
                  }.toString(2)
                  withContext(Dispatchers.IO) {
                      val treeDocId = DocumentsContract.getTreeDocumentId(tree)
                      val treeDocUri = DocumentsContract.buildDocumentUriUsingTree(tree, treeDocId)
                      var target = findSidecarUri(bookName)
                      if (target == null) {
                          target = DocumentsContract.createDocument(
                              contentResolver, treeDocUri,
                              "application/json", sidecarName
                          ) ?: return@withContext
                      }
                      contentResolver.openOutputStream(target, "wt")?.use { os ->
                          os.write(json.toByteArray(Charsets.UTF_8))
                          os.flush()
                      }
                  }
              }

              private fun queryDisplayName(uri: Uri): String? {
                  contentResolver.query(uri, null, null, null, null)?.use { c ->
                      val idx = c.getColumnIndex(OpenableColumns.DISPLAY_NAME)
                      if (idx >= 0 && c.moveToFirst()) return c.getString(idx)
                  }
                  return uri.lastPathSegment
              }
          }
