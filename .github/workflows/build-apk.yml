                  }
                  fontButtons.addView(fontBtn("Original", ""))
                  fontButtons.addView(fontBtn("Serif", "PT Serif"))
                  fontButtons.addView(fontBtn("Sans", "Roboto"))
                  fontButtons.addView(fontBtn("Sans Pro", "Source Sans Pro"))
                  settingsPanel.addView(fontButtons)

                  val fontSizeRow = LinearLayout(this).apply {
                      orientation = LinearLayout.HORIZONTAL
