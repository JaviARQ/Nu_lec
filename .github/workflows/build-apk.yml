name: Build APK

on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout del repositorio
        uses: actions/checkout@v5

      - name: Setup Java 17 (Temurin)
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - name: Setup Gradle 9.3.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      - name: Aceptar licencias del Android SDK
        run: yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses > /dev/null || true

      - name: Instalar SDK Platform 37 + build-tools
        run: |
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager \
            "platforms;android-37" \
            "build-tools;37.0.0" > /dev/null || true

      - name: Escribir archivos del proyecto
        run: |
          mkdir -p app/src/main/java/com/lector/epub
          mkdir -p app/src/main/res/layout
          mkdir -p app/src/main/res/values
          mkdir -p app/src/main/res/values-night
          mkdir -p app/src/main/res/drawable
          mkdir -p app/src/main/res/mipmap-anydpi-v26
          mkdir -p app/src/main/res/mipmap-mdpi
          mkdir -p app/src/main/res/mipmap-hdpi
          mkdir -p app/src/main/res/mipmap-xhdpi
          mkdir -p app/src/main/res/mipmap-xxhdpi
          mkdir -p app/src/main/res/mipmap-xxxhdpi

          cat > settings.gradle.kts <<'EOF'
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
                  maven { url = uri("https://jitpack.io") }
              }
          }
          rootProject.name = "Nu_lec"
          include(":app")
          EOF

          cat > build.gradle.kts <<'EOF'
          buildscript {
              dependencies {
                  classpath("org.jetbrains.kotlin:kotlin-gradle-plugin:2.4.20")
              }
          }
          plugins {
              id("com.android.application") version "9.1.1" apply false
          }
          EOF

          cat > gradle.properties <<'EOF'
          android.useAndroidX=true
          kotlin.code.style=official
          org.gradle.jvmargs=-Xmx2g -Dfile.encoding=UTF-8
          android.nonTransitiveRClass=true
          EOF

          cat > app/build.gradle.kts <<'EOF'
          plugins {
              id("com.android.application")
          }
          
          android {
              namespace = "com.lector.epub"
              compileSdk = 37
          
              defaultConfig {
                  applicationId = "com.lector.epub"
                  minSdk = 24
                  targetSdk = 35
                  versionCode = 48
                  versionName = "4.9"
              }
          
              buildTypes {
                  debug {
                      isMinifyEnabled = false
                  }
              }
          
              compileOptions {
                  sourceCompatibility = JavaVersion.VERSION_17
                  targetCompatibility = JavaVersion.VERSION_17
                  isCoreLibraryDesugaringEnabled = true
              }
              buildFeatures {
                  viewBinding = true
              }
          }
          
          kotlin {
              compilerOptions {
                  jvmTarget.set(org.jetbrains.kotlin.gradle.dsl.JvmTarget.JVM_17)
              }
          }
          
          dependencies {
              coreLibraryDesugaring("com.android.tools:desugar_jdk_libs:2.1.5")
              implementation("androidx.core:core-ktx:1.13.1")
              implementation("androidx.appcompat:appcompat:1.7.0")
              implementation("com.google.android.material:material:1.12.0")
              implementation("androidx.activity:activity-ktx:1.9.2")
              implementation("androidx.fragment:fragment-ktx:1.8.3")
              implementation("androidx.lifecycle:lifecycle-runtime-ktx:2.8.5")
              implementation("androidx.recyclerview:recyclerview:1.3.2")
              implementation("org.jetbrains.kotlinx:kotlinx-coroutines-android:1.8.1")
              implementation("org.readium.kotlin-toolkit:readium-shared:3.4.0")
              implementation("org.readium.kotlin-toolkit:readium-streamer:3.4.0")
              implementation("org.readium.kotlin-toolkit:readium-navigator:3.4.0")
              // Soporte CBR (Comic Book RAR) via junrar
              implementation("com.github.junrar:junrar:8.1.2")
              implementation("org.slf4j:slf4j-android:1.7.30")
          }
          EOF

          cat > app/src/main/AndroidManifest.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <application
                  android:name=".LectorApp"
                  android:allowBackup="true"
                  android:icon="@mipmap/ic_launcher"
                  android:roundIcon="@mipmap/ic_launcher_round"
                  android:label="@string/app_name"
                  android:supportsRtl="true"
                  android:theme="@style/Theme.NuLec">
                  <activity
                      android:name=".MainActivity"
                      android:exported="true"
                      android:configChanges="orientation|screenSize|keyboardHidden">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>
              </application>
          </manifest>
          EOF

          cat > app/src/main/java/com/lector/epub/LectorApp.kt <<'EOF'
          package com.lector.epub
          
          import android.app.Application
          import org.readium.r2.shared.util.asset.AssetRetriever
          import org.readium.r2.shared.util.http.DefaultHttpClient
          import org.readium.r2.streamer.PublicationOpener
          import org.readium.r2.streamer.parser.DefaultPublicationParser
          
          class LectorApp : Application() {
              lateinit var assetRetriever: AssetRetriever
                  private set
              lateinit var publicationOpener: PublicationOpener
                  private set
              override fun onCreate() {
                  super.onCreate()
                  val httpClient = DefaultHttpClient()
                  assetRetriever = AssetRetriever(contentResolver, httpClient)
                  publicationOpener = PublicationOpener(
                      publicationParser = DefaultPublicationParser(
                          context = this,
                          httpClient = httpClient,
                          assetRetriever = assetRetriever,
                          pdfFactory = null,
                      ),
                  )
              }
          }
          EOF

          cat > app/src/main/java/com/lector/epub/ComicConverter.kt <<'EOF'
          package com.lector.epub
          
          import android.content.Context
          import android.net.Uri
          import com.github.junrar.Archive
          import com.github.junrar.rarfile.FileHeader
          import java.io.File
          import java.io.FileOutputStream
              import java.util.zip.ZipEntry
              import java.util.zip.ZipOutputStream
          
          /**
           * Convierte archivos CBR (RAR de comics) a CBZ (ZIP de comics) en cache,
           * para que Readium pueda abrirlos (Readium NO soporta CBR nativamente).
           *
           * Estrategia: extrae las imagenes del RAR y las re-comprime como ZIP.
           * El resultado se guarda en cacheDir y se reutiliza si ya existe.
           */
          object ComicConverter {
          
              private val IMAGE_EXTS = setOf("jpg", "jpeg", "png", "webp", "gif", "bmp")
          
              /** Convierte un CBR a CBZ en cache. Devuelve el File del CBZ. */
              suspend fun convertCbrToCbz(context: Context, cbrUri: Uri, displayName: String): File = kotlinx.coroutines.withContext(kotlinx.coroutines.Dispatchers.IO) {
                  val cbzName = displayName.substringBeforeLast('.') + ".cbz"
                  val cached = File(context.cacheDir, cbzName)
                  if (cached.exists() && cached.length() > 0) {
                      return@withContext cached
                  }
          
                  // Copiar el CBR a un fichero temporal (junrar trabaja mejor con File que con InputStream)
                  val tempCbr = File.createTempFile("conv_", ".cbr", context.cacheDir)
                  try {
                      context.contentResolver.openInputStream(cbrUri)?.use { input ->
                          tempCbr.outputStream().use { input.copyTo(it) }
                      } ?: error("No se pudo leer el CBR")
                      // Abrir con junrar y comprimir imagenes como ZIP
                      ZipOutputStream(FileOutputStream(cached)).use { zos ->
                          zos.setLevel(0) // Las imagenes ya están comprimidas; no re-comprimir
                          Archive(tempCbr).use { archive ->
                              val imageHeaders = archive.fileHeaders
                                  .filter { !it.isDirectory }
                                  .filter { it.fileName.substringAfterLast('.', "").lowercase() in IMAGE_EXTS }
                                  .sortedBy { it.fileName }
                              for (header in imageHeaders) {
                                  zos.putNextEntry(ZipEntry(header.fileName))
                                  archive.getInputStream(header).use { input ->
                                      input.copyTo(zos)
                                  }
                                  zos.closeEntry()
                              }
                          }
                      }
                      cached
                  } finally {
                      tempCbr.delete()
                  }
              }
          }
          EOF

          cat > app/src/main/java/com/lector/epub/LibraryEntry.kt <<'EOF'
          package com.lector.epub
          
          import android.graphics.Bitmap
          import android.net.Uri
          import org.readium.r2.shared.publication.Locator
          
          /**
           * Tipo de contenido de una biblioteca.
           *  - EPUB: libros electrónicos (.epub)
           *  - COMIC: comics (.cbz / .cbr)
           */
          enum class LibraryMediaType { EPUB, COMIC }
          
          /**
           * Tipo de entrada en la biblioteca.
           *  - BOOK: archivo individual (.epub, .cbz o .cbr)
           *  - COLLECTION: subcarpeta que contiene mas archivos.
           */
          enum class LibraryEntryType { BOOK, COLLECTION }
          
          data class LibraryEntry(
              val fileName: String,
              val title: String,
              val cover: Bitmap?,
              val documentUri: Uri,
              val type: LibraryEntryType = LibraryEntryType.BOOK,
              val bookCount: Int = 0,
              /** Solo para BOOK: extension del archivo (epub, cbz, cbr). */
              val extension: String = "epub",
              /** Porcentaje de progreso de lectura (0-100). -1 = sin progreso. */
              val progressPct: Int = -1,
          )
          
          /**
           * Highlight (cita/subrayado) de un libro EPUB.
           * Se persiste en el sidecar JSON del libro, dentro del array `highlights`.
           * El campo `version` del sidecar pasa de 1 (solo posicion) a 2 (posicion + citas).
           */
          data class Highlight(
              val id: String,
              val text: String,
              val locator: Locator?,
              val color: String = "yellow",
              val note: String = "",
              val createdAt: String
          )
          EOF

          cat > app/src/main/java/com/lector/epub/LibraryAdapter.kt <<'EOF'
          package com.lector.epub
          
          import android.graphics.Canvas
          import android.graphics.Color
          import android.graphics.Outline
          import android.graphics.Paint
          import android.graphics.Rect
          import android.graphics.Typeface
          import android.graphics.drawable.GradientDrawable
          import android.text.TextUtils
          import android.view.Gravity
          import android.view.View
          import android.view.ViewGroup
          import android.view.ViewOutlineProvider
          import android.widget.ImageView
          import android.widget.LinearLayout
          import android.widget.TextView
          import androidx.recyclerview.widget.RecyclerView
          
          /**
           * Biblioteca en rejilla: tarjetas con esquinas redondeadas, sombra suave,
           * portada con placeholder generado cuando el EPUB no trae portada.
           * Soporta tipo BOOK (libro individual) y COLLECTION (subcarpeta).
           */
          class LibraryAdapter(
              private val items: MutableList<LibraryEntry> = mutableListOf(),
              private val onClick: (LibraryEntry) -> Unit,
          ) : RecyclerView.Adapter<LibraryAdapter.VH>() {
          
              var isDark: Boolean = false
                  set(value) {
                      field = value
                      notifyDataSetChanged()
                  }
          
              fun submit(newItems: List<LibraryEntry>) {
                  items.clear()
                  items.addAll(newItems)
                  notifyDataSetChanged()
              }
          
              inner class VH(val root: LinearLayout) : RecyclerView.ViewHolder(root) {
                  lateinit var cover: ImageView
                  lateinit var title: TextView
                  lateinit var subtitle: TextView
                  lateinit var progressLabel: TextView
                  lateinit var checkMark: TextView
              }
          
              override fun onCreateViewHolder(parent: ViewGroup, viewType: Int): VH {
                  val ctx = parent.context
                  val dp = { v: Int -> (v * ctx.resources.displayMetrics.density).toInt() }
                  val density = ctx.resources.displayMetrics.density
          
                  val root = LinearLayout(ctx).apply {
                      orientation = LinearLayout.VERTICAL
                      gravity = Gravity.CENTER_HORIZONTAL
                      layoutParams = ViewGroup.LayoutParams(dp(112), ViewGroup.LayoutParams.WRAP_CONTENT)
                      setPadding(dp(6), dp(8), dp(6), dp(12))
                      clipToOutline = true
                      elevation = dp(3).toFloat()
                      outlineProvider = object : ViewOutlineProvider() {
                          override fun getOutline(view: View, outline: Outline) {
                              outline.setRoundRect(0, 0, view.width, view.height, 18 * density)
                          }
                      }
                  }
                  // FrameLayout para superponer porcentaje y check sobre la portada.
                  val coverFrame = android.widget.FrameLayout(ctx).apply {
                      layoutParams = LinearLayout.LayoutParams(dp(100), dp(150))
                  }
                  val cover = ImageView(ctx).apply {
                      layoutParams = android.widget.FrameLayout.LayoutParams(
                          android.widget.FrameLayout.LayoutParams.MATCH_PARENT,
                          android.widget.FrameLayout.LayoutParams.MATCH_PARENT
                      )
                      scaleType = ImageView.ScaleType.CENTER_CROP
                      clipToOutline = true
                      outlineProvider = object : ViewOutlineProvider() {
                          override fun getOutline(view: View, outline: Outline) {
                              outline.setRoundRect(0, 0, view.width, view.height, 12 * density)
                          }
                      }
                  }
                  // Etiqueta de porcentaje superpuesta abajo-derecha.
                  val pctLabel = TextView(ctx).apply {
                      textSize = 9f
                      setTextColor(Color.WHITE)
                      setTypeface(Typeface.create(Typeface.DEFAULT, Typeface.BOLD))
                      setPadding(dp(4), dp(2), dp(4), dp(2))
                      background = GradientDrawable().apply {
                          cornerRadius = 6 * density
                          setColor(0xCC000000.toInt())
                      }
                      layoutParams = android.widget.FrameLayout.LayoutParams(
                          android.widget.FrameLayout.LayoutParams.WRAP_CONTENT,
                          android.widget.FrameLayout.LayoutParams.WRAP_CONTENT,
                          Gravity.BOTTOM or Gravity.END
                      )
                      visibility = View.GONE
                    }
                  // Check verde para libros completados.
                  val check = TextView(ctx).apply {
                      text = "\u2713"
                      textSize = 16f
                      setTextColor(0xFF4CAF50.toInt())
                      setTypeface(Typeface.create(Typeface.DEFAULT, Typeface.BOLD))
                      gravity = Gravity.CENTER
                      setBackgroundResource(android.R.color.transparent)
                      layoutParams = android.widget.FrameLayout.LayoutParams(
                          dp(24), dp(24), Gravity.TOP or Gravity.END
                      )
                      visibility = View.GONE
                  }
                  coverFrame.addView(cover)
                  coverFrame.addView(pctLabel)
                  coverFrame.addView(check)
                  val title = TextView(ctx).apply {
                      layoutParams = LinearLayout.LayoutParams(dp(100), ViewGroup.LayoutParams.WRAP_CONTENT)
                      maxLines = 2
                      ellipsize = TextUtils.TruncateAt.END
                      textSize = 12.5f
                      setTypeface(Typeface.create(Typeface.DEFAULT, Typeface.BOLD))
                      gravity = Gravity.CENTER_HORIZONTAL
                      setPadding(0, dp(10), 0, 0)
                      setLineSpacing(dp(2).toFloat(), 1f)
                  }
                  val subtitle = TextView(ctx).apply {
                      layoutParams = LinearLayout.LayoutParams(dp(100), ViewGroup.LayoutParams.WRAP_CONTENT)
                      maxLines = 1
                      ellipsize = TextUtils.TruncateAt.END
                      textSize = 10f
                      setTypeface(Typeface.DEFAULT)
                      gravity = Gravity.CENTER_HORIZONTAL
                      setPadding(0, dp(2), 0, 0)
                      visibility = View.GONE
                  }
                  root.addView(coverFrame)
                  root.addView(title)
                  root.addView(subtitle)
                  // Asignar referencias del VH.
                  val vh = VH(root)
                  vh.cover = cover
                    vh.title = title
                    vh.subtitle = subtitle
                    vh.progressLabel = pctLabel
                    vh.checkMark = check
                    return vh
              }
          
              override fun onBindViewHolder(holder: VH, position: Int) {
                  val e = items[position]
                  val density = holder.root.resources.displayMetrics.density
          
                  if (e.type == LibraryEntryType.COLLECTION) {
                      holder.cover.setImageBitmap(folderPlaceholder(e.title, e.bookCount, isDark))
                      holder.title.text = e.title
                      holder.title.setTextColor(if (isDark) 0xFFEDEDED.toInt() else 0xFF1A1A1A.toInt())
                      holder.subtitle.text = "${e.bookCount} libros"
                      holder.subtitle.setTextColor(if (isDark) 0xFF8AB4F8.toInt() else 0xFF2563EB.toInt())
                      holder.subtitle.visibility = View.VISIBLE
                      holder.progressLabel.visibility = View.GONE
                        holder.checkMark.visibility = View.GONE
                    } else {
                      if (e.cover != null) {
                          holder.cover.setImageBitmap(e.cover)
                      } else {
                          holder.cover.setImageBitmap(placeholderFor(e.title, isDark))
                      }
                      holder.title.text = e.title
                      holder.title.setTextColor(if (isDark) 0xFFEDEDED.toInt() else 0xFF1A1A1A.toInt())
                      holder.subtitle.visibility = View.GONE
                      // v43: mostrar porcentaje o check de completado.
                        if (e.progressPct >= 98) {
                            holder.progressLabel.visibility = View.GONE
                            holder.checkMark.visibility = View.VISIBLE
                        } else if (e.progressPct > 0) {
                            holder.progressLabel.text = "${e.progressPct}%"
                            holder.progressLabel.visibility = View.VISIBLE
                            holder.checkMark.visibility = View.GONE
                        } else {
                            holder.progressLabel.visibility = View.GONE
                            holder.checkMark.visibility = View.GONE
                        }
                  }
          
                  val cardBg = GradientDrawable().apply {
                      cornerRadius = 18 * density
                      setColor(if (isDark) 0xFF1F1F1F.toInt() else 0xFFFFFFFF.toInt())
                  }
                  holder.root.background = cardBg
                  holder.root.setOnClickListener { onClick(e) }
              }
          
              private fun folderPlaceholder(name: String, count: Int, dark: Boolean): android.graphics.Bitmap {
                  val w = 200; val h = 300
                  val bmp = android.graphics.Bitmap.createBitmap(w, h, android.graphics.Bitmap.Config.ARGB_8888)
                  val canvas = Canvas(bmp)
                  val bgPaint = Paint().apply {
                      isAntiAlias = true
                      color = if (dark) 0xFF1E2A3A.toInt() else 0xFFE3EDF7.toInt()
                  }
                  canvas.drawRect(0f, 0f, w.toFloat(), h.toFloat(), bgPaint)
                  val folderPaint = Paint().apply {
                      isAntiAlias = true
                      color = if (dark) 0xFF8AB4F8.toInt() else 0xFF2563EB.toInt()
                  }
                  val rect = android.graphics.RectF(40f, 110f, 160f, 200f)
                  canvas.drawRoundRect(rect, 8f, 8f, folderPaint)
                  val tab = android.graphics.RectF(40f, 90f, 90f, 115f)
                  canvas.drawRoundRect(tab, 6f, 6f, folderPaint)
                  val tp = Paint().apply {
                      isAntiAlias = true
                      color = Color.WHITE
                      textAlign = Paint.Align.CENTER
                      textSize = 36f
                      typeface = Typeface.create(Typeface.DEFAULT, Typeface.BOLD)
                  }
                  canvas.drawText("$count", w / 2f, 170f, tp)
                  return bmp
              }
          
              private fun placeholderFor(title: String, dark: Boolean): android.graphics.Bitmap {
                  val w = 200; val h = 300
                  val bmp = android.graphics.Bitmap.createBitmap(w, h, android.graphics.Bitmap.Config.ARGB_8888)
                  val canvas = Canvas(bmp)
                  val hue = (title.hashCode().absoluteValue() % 360).toFloat()
                  val hsv1 = floatArrayOf(hue, 0.45f, if (dark) 0.30f else 0.85f)
                  val hsv2 = floatArrayOf((hue + 40) % 360, 0.50f, if (dark) 0.20f else 0.70f)
                  val paint = Paint().apply {
                      isAntiAlias = true
                      shader = android.graphics.LinearGradient(0f, 0f, w.toFloat(), h.toFloat(),
                          intArrayOf(Color.HSVToColor(hsv1), Color.HSVToColor(hsv2)),
                          null, android.graphics.Shader.TileMode.CLAMP)
                  }
                  canvas.drawRect(0f, 0f, w.toFloat(), h.toFloat(), paint)
                  val initials = title.split(" ", "_", "-")
                      .filter { it.isNotBlank() }
                      .take(2)
                      .joinToString("") { it.first().uppercaseChar().toString() }
                      .ifEmpty { "?" }
                  val tp = Paint().apply {
                      isAntiAlias = true
                      color = Color.WHITE
                      textAlign = Paint.Align.CENTER
                      textSize = 72f
                      typeface = Typeface.create(Typeface.DEFAULT, Typeface.BOLD)
                      setShadowLayer(8f, 0f, 2f, 0x44000000)
                  }
                  val r = Rect()
                  tp.getTextBounds(initials, 0, initials.length, r)
                  canvas.drawText(initials, w / 2f, h / 2f - r.exactCenterY(), tp)
                  return bmp
              }
          
              private fun Int.absoluteValue(): Int = if (this < 0) -this else this
          
              override fun getItemCount(): Int = items.size
          }
          EOF

          cat > app/src/main/java/com/lector/epub/MainActivity.kt <<'EOF'
          package com.lector.epub
          
