name: Build APK

# Disparadores: cualquier push a main/master, o manual desde la pestaña Actions.
on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout del repositorio
        uses: actions/checkout@v5

      - name: Setup Java 17 (Temurin)
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - name: Setup Gradle 9.3.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      - name: Aceptar licencias del Android SDK
        run: yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses > /dev/null || true

      - name: Instalar SDK Platform 37 + build-tools
        # Readium 3.4 exige compileSdk 37. El runner trae 35/36 pero no 37.
        run: |
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager \
            "platforms;android-37" \
            "build-tools;37.0.0" > /dev/null || true

      # ============================================================
      # PROYECTO ANDROID (Kotlin) + READIUM 3.4.0
      # Todo el proyecto se genera aqui mismo con heredocs.
      # El usuario solo pega este archivo en .github/workflows/build-apk.yml
      # ============================================================
      - name: Escribir archivos del proyecto
        run: |
          # --- settings.gradle.kts ---
          cat > settings.gradle.kts <<'EOF'
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
                  maven { url = uri("https://jitpack.io") }
              }
          }
          rootProject.name = "Lector EPUB"
          include(":app")
          EOF

          # --- build.gradle.kts (root) ---
          cat > build.gradle.kts <<'EOF'
          // Readium 3.4.0 se compilo con Kotlin 2.4.x. AGP 9.1 trae KGP 2.2.10 por
          // defecto, que no entiende ese metadata. Se sobreescribe con buildscript
          // classpath (mecanismo oficial de AGP 9.x para subir la version de KGP).
          buildscript {
              dependencies {
                  classpath("org.jetbrains.kotlin:kotlin-gradle-plugin:2.4.20")
              }
          }

          plugins {
              id("com.android.application") version "9.1.1" apply false
          }
          EOF

          # --- gradle.properties ---
          cat > gradle.properties <<'EOF'
          android.useAndroidX=true
          kotlin.code.style=official
          org.gradle.jvmargs=-Xmx2g -Dfile.encoding=UTF-8
          android.nonTransitiveRClass=true
          EOF

          # --- app/build.gradle.kts ---
          mkdir -p app
          cat > app/build.gradle.kts <<'EOF'
          // AGP 9.x trae Kotlin integrado: no declaramos el plugin kotlin.android.
          plugins {
              id("com.android.application")
          }

          android {
              namespace = "com.lector.epub"
              compileSdk = 37

              defaultConfig {
                  applicationId = "com.lector.epub"
                  minSdk = 24
                  targetSdk = 35
                  versionCode = 4
                  versionName = "1.0"
              }

              buildTypes {
                  debug {
                      isMinifyEnabled = false
                  }
              }

              compileOptions {
                  sourceCompatibility = JavaVersion.VERSION_17
                  targetCompatibility = JavaVersion.VERSION_17
                  // Readium 3.4 exige "core library desugaring" habilitado.
                  isCoreLibraryDesugaringEnabled = true
              }
              buildFeatures {
                  viewBinding = true
              }
          }

          // En AGP 9.x, kotlinOptions{} dentro de android{} esta obsoleto.
          // Se define a nivel top-level con kotlin { compilerOptions {} }.
          kotlin {
              compilerOptions {
                  jvmTarget.set(org.jetbrains.kotlin.gradle.dsl.JvmTarget.JVM_17)
              }
          }

          dependencies {
              // Core library desugaring (exigido por Readium 3.4).
              coreLibraryDesugaring("com.android.tools:desugar_jdk_libs:2.1.5")

              implementation("androidx.core:core-ktx:1.13.1")
              implementation("androidx.appcompat:appcompat:1.7.0")
              implementation("com.google.android.material:material:1.12.0")
              implementation("androidx.activity:activity-ktx:1.9.2")
              implementation("androidx.fragment:fragment-ktx:1.8.3")
              implementation("androidx.lifecycle:lifecycle-runtime-ktx:2.8.5")
              implementation("org.jetbrains.kotlinx:kotlinx-coroutines-android:1.8.1")

              // Readium Kotlin Toolkit 3.4.0
              // groupId en Maven Central: org.readium.kotlin-toolkit
              // En 3.x el navegador EPUB (EpubNavigatorFactory/Fragment)
              // va dentro de readium-navigator (NO existe readium-navigator-epub).
              implementation("org.readium.kotlin-toolkit:readium-shared:3.4.0")
              implementation("org.readium.kotlin-toolkit:readium-streamer:3.4.0")
              implementation("org.readium.kotlin-toolkit:readium-navigator:3.4.0")
          }
          EOF

          # --- AndroidManifest.xml ---
          mkdir -p app/src/main/java/com/lector/epub
          mkdir -p app/src/main/res/layout
          mkdir -p app/src/main/res/values
          mkdir -p app/src/main/res/xml

          cat > app/src/main/AndroidManifest.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">

              <application
                  android:name=".LectorApp"
                  android:allowBackup="true"
                  android:label="@string/app_name"
                  android:supportsRtl="true"
                  android:theme="@style/Theme.LectorEpub">

                  <activity
                      android:name=".MainActivity"
                      android:exported="true">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>
              </application>

          </manifest>
          EOF

          # --- LectorApp.kt (Application, inicializa Readium una sola vez) ---
          cat > app/src/main/java/com/lector/epub/LectorApp.kt <<'EOF'
          package com.lector.epub

          import android.app.Application
          import org.readium.r2.shared.util.asset.AssetRetriever
          import org.readium.r2.shared.util.http.DefaultHttpClient
          import org.readium.r2.streamer.PublicationOpener
          import org.readium.r2.streamer.parser.DefaultPublicationParser

          /**
           * Application: aqui se inicializa el "motor" Readium una sola vez
           * mientras la app este abierta. No necesita configuracion manual.
           */
          class LectorApp : Application() {

              lateinit var assetRetriever: AssetRetriever
                  private set

              lateinit var publicationOpener: PublicationOpener
                  private set

              override fun onCreate() {
                  super.onCreate()
                  val httpClient = DefaultHttpClient()
                  assetRetriever = AssetRetriever(contentResolver, httpClient)
                  publicationOpener = PublicationOpener(
                      publicationParser = DefaultPublicationParser(
                          context = this,
                          httpClient = httpClient,
                          assetRetriever = assetRetriever,
                          // null: sin soporte PDF (solo EPUB).
                          pdfFactory = null,
                      ),
                  )
              }
          }
          EOF

          # --- MainActivity.kt (toda la logica de la app) ---
          cat > app/src/main/java/com/lector/epub/MainActivity.kt <<'EOF'
          package com.lector.epub

          import android.net.Uri
          import android.os.Bundle
          import android.provider.OpenableColumns
          import android.view.View
          import android.widget.FrameLayout
          import android.widget.LinearLayout
          import android.widget.TextView
          import android.widget.Toast
          import androidx.activity.result.contract.ActivityResultContracts
          import androidx.appcompat.app.AppCompatActivity
          import androidx.lifecycle.lifecycleScope
          import kotlinx.coroutines.Dispatchers
          import kotlinx.coroutines.launch
          import kotlinx.coroutines.withContext
          import org.json.JSONObject
          import org.readium.r2.navigator.epub.EpubNavigatorFactory
          import org.readium.r2.navigator.epub.EpubNavigatorFragment
          import org.readium.r2.shared.publication.Locator
          import java.io.File
          import java.text.SimpleDateFormat
          import java.util.Date
          import java.util.Locale

          /**
           * Actividad principal. Dos estados:
           *   - HOME:   boton Abrir EPUB + boton Importar posicion (JSON).
           *   - READER: boton Exportar posicion + boton Cerrar + el lector de Readium.
           *
           * La posicion de lectura se guarda internamente con el mismo nombre que
           * el EPUB. Exportar crea un archivo <nombre-del-libro>.json que se puede
           * copiar a otro dispositivo y cargar con "Importar posicion".
           */
          class MainActivity : AppCompatActivity() {

              private val app: LectorApp get() = application as LectorApp

              // Vistas (se crean por codigo, sin XML)
              private lateinit var homeView: LinearLayout
              private lateinit var readerView: LinearLayout
              private lateinit var navContainer: FrameLayout
              private lateinit var statusText: TextView

              // Estado
              private var currentFile: File? = null
              private var currentBookName: String? = null
              private var navigator: EpubNavigatorFragment? = null

              // Selector de EPUB
              private val openEpubLauncher = registerForActivityResult(
                  ActivityResultContracts.OpenDocument()
              ) { uri ->
                  if (uri != null) lifecycleScope.launch { openEpub(uri) }
              }

              // Exportar JSON: pide al usuario donde guardarlo (SAF)
              private val exportJsonLauncher = registerForActivityResult(
                  ActivityResultContracts.CreateDocument("application/json")
              ) { uri ->
                  if (uri != null) lifecycleScope.launch { exportJson(uri) }
              }

              // Importar JSON
              private val importJsonLauncher = registerForActivityResult(
                  ActivityResultContracts.OpenDocument()
              ) { uri ->
                  if (uri != null) lifecycleScope.launch { importJson(uri) }
              }

              override fun onCreate(savedInstanceState: Bundle?) {
                  super.onCreate(savedInstanceState)
                  buildUI()
              }

              private fun buildUI() {
                  val root = LinearLayout(this).apply {
                      orientation = LinearLayout.VERTICAL
                  }

                  // ----- HOME -----
                  homeView = LinearLayout(this).apply {
                      orientation = LinearLayout.VERTICAL
                      setPadding(64, 120, 64, 64)
                  }
                  homeView.addView(TextView(this).apply {
                      text = "Lector EPUB"
                      textSize = 28f
                      setPadding(0, 0, 0, 16)
                  })
                  homeView.addView(TextView(this).apply {
                      text = "Motor: Readium 3.4"
                      textSize = 14f
                      setPadding(0, 0, 0, 48)
                  })
                  val btnOpen = android.widget.Button(this).apply {
                      text = "Abrir EPUB"
                      setOnClickListener {
                          openEpubLauncher.launch(arrayOf(
                              "application/epub+zip",
                              "application/octet-stream"
                          ))
                      }
                  }
                  val btnImport = android.widget.Button(this).apply {
                      text = "Importar posicion (JSON)"
                      setOnClickListener {
                          importJsonLauncher.launch(arrayOf("application/json", "text/*"))
                      }
                  }
                  homeView.addView(btnOpen)
                  homeView.addView(btnImport)
                  statusText = TextView(this).apply {
                      setPadding(0, 32, 0, 0)
                      textSize = 13f
                  }
                  homeView.addView(statusText)

                  // ----- READER -----
                  readerView = LinearLayout(this).apply {
                      orientation = LinearLayout.VERTICAL
                      visibility = View.GONE
                  }
                  val topBar = LinearLayout(this).apply {
                      orientation = LinearLayout.HORIZONTAL
                      setPadding(32, 32, 32, 16)
                  }
                  topBar.addView(android.widget.Button(this).apply {
                      text = "Exportar posicion"
                      setOnClickListener {
                          val name = currentBookName?.substringBeforeLast('.') ?: "lector"
                          exportJsonLauncher.launch("$name.json")
                      }
                  })
                  topBar.addView(android.widget.Button(this).apply {
                      text = "Cerrar"
                      setOnClickListener { closeBook() }
                  })
                  readerView.addView(topBar)

                  navContainer = FrameLayout(this).apply {
                      id = View.generateViewId()
                      layoutParams = LinearLayout.LayoutParams(
                          LinearLayout.LayoutParams.MATCH_PARENT,
                          0,
                          1f
                      )
                  }
                  readerView.addView(navContainer)

                  root.addView(homeView, LinearLayout.LayoutParams(
                      LinearLayout.LayoutParams.MATCH_PARENT,
                      LinearLayout.LayoutParams.WRAP_CONTENT
                  ))
                  root.addView(readerView, LinearLayout.LayoutParams(
                      LinearLayout.LayoutParams.MATCH_PARENT,
                      LinearLayout.LayoutParams.MATCH_PARENT
                  ))
                  setContentView(root)
              }

              // ----- Abrir un EPUB desde un URI (SAF) -----
              private suspend fun openEpub(uri: Uri) {
                  statusText.text = "Abriendo..."
                  try {
                      val displayName = queryDisplayName(uri) ?: "libro.epub"
                      // Copiar a cacheDir: Readium trabaja mejor con un File real.
                      val cached = File(cacheDir, displayName)
                      withContext(Dispatchers.IO) {
                          contentResolver.openInputStream(uri)?.use { input ->
                              cached.outputStream().use { out -> input.copyTo(out) }
                          } ?: error("No se pudo leer el archivo seleccionado")
                      }

                      currentFile = cached
                      currentBookName = displayName

                      // 1. File -> Asset (Readium detecta el formato solo).
                      // OJO: en Readium 3.4 el tipo Try no permite encadenar
                      // extensiones aqui; getOrNull() y failureOrNull() son
                      // miembros directos y no necesitan import.
                      val assetResult = withContext(Dispatchers.IO) {
                          app.assetRetriever.retrieve(cached)
                      }
                      val asset = assetResult.getOrNull()
                          ?: error("Readium no pudo leer el archivo: ${assetResult.failureOrNull()?.message ?: "formato no reconocido"}")

                      // 2. Asset -> Publication
                      val publicationResult = withContext(Dispatchers.IO) {
                          app.publicationOpener.open(
                              asset = asset,
                              allowUserInteraction = true,
                          )
                      }
                      val publication = publicationResult.getOrNull()
                          ?: error("Readium no pudo abrir el EPUB: ${publicationResult.failureOrNull()?.message ?: "error desconocido"}")

                      // Buscar locator guardado (mismo nombre que el EPUB)
                      val initialLocator = loadLocator(displayName)

                      // Mostrar reader
                      homeView.visibility = View.GONE
                      readerView.visibility = View.VISIBLE

                      // Crear navigator y meterlo en el contenedor.
                      // listener = null (valor por defecto): no interceptamos taps ni
                      // enlaces externos, el navigator usa su comportamiento estandar.
                      val factory = EpubNavigatorFactory(publication = publication)
                      supportFragmentManager.fragmentFactory = factory.createFragmentFactory(
                          initialLocator = initialLocator,
                      )
                      val frag = supportFragmentManager.fragmentFactory
                          .instantiate(classLoader, EpubNavigatorFragment::class.java.name)
                          as EpubNavigatorFragment

                      supportFragmentManager.beginTransaction()
                          .replace(navContainer.id, frag, "epub_nav")
                          .commitNowAllowingStateLoss()

                      navigator = frag

                      // Escuchar cambios de posicion (Flow en v3) y guardar automaticamente
                      lifecycleScope.launch {
                          frag.currentLocator.collect { locator ->
                              saveLocator(displayName, locator)
                          }
                      }

                      statusText.text = ""
                  } catch (e: Throwable) {
                      statusText.text = ""
                      Toast.makeText(this, "Error: ${e.message}", Toast.LENGTH_LONG).show()
                      closeBook()
                  }
              }

              private fun closeBook() {
                  navigator?.let {
                      try {
                          supportFragmentManager.beginTransaction().remove(it)
                              .commitNowAllowingStateLoss()
                      } catch (_: Throwable) {}
                  }
                  navigator = null
                  currentFile = null
                  currentBookName = null
                  readerView.visibility = View.GONE
                  homeView.visibility = View.VISIBLE
              }

              // ----- Persistencia de la posicion (SharedPreferences) -----
              // Clave: nombre del archivo EPUB. Valor: JSON del Locator.
              private fun prefs() =
                  getSharedPreferences("lector_positions", MODE_PRIVATE)

              private fun loadLocator(bookName: String): Locator? {
                  val json = prefs().getString(bookName, null) ?: return null
                  return runCatching { Locator.fromJSON(JSONObject(json)) }.getOrNull()
              }

              private fun saveLocator(bookName: String, locator: Locator) {
                  val json = locator.toJSON().toString()
                  prefs().edit().putString(bookName, json).apply()
              }

              // ----- Exportar posicion a JSON sidecar -----
              private suspend fun exportJson(uri: Uri) {
                  try {
                      val locator = navigator?.currentLocator?.value
                          ?: error("No hay una posicion actual que exportar")
                      val bookName = currentBookName ?: "lector.epub"

                      val json = JSONObject().apply {
                          put("version", 1)
                          put("bookName", bookName)
                          put("locator", locator.toJSON())
                          put("updatedAt",
                              SimpleDateFormat("yyyy-MM-dd HH:mm:ss", Locale.US).format(Date()))
                      }.toString(2)

                      withContext(Dispatchers.IO) {
                          contentResolver.openOutputStream(uri)?.use { os ->
                              os.write(json.toByteArray(Charsets.UTF_8))
                          } ?: error("No se pudo escribir el archivo")
                      }
                      Toast.makeText(this, "Posicion exportada", Toast.LENGTH_SHORT).show()
                  } catch (e: Throwable) {
                      Toast.makeText(this, "Error exportando: ${e.message}", Toast.LENGTH_LONG).show()
                  }
              }

              // ----- Importar posicion desde JSON sidecar -----
              private suspend fun importJson(uri: Uri) {
                  try {
                      val text = withContext(Dispatchers.IO) {
                          contentResolver.openInputStream(uri)?.use { it.readBytes().toString(Charsets.UTF_8) }
                      } ?: error("No se pudo leer el JSON")

                      val json = JSONObject(text)
                      val bookName = json.getString("bookName")
                      val locator = Locator.fromJSON(json.getJSONObject("locator"))
                          ?: error("El JSON no contiene un Locator valido")

                      saveLocator(bookName, locator)

                      statusText.text = "Posicion importada para: $bookName"
                      Toast.makeText(this, "Importado: $bookName", Toast.LENGTH_LONG).show()
                  } catch (e: Throwable) {
                      Toast.makeText(this, "Error importando: ${e.message}", Toast.LENGTH_LONG).show()
                  }
              }

              // ----- Util: nombre real del archivo a partir de un URI SAF -----
              private fun queryDisplayName(uri: Uri): String? {
                  contentResolver.query(uri, null, null, null, null)?.use { c ->
                      val idx = c.getColumnIndex(OpenableColumns.DISPLAY_NAME)
                      if (idx >= 0 && c.moveToFirst()) return c.getString(idx)
                  }
                  return uri.lastPathSegment
              }
          }
          EOF

          # --- layout/activity_main.xml (placeholder, MainActivity crea vistas por codigo) ---
          cat > app/src/main/res/layout/activity_main.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <FrameLayout xmlns:android="http://schemas.android.com/apk/res/android"
              android:layout_width="match_parent"
              android:layout_height="match_parent" />
          EOF

          # --- values/strings.xml ---
          cat > app/src/main/res/values/strings.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <resources>
              <string name="app_name">Lector EPUB</string>
          </resources>
          EOF

          # --- values/colors.xml ---
          cat > app/src/main/res/values/colors.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <resources>
              <color name="black">#FF000000</color>
              <color name="white">#FFFFFFFF</color>
              <color name="bg">#FAFAFA</color>
          </resources>
          EOF

          # --- values/themes.xml ---
          cat > app/src/main/res/values/themes.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <resources>
              <style name="Theme.LectorEpub" parent="Theme.MaterialComponents.DayNight.NoActionBar">
                  <item name="android:windowBackground">@color/bg</item>
              </style>
          </resources>
          EOF

      # ============================================================
      # BUILD DEL APK
      # ============================================================
      - name: Build debug APK
        run: gradle assembleDebug --no-daemon --stacktrace

      - name: Subir artifact
        uses: actions/upload-artifact@v5
        with:
          name: lector-epub-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
