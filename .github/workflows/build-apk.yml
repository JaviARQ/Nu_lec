name: Build APK

on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout del repositorio
        uses: actions/checkout@v5

      - name: Setup Java 17 (Temurin)
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - name: Setup Gradle 9.3.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      - name: Aceptar licencias del Android SDK
        run: yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses > /dev/null || true

      - name: Instalar SDK Platform 37 + build-tools
        run: |
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager \
            "platforms;android-37" \
            "build-tools;37.0.0" > /dev/null || true

      - name: Escribir archivos del proyecto
        run: |
          # --- settings.gradle.kts ---
          cat > settings.gradle.kts <<'EOF'
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
                  maven { url = uri("https://jitpack.io") }
              }
          }
          rootProject.name = "Lector EPUB"
          include(":app")
          EOF

          # --- build.gradle.kts (root) ---
          cat > build.gradle.kts <<'EOF'
          buildscript {
              dependencies {
                  classpath("org.jetbrains.kotlin:kotlin-gradle-plugin:2.4.20")
              }
          }
          plugins {
              id("com.android.application") version "9.1.1" apply false
          }
          EOF

          # --- gradle.properties ---
          cat > gradle.properties <<'EOF'
          android.useAndroidX=true
          kotlin.code.style=official
          org.gradle.jvmargs=-Xmx2g -Dfile.encoding=UTF-8
          android.nonTransitiveRClass=true
          EOF

          # --- app/build.gradle.kts ---
          mkdir -p app
          cat > app/build.gradle.kts <<'EOF'
          plugins {
              id("com.android.application")
          }

          android {
              namespace = "com.lector.epub"
              compileSdk = 37

              defaultConfig {
                  applicationId = "com.lector.epub"
                  minSdk = 24
                  targetSdk = 35
                  versionCode = 7
                  versionName = "1.0"

                  // Nombre del APK de salida: Nu_lec-debug.apk
                  @Suppress("DEPRECATION")
                  setProperty("archivesBaseName", "Nu_lec")
              }

              buildTypes {
                  debug {
                      isMinifyEnabled = false
                  }
              }

              compileOptions {
                  sourceCompatibility = JavaVersion.VERSION_17
                  targetCompatibility = JavaVersion.VERSION_17
                  isCoreLibraryDesugaringEnabled = true
              }
              buildFeatures {
                  viewBinding = true
              }
          }

          kotlin {
              compilerOptions {
                  jvmTarget.set(org.jetbrains.kotlin.gradle.dsl.JvmTarget.JVM_17)
              }
          }

          dependencies {
              coreLibraryDesugaring("com.android.tools:desugar_jdk_libs:2.1.5")
              implementation("androidx.core:core-ktx:1.13.1")
              implementation("androidx.appcompat:appcompat:1.7.0")
              implementation("com.google.android.material:material:1.12.0")
              implementation("androidx.activity:activity-ktx:1.9.2")
              implementation("androidx.fragment:fragment-ktx:1.8.3")
              implementation("androidx.lifecycle:lifecycle-runtime-ktx:2.8.5")
              implementation("androidx.recyclerview:recyclerview:1.3.2")
              implementation("org.jetbrains.kotlinx:kotlinx-coroutines-android:1.8.1")
              implementation("org.readium.kotlin-toolkit:readium-shared:3.4.0")
              implementation("org.readium.kotlin-toolkit:readium-streamer:3.4.0")
              implementation("org.readium.kotlin-toolkit:readium-navigator:3.4.0")
          }
          EOF

          # --- AndroidManifest.xml ---
          mkdir -p app/src/main/java/com/lector/epub
          mkdir -p app/src/main/res/layout
          mkdir -p app/src/main/res/values

          cat > app/src/main/AndroidManifest.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <application
                  android:name=".LectorApp"
                  android:allowBackup="true"
                  android:label="@string/app_name"
                  android:supportsRtl="true"
                  android:theme="@style/Theme.LectorEpub">
                  <activity
                      android:name=".MainActivity"
                      android:exported="true"
                      android:configChanges="orientation|screenSize|keyboardHidden">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>
              </application>
          </manifest>
          EOF

          # --- LectorApp.kt ---
          cat > app/src/main/java/com/lector/epub/LectorApp.kt <<'EOF'
          package com.lector.epub

          import android.app.Application
          import org.readium.r2.shared.util.asset.AssetRetriever
          import org.readium.r2.shared.util.http.DefaultHttpClient
          import org.readium.r2.streamer.PublicationOpener
          import org.readium.r2.streamer.parser.DefaultPublicationParser

          class LectorApp : Application() {
              lateinit var assetRetriever: AssetRetriever
                  private set
              lateinit var publicationOpener: PublicationOpener
                  private set
              override fun onCreate() {
                  super.onCreate()
                  val httpClient = DefaultHttpClient()
                  assetRetriever = AssetRetriever(contentResolver, httpClient)
                  publicationOpener = PublicationOpener(
                      publicationParser = DefaultPublicationParser(
                          context = this,
                          httpClient = httpClient,
                          assetRetriever = assetRetriever,
                          pdfFactory = null,
                      ),
                  )
              }
          }
          EOF

          # --- LibraryEntry.kt ---
          cat > app/src/main/java/com/lector/epub/LibraryEntry.kt <<'EOF'
          package com.lector.epub

          import android.graphics.Bitmap
          import android.net.Uri

          data class LibraryEntry(
              val fileName: String,
              val title: String,
              val cover: Bitmap?,
              val documentUri: Uri,
          )
          EOF

          # --- LibraryAdapter.kt ---
          cat > app/src/main/java/com/lector/epub/LibraryAdapter.kt <<'EOF'
          package com.lector.epub

          import android.view.Gravity
          import android.view.ViewGroup
          import android.widget.ImageView
          import android.widget.LinearLayout
          import android.widget.TextView
          import androidx.recyclerview.widget.RecyclerView

          class LibraryAdapter(
              private val items: MutableList<LibraryEntry> = mutableListOf(),
              private val onClick: (LibraryEntry) -> Unit,
          ) : RecyclerView.Adapter<LibraryAdapter.VH>() {

              fun submit(newItems: List<LibraryEntry>) {
                  items.clear()
                  items.addAll(newItems)
                  notifyDataSetChanged()
              }

              inner class VH(val root: LinearLayout) : RecyclerView.ViewHolder(root) {
                  val cover: ImageView = (root.getChildAt(0) as ImageView)
                  val title: TextView = (root.getChildAt(1) as TextView)
              }

              override fun onCreateViewHolder(parent: ViewGroup, viewType: Int): VH {
                  val ctx = parent.context
                  val dp = { v: Int -> (v * ctx.resources.displayMetrics.density).toInt() }
                  val root = LinearLayout(ctx).apply {
                      orientation = LinearLayout.VERTICAL
                      layoutParams = ViewGroup.LayoutParams(dp(120), ViewGroup.LayoutParams.WRAP_CONTENT)
                      setPadding(dp(8), dp(8), dp(8), dp(8))
                  }
                  val cover = ImageView(ctx).apply {
                      layoutParams = LinearLayout.LayoutParams(dp(104), dp(150))
                      scaleType = ImageView.ScaleType.CENTER_CROP
                      setBackgroundColor(0xFFEEEEEE.toInt())
                  }
                  val title = TextView(ctx).apply {
                      layoutParams = LinearLayout.LayoutParams(dp(104), ViewGroup.LayoutParams.WRAP_CONTENT)
                      maxLines = 2
                      textSize = 12f
                      gravity = Gravity.CENTER_HORIZONTAL
                      setPadding(0, dp(4), 0, 0)
                  }
                  root.addView(cover)
                  root.addView(title)
                  return VH(root)
              }

              override fun onBindViewHolder(holder: VH, position: Int) {
                  val e = items[position]
                  holder.cover.setImageBitmap(e.cover)
                  holder.title.text = e.title
                  // Capturar la entrada directamente: evita el bug de bindingAdapterPosition
                  // dentro del lambda de onCreateViewHolder.
                  holder.root.setOnClickListener { onClick(e) }
              }

              override fun getItemCount(): Int = items.size
          }
          EOF

          # --- MainActivity.kt ---
          cat > app/src/main/java/com/lector/epub/MainActivity.kt <<'EOF'
          package com.lector.epub

          import android.content.Intent
          import android.graphics.Bitmap
          import android.graphics.Color
          import android.net.Uri
          import android.os.Build
          import android.os.Bundle
          import android.provider.DocumentsContract
          import android.provider.DocumentsContract.Document
          import android.provider.OpenableColumns
          import android.view.Gravity
          import android.view.MotionEvent
          import android.view.View
          import android.view.WindowInsets
          import android.view.WindowInsetsController
          import android.widget.Button
          import android.widget.FrameLayout
          import android.widget.LinearLayout
          import android.widget.ProgressBar
          import android.widget.SeekBar
          import android.widget.TextView
          import android.widget.Toast
          import androidx.activity.result.contract.ActivityResultContracts
          import androidx.appcompat.app.AppCompatActivity
          import androidx.lifecycle.lifecycleScope
          import androidx.recyclerview.widget.GridLayoutManager
          import androidx.recyclerview.widget.RecyclerView
          import kotlinx.coroutines.CoroutineScope
          import kotlinx.coroutines.Dispatchers
          import kotlinx.coroutines.Job
          import kotlinx.coroutines.SupervisorJob
          import kotlinx.coroutines.delay
          import kotlinx.coroutines.launch
          import kotlinx.coroutines.withContext
          import org.json.JSONObject
          import org.readium.r2.navigator.epub.EpubNavigatorFactory
          import org.readium.r2.navigator.epub.EpubNavigatorFragment
          import org.readium.r2.navigator.preferences.FontFamily
          import org.readium.r2.navigator.preferences.Theme
          import org.readium.r2.shared.ExperimentalReadiumApi
          import org.readium.r2.shared.publication.Locator
          import org.readium.r2.shared.publication.services.cover
          import java.io.File
          import java.text.SimpleDateFormat
          import java.util.Date
          import java.util.Locale

          class MainActivity : AppCompatActivity() {

              private val app: LectorApp get() = application as LectorApp
              private val appScope = CoroutineScope(SupervisorJob() + Dispatchers.IO)

              // ----- Vistas: LIBRARY -----
              private lateinit var libraryRoot: LinearLayout
              private lateinit var libraryHint: TextView
              private lateinit var libraryRecycler: RecyclerView
              private val libraryAdapter = LibraryAdapter { entry ->
                  lifecycleScope.launch { openEpubFromLibrary(entry) }
              }

              // ----- Vistas: READER -----
              private lateinit var readerRoot: FrameLayout
              private lateinit var navContainer: FrameLayout
              private lateinit var topBar: LinearLayout
              private lateinit var topBarTitle: TextView
              private lateinit var bottomBar: LinearLayout
              private lateinit var progressText: TextView
              private lateinit var progressBar: ProgressBar

              // ----- Vistas: PANEL DE AJUSTES -----
              private lateinit var settingsPanel: LinearLayout
              private lateinit var brightnessSeekBar: SeekBar
              private lateinit var brightnessValue: TextView
              private lateinit var fontSizeMinus: Button
              private lateinit var fontSizePlus: Button
              private lateinit var fontSizeValue: TextView
              private var settingsVisible = false

              // ----- Estado -----
              private var navigator: EpubNavigatorFragment? = null
              private var currentBookName: String? = null
              private var currentBookTitle: String? = null
              private var currentDocumentUri: Uri? = null
              private var sidecarJob: Job? = null
              private var lastLocator: Locator? = null
              private var lastTotalPages: Int = 1
              private var lastPageIndex: Int = 0
              private var libraryTreeUri: Uri? = null

              private val openEpubLauncher = registerForActivityResult(
                  ActivityResultContracts.OpenDocument()
              ) { uri ->
                  if (uri != null) lifecycleScope.launch { openEpubExternal(uri) }
              }

              private val pickLibraryTreeLauncher = registerForActivityResult(
                  ActivityResultContracts.OpenDocumentTree()
              ) { uri ->
                  if (uri != null) {
                      contentResolver.takePersistableUriPermission(
                          uri,
                          Intent.FLAG_GRANT_READ_URI_PERMISSION or
                              Intent.FLAG_GRANT_WRITE_URI_PERMISSION
                      )
                      prefs().edit().putString("library_tree_uri", uri.toString()).apply()
                      libraryTreeUri = uri
                      libraryHint.text = "Biblioteca: ${uri.lastPathSegment ?: uri}"
                      lifecycleScope.launch { reloadLibrary() }
                  }
              }

              @OptIn(ExperimentalReadiumApi::class)
              override fun onCreate(savedInstanceState: Bundle?) {
                  super.onCreate(savedInstanceState)
                  libraryTreeUri = prefs().getString("library_tree_uri", null)?.let {
                      runCatching { Uri.parse(it) }.getOrNull()
                  }
                  buildUI()
                  if (libraryTreeUri != null) {
                      libraryHint.text = "Biblioteca: ${libraryTreeUri!!.lastPathSegment ?: libraryTreeUri}"
                      lifecycleScope.launch { reloadLibrary() }
                  }
              }

              private fun buildUI() {
                  val dp = { v: Int -> (v * resources.displayMetrics.density).toInt() }
                  val root = FrameLayout(this).apply { setBackgroundColor(0xFFFAFAFA.toInt()) }

                  // ============== LIBRARY ==============
                  libraryRoot = LinearLayout(this).apply {
                      orientation = LinearLayout.VERTICAL
                      setPadding(dp(24), dp(48), dp(24), dp(24))
                  }
                  libraryRoot.addView(TextView(this).apply {
                      text = "Lector EPUB"
                      textSize = 28f
                      setPadding(0, 0, 0, dp(8))
                  })
                  libraryRoot.addView(TextView(this).apply {
                      text = "Biblioteca y lector de libros"
                      textSize = 13f
                      setPadding(0, 0, 0, dp(24))
                      setTextColor(0xFF888888.toInt())
                  })
                  libraryHint = TextView(this).apply {
                      textSize = 13f
                      setPadding(0, 0, 0, dp(8))
                      text = if (libraryTreeUri == null)
                          "Sin carpeta biblioteca. Elige una para que contenga tus EPUBs."
                      else "Biblioteca: ${libraryTreeUri?.lastPathSegment ?: libraryTreeUri}"
                  }
                  libraryRoot.addView(libraryHint)
                  libraryRoot.addView(Button(this).apply {
                      text = "Elegir carpeta biblioteca"
                      setOnClickListener { pickLibraryTreeLauncher.launch(null) }
                  })
                  libraryRoot.addView(Button(this).apply {
                      text = "Abrir EPUB externo"
                      setOnClickListener {
                          openEpubLauncher.launch(arrayOf(
                              "application/epub+zip", "application/octet-stream"
                          ))
                      }
                  })
                  libraryRecycler = RecyclerView(this).apply {
                      layoutManager = GridLayoutManager(this@MainActivity, 3)
                      adapter = libraryAdapter
                      layoutParams = LinearLayout.LayoutParams(
                          LinearLayout.LayoutParams.MATCH_PARENT,
                          LinearLayout.LayoutParams.MATCH_PARENT
                      ).apply { topMargin = dp(16) }
                  }
                  libraryRoot.addView(libraryRecycler)
                  root.addView(libraryRoot, FrameLayout.LayoutParams(
                      FrameLayout.LayoutParams.MATCH_PARENT,
                      FrameLayout.LayoutParams.MATCH_PARENT
                  ))

                  // ============== READER (fullscreen) ==============
                  readerRoot = FrameLayout(this).apply { visibility = View.GONE }
                  navContainer = FrameLayout(this).apply {
                      id = View.generateViewId()
                      setBackgroundColor(Color.BLACK)
                  }
                  readerRoot.addView(navContainer, FrameLayout.LayoutParams(
                      FrameLayout.LayoutParams.MATCH_PARENT,
                      FrameLayout.LayoutParams.MATCH_PARENT
                  ))

                  // ----- Top bar -----
                  topBar = LinearLayout(this).apply {
                      orientation = LinearLayout.HORIZONTAL
                      setBackgroundColor(0xCC000000.toInt())
                      setPadding(dp(16), dp(24), dp(16), dp(12))
                      visibility = View.GONE
                  }
                  topBar.addView(Button(this).apply {
                      text = "< Atras"
                      setOnClickListener { closeBook() }
                  })
                  topBarTitle = TextView(this).apply {
                      textSize = 14f
                      maxLines = 1
                      setTextColor(Color.WHITE)
                      layoutParams = LinearLayout.LayoutParams(0, FrameLayout.LayoutParams.WRAP_CONTENT, 1f).apply {
                          marginStart = dp(16); marginEnd = dp(16)
                      }
                  }
                  topBar.addView(topBarTitle)
                  topBar.addView(Button(this).apply {
                      text = "Ajustes"
                      setOnClickListener { toggleSettingsPanel() }
                  })
                  readerRoot.addView(topBar, FrameLayout.LayoutParams(
                      FrameLayout.LayoutParams.MATCH_PARENT,
                      FrameLayout.LayoutParams.WRAP_CONTENT,
                      Gravity.TOP
                  ))

                  // ----- Bottom bar: progreso -----
                  bottomBar = LinearLayout(this).apply {
                      orientation = LinearLayout.VERTICAL
                      setBackgroundColor(0xCC000000.toInt())
                      setPadding(dp(16), dp(12), dp(16), dp(24))
                      visibility = View.GONE
                  }
                  val progressRow = LinearLayout(this).apply { orientation = LinearLayout.HORIZONTAL }
                  progressText = TextView(this).apply {
                      text = "0 / 0"
                      setTextColor(Color.WHITE)
                      textSize = 12f
                  }
                  progressBar = ProgressBar(this, null, android.R.attr.progressBarStyleHorizontal).apply {
                      max = 100
                      progress = 0
                      layoutParams = LinearLayout.LayoutParams(0, FrameLayout.LayoutParams.WRAP_CONTENT, 1f).apply {
                          marginStart = dp(12); marginEnd = dp(12)
                      }
                  }
                  val chapterText = TextView(this).apply {
                      text = ""
                      setTextColor(0xFFCCCCCC.toInt())
                      textSize = 11f
                      maxLines = 1
                  }
                  progressRow.addView(progressText)
                  progressRow.addView(progressBar)
                  progressRow.addView(chapterText)
                  bottomBar.addView(progressRow)
                  readerRoot.addView(bottomBar, FrameLayout.LayoutParams(
                      FrameLayout.LayoutParams.MATCH_PARENT,
                      FrameLayout.LayoutParams.WRAP_CONTENT,
                      Gravity.BOTTOM
                  ))

                  // ----- Panel de Ajustes -----
                  settingsPanel = LinearLayout(this).apply {
                      orientation = LinearLayout.VERTICAL
                      setBackgroundColor(0xF2FFFFFF.toInt())
                      setPadding(dp(20), dp(28), dp(20), dp(28))
                      visibility = View.GONE
                      elevation = dp(8).toFloat()
                  }
                  settingsPanel.addView(TextView(this).apply {
                      text = "Tema"
                      textSize = 13f
                      setPadding(0, 0, 0, dp(4))
                  })
                  val themeButtons = LinearLayout(this).apply { orientation = LinearLayout.HORIZONTAL }
