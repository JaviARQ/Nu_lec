name: Build APK

on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout del repositorio
        uses: actions/checkout@v5

      - name: Setup Java 17 (Temurin)
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - name: Setup Gradle 9.3.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      - name: Aceptar licencias del Android SDK
        run: yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses > /dev/null || true

      - name: Instalar SDK Platform 37 + build-tools
        run: |
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager \
            "platforms;android-37" \
            "build-tools;37.0.0" > /dev/null || true

      - name: Restaurar keystore de firma (fijo)
        run: |
          mkdir -p app
          echo "$KEYSTORE_BASE64" | base64 -d > app/nulec.keystore
          ls -la app/nulec.keystore
        env:
          KEYSTORE_BASE64: 

      - name: Escribir archivos del proyecto
        run: |
          mkdir -p app/src/main/java/com/lector/epub
          mkdir -p app/src/main/res/layout
          mkdir -p app/src/main/res/values
          mkdir -p app/src/main/res/values-night
          mkdir -p app/src/main/res/drawable
          mkdir -p app/src/main/res/mipmap-anydpi-v26
          mkdir -p app/src/main/res/mipmap-mdpi
          mkdir -p app/src/main/res/mipmap-hdpi
          mkdir -p app/src/main/res/mipmap-xhdpi
          mkdir -p app/src/main/res/mipmap-xxhdpi
          mkdir -p app/src/main/res/mipmap-xxxhdpi

          cat > settings.gradle.kts <<'EOF'
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
                  maven { url = uri("https://jitpack.io") }
              }
          }
          rootProject.name = "Nu_lec"
          include(":app")
          EOF

          cat > build.gradle.kts <<'EOF'
          buildscript {
              dependencies {
                  classpath("org.jetbrains.kotlin:kotlin-gradle-plugin:2.4.20")
              }
          }
          plugins {
              id("com.android.application") version "9.1.1" apply false
          }
          EOF

          cat > gradle.properties <<'EOF'
          android.useAndroidX=true
          kotlin.code.style=official
          org.gradle.jvmargs=-Xmx2g -Dfile.encoding=UTF-8
          android.nonTransitiveRClass=true
          EOF

          cat > app/build.gradle.kts <<'EOF'
          plugins {
              id("com.android.application")
          }
          
          android {
              namespace = "com.lector.epub"
              compileSdk = 37
          
              signingConfigs {
                  create("release") {
                      storeFile = file("nulec.keystore")
                      storePassword = "nulec2025"
                      keyAlias = "nulec"
                      keyPassword = "nulec2025"
                  }
              }
          
              defaultConfig {
                  applicationId = "com.lector.epub"
                  minSdk = 24
                  targetSdk = 35
                  versionCode = 20
                  versionName = "1.9"
              }
          
              buildTypes {
                  debug {
                      isMinifyEnabled = false
                      signingConfig = signingConfigs.getByName("release")
                  }
              }
          
              compileOptions {
                  sourceCompatibility = JavaVersion.VERSION_17
                  targetCompatibility = JavaVersion.VERSION_17
                  isCoreLibraryDesugaringEnabled = true
              }
              buildFeatures {
                  viewBinding = true
              }
          }
          
          kotlin {
              compilerOptions {
                  jvmTarget.set(org.jetbrains.kotlin.gradle.dsl.JvmTarget.JVM_17)
              }
          }
          
          dependencies {
              coreLibraryDesugaring("com.android.tools:desugar_jdk_libs:2.1.5")
              implementation("androidx.core:core-ktx:1.13.1")
              implementation("androidx.appcompat:appcompat:1.7.0")
              implementation("com.google.android.material:material:1.12.0")
              implementation("androidx.activity:activity-ktx:1.9.2")
              implementation("androidx.fragment:fragment-ktx:1.8.3")
              implementation("androidx.lifecycle:lifecycle-runtime-ktx:2.8.5")
              implementation("androidx.recyclerview:recyclerview:1.3.2")
              implementation("org.jetbrains.kotlinx:kotlinx-coroutines-android:1.8.1")
              implementation("org.readium.kotlin-toolkit:readium-shared:3.4.0")
              implementation("org.readium.kotlin-toolkit:readium-streamer:3.4.0")
              implementation("org.readium.kotlin-toolkit:readium-navigator:3.4.0")
              // Soporte CBR (Comic Book RAR) via junrar
              implementation("com.github.junrar:junrar:8.1.2")
              implementation("org.slf4j:slf4j-android:1.7.30")
          }
          EOF

          cat > app/src/main/AndroidManifest.xml <<'EOF'
