                    import androidx.appcompat.app.AlertDialog
                    import androidx.appcompat.app.AppCompatActivity
                    import androidx.lifecycle.lifecycleScope
                    import androidx.recyclerview.widget.GridLayoutManager
                    import androidx.recyclerview.widget.RecyclerView
                    import kotlinx.coroutines.CoroutineScope
                    import kotlinx.coroutines.Dispatchers
                    import kotlinx.coroutines.Job
                    import kotlinx.coroutines.SupervisorJob
                    import kotlinx.coroutines.delay
                    import kotlinx.coroutines.launch
                    import kotlinx.coroutines.withContext
                    import org.json.JSONObject
                    import org.readium.r2.navigator.epub.EpubNavigatorFactory
                    import org.readium.r2.navigator.epub.EpubNavigatorFragment
                    import org.readium.r2.navigator.preferences.FontFamily
                    import org.readium.r2.navigator.preferences.Theme
                    import org.readium.r2.shared.ExperimentalReadiumApi
                    import org.readium.r2.shared.publication.Link
                    import org.readium.r2.shared.publication.Locator
                    import org.readium.r2.shared.publication.services.cover
                    import java.io.File
                    import java.text.SimpleDateFormat
                    import java.util.Date
                    import java.util.Locale
          
                    /**
                     * Nu_lec - lector EPUB minimalista con sincronizacion de posicion.
                     */
                    class MainActivity : AppCompatActivity() {
          
                        private val app: LectorApp get() = application as LectorApp
                        private val appScope = CoroutineScope(SupervisorJob() + Dispatchers.IO)
                        private val density get() = resources.displayMetrics.density
                        private fun dp(v: Int) = (v * density).toInt()
          
                        private val ACCENT = 0xFF2563EB.toInt()
                        private val ACCENT_DARK = 0xFF3B82F6.toInt()
          
                        private val isDark: Boolean
                            get() = when (prefs().getString("pref_theme", "AUTO")) {
                                "DARK" -> true
                                "LIGHT" -> false
                                else -> (resources.configuration.uiMode and
                                    Configuration.UI_MODE_NIGHT_MASK) == Configuration.UI_MODE_NIGHT_YES
                            }
          
                        // ----- Vistas: LIBRARY -----
                        private lateinit var libraryRoot: LinearLayout
                        private lateinit var headerTitle: TextView
                        private lateinit var headerSub: TextView
                        private lateinit var libraryHint: TextView
                        private lateinit var btnPickLibrary: Button
                        private lateinit var btnOpenExternal: Button
                        private lateinit var libraryRecycler: RecyclerView
                        private lateinit var btnBackFolder: ImageButton
                        private var currentFolderUri: Uri? = null
                        private val libraryAdapter = LibraryAdapter { entry ->
                            if (entry.type == LibraryEntryType.COLLECTION) {
                                lifecycleScope.launch { enterFolder(entry.documentUri, entry.title) }
                            } else {
                                lifecycleScope.launch { openEpubFromLibrary(entry) }
                            }
                        }
          
                        // ----- Vistas: READER -----
                        private lateinit var readerRoot: FrameLayout
                        private lateinit var navContainer: FrameLayout
                        private lateinit var topBar: LinearLayout
                        private lateinit var topBarTitle: TextView
                        private lateinit var bottomBar: LinearLayout
                        private lateinit var progressText: TextView
                        private lateinit var progressBar: ProgressBar
                        private lateinit var chapterText: TextView
                        private lateinit var btnPrevChapter: ImageButton
                        private lateinit var btnNextChapter: ImageButton
          
                        // ----- Vistas: PANEL AJUSTES -----
                        private lateinit var settingsPanel: LinearLayout
                        private lateinit var brightnessSeekBar: SeekBar
                        private lateinit var brightnessValue: TextView
                        private lateinit var fontSizeValue: TextView
                        private val themeChips = mutableListOf<Button>()
                        private val fontChips = mutableListOf<Button>()
                        private val otherChips = mutableListOf<Button>()
                        private val sectionLabels = mutableListOf<TextView>()
                        private var settingsVisible = false
          
                        // ----- Estado -----
                        private var navigator: EpubNavigatorFragment? = null
                        private var currentBookName: String? = null
                        private var currentBookFolderUri: Uri? = null
                        private var sidecarJob: Job? = null
                        private var lastLocator: Locator? = null
                        private var lastTotalPages: Int = 1
                        private var lastPageIndex: Int = 0
                        private var chapters: List<Link> = emptyList()
                        private var tableOfContents: List<Link> = emptyList()
                        private var chapterIndex: Int = -1
                        private var libraryTreeUri: Uri? = null
          
                        private val openEpubLauncher = registerForActivityResult(
                            ActivityResultContracts.OpenDocument()
                        ) { uri ->
                            if (uri != null) lifecycleScope.launch { openEpubExternal(uri) }
                        }
          
                        private val pickLibraryTreeLauncher = registerForActivityResult(
                            ActivityResultContracts.OpenDocumentTree()
                        ) { uri ->
                            if (uri != null) {
                                contentResolver.takePersistableUriPermission(
                                    uri,
                                    Intent.FLAG_GRANT_READ_URI_PERMISSION or
                                        Intent.FLAG_GRANT_WRITE_URI_PERMISSION
                                )
                                prefs().edit().putString("library_tree_uri", uri.toString()).apply()
                                libraryTreeUri = uri
                                currentFolderUri = null
                                refreshLibraryButtons()
                                applyGlobalTheme()
                                lifecycleScope.launch { reloadLibrary() }
                            }
                        }
          
                        @OptIn(ExperimentalReadiumApi::class)
                        override fun onCreate(savedInstanceState: Bundle?) {
                            super.onCreate(savedInstanceState)
